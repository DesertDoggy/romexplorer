[workspace]
# The GUI (Dioxus) is its own crate so its dependencies stay out of every existing lib /
# bin / test build here; `cargo build` in this directory still builds just `romexplorer`.
members = [".", "romexplorer-gui", "romexplorer-types", "chdlite"]
default-members = ["."]
resolver = "2"

# One version for every crate here, so the packaging scripts and the release tag have a
# single source of truth. `src/database/playmatch_deredis` deliberately keeps its own: its
# CARGO_PKG_VERSION is playmatch's, and goes out as that client's X-Version header.
[workspace.package]
version = "0.2.0"
edition = "2021"
repository = "https://github.com/DesertDoggy/romexplorer"

[package]
name = "romexplorer"
version.workspace = true
edition.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "biosdb_gen"
path = "tools/biosdb_gen.rs"

[[bin]]
name = "snes_capture"
path = "tools/snes_capture.rs"

[[test]]
name = "test_archiver"
path = "tests/src/test_archiver.rs"

[[test]]
name = "test_detect"
path = "tests/src/test_detect.rs"

[[test]]
name = "test_hasher"
path = "tests/src/test_hasher.rs"

[[test]]
name = "test_wiiu"
path = "tests/src/test_wiiu.rs"

[[test]]
name = "test_xbox"
path = "tests/src/test_xbox.rs"

[[test]]
name = "test_serial"
path = "tests/src/test_serial.rs"

[[test]]
name = "test_pbp"
path = "tests/src/test_pbp.rs"

[[test]]
name = "test_converter"
path = "tests/src/test_converter.rs"

[[test]]
name = "bench_streaming"
path = "tests/src/bench_streaming.rs"

[[test]]
name = "test_operation"
path = "tests/src/test_operation.rs"

[[test]]
