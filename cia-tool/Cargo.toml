[package]
name = "cia-tool"
version = "0.1.0"
# cia-tool's own edition: its code uses let-chains.
edition = "2024"
description = "Decrypt Nintendo 3DS CIA and CCI (.3ds) files natively"
license = "AGPL-3.0-or-later"

# The library of DesertDoggy's cia-tool (its command-line front end is left out), copied in
# so romexplorer and chdlite can decrypt 3DS titles. No console keys come with it.

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
cbc = "0.1"
ctr = "0.9"
encoding_rs = "0.8.44"
sha2 = "0.10"

[features]
# Builders of encrypted test files (`testkit`), for this crate's tests and romexplorer's.
testkit = []

[dev-dependencies]
cia-tool = { path = ".", features = ["testkit"] }
tempfile = "3.27.0"
