# Read by `dx` only, for the Android app (scripts/build_rommusic_android.sh). The desktop
# window is built with plain cargo and never looks at this file.

[application]
name = "rommusic"
# Both replace dx's generated ones; see the comments at the top of each.
android_manifest = "android/AndroidManifest.xml"
android_main_activity = "android/MainActivity.kt"

[bundle]
# Also hard-coded in android/MainActivity.kt (`typealias BuildConfig`).
identifier = "com.desertdoggy.rommusic"
publisher = "DesertDoggy"
# The desktop bundles' icon. dx ignores it on Android: the launcher icon is android/res/
# (scripts/make_android_icons.py), which the build script puts over dx's.
icon = ["assets/icon.png"]

[android]
# Android 9: the music libraries use iconv, which Android's libc has from API 28 on
# (deps/rommusic/scripts/build.sh). All files access (MANAGE_EXTERNAL_STORAGE) is Android 11;
# android/MainActivity.kt asks for the old storage permission below that.
min_sdk = 28
target_sdk = 35
compile_sdk = 35
