      box.appendChild(el(`<div class="muted">${trf('Icon/favicon URL shown before a value (platform, region, language, source). Without one, platforms use <span class="mono">{dir}/&lt;slug&gt;.png|svg</span> or the built-in silhouette, regions/languages an emoji flag.', { dir: esc(vocab.icons_dir || 'assets/icons') })}</div>`));
      const t = el(`<table class="grid"><thead><tr><th>${tr('kind')}</th><th>${tr('value')}</th><th>${tr('url')}</th><th></th></tr></thead><tbody></tbody></table>`); const tb = t.querySelector('tbody');
      function row(kind, v, url) { const r = el(`<tr><td>${esc(kind)}</td><td>${esc(v)}</td><td><input type="text" style="min-width:320px" value="${esc(url)}"></td><td><button class="btn small danger" type="button">×</button></td></tr>`); r.querySelector('input').oninput = e => { (current[kind] = current[kind] || {})[v] = e.target.value; }; r.querySelector('button').onclick = () => { delete current[kind][v]; r.remove(); }; tb.appendChild(r); }
      for (const [kind, m] of Object.entries(current)) for (const [v, url] of Object.entries(m || {})) row(kind, v, url);
      const add = el(`<div class="toolbar"><select class="k"></select><select class="v"></select><button class="btn small" type="button">${tr('add')}</button></div>`);
      const kinds = COLOR_VALUES(); const ks = add.querySelector('.k'), vs = add.querySelector('.v');
      ks.innerHTML = ['platform', 'region', 'language', 'source'].map(k => `<option>${k}</option>`).join('');
      const fillV = () => { vs.innerHTML = (kinds[ks.value] || []).map(v => `<option>${esc(v)}</option>`).join(''); }; ks.onchange = fillV; fillV();
      add.querySelector('button').onclick = () => { const k = ks.value, v = vs.value; if ((current[k] || {})[v] !== undefined) return; (current[k] = current[k] || {})[v] = ''; row(k, v, ''); };
      box.appendChild(t); box.appendChild(add);
      return { el: box, get: () => { const out = {}; for (const [k, m] of Object.entries(current)) { const clean = Object.fromEntries(Object.entries(m || {}).filter(([, u]) => u && u.trim())); if (Object.keys(clean).length) out[k] = clean; } return Object.keys(out).length ? out : null; } };
    }
    case 'media_download': {
      current = {};
      box.appendChild(el(`<div class="muted">${tr("What a provider sync downloads. Untick a type and that provider's sync leaves it alone; what is already downloaded stays. Files you add yourself (upload or URL) are never blocked.")}</div>`));
      box.appendChild(el(`<div class="muted">${tr('Box and cover are on unless unticked. Everything else is off until ticked: for a whole catalogue, screenshots and fan art are many gigabytes and extra provider requests for every game.')}</div>`));
      const table = el('<table class="grid"><tbody></tbody></table>'); box.appendChild(table);
      for (const p of vocab.media.providers.filter(p => !p.manual_only)) {
        current[p.name] = {};
        const row = el(`<tr><td>${providerIcon(p.name)}${esc(p.name)}</td><td><div class="radios"></div></td></tr>`);
        for (const mt of p.types) {
          // Unlisted: on for what a sync always fetched (box, cover), off for the rest.
          const on = typeof ((value || {})[p.name] || {})[mt] === 'boolean' ? value[p.name][mt] : vocab.media.default_on.includes(mt);
          current[p.name][mt] = on;
          const l = el(`<label><input type="checkbox" ${on ? 'checked' : ''}> ${esc(mt)}</label>`); l.firstElementChild.onchange = e => { current[p.name][mt] = e.target.checked; };
          row.querySelector('.radios').appendChild(l);
        }
        table.firstElementChild.appendChild(row);
      }
      return { el: box, get };
    }
    case 'media_priority': {
      current = {};
      box.appendChild(el(`<div class="muted">${tr("Per media type, whose comes first: the providers and your own uploads. For media a game has one of, the first that has one is used, and a lower provider's is not downloaded once a higher source has it. Your uploads are first unless you move them down. Screenshots, fan art and videos come from every provider; the order only decides which are shown first.")}</div>`));
      let any = false;
      const sourceLabel = p => p === 'manual' ? `<b>${esc(tr('your uploads'))}</b>` : providerIcon(p) + esc(p);
      for (const mt of vocab.media.types.filter(t => t !== 'bgm')) {
        // Your uploads, and every provider that can supply the type.
        const able = ['manual', ...vocab.media.providers.filter(p => p.types.includes(mt)).map(p => p.name)];
        if (able.length < 2) continue;
        const stored = Array.isArray((value || {})[mt]) ? value[mt].filter(p => able.includes(p)) : [];
        // Unplaced uploads come first, as the server reads it; unplaced providers last.
        const head = stored.includes('manual') ? [] : ['manual'];
        current[mt] = head.concat(stored, able.filter(p => p !== 'manual' && !stored.includes(p))); any = true;
        box.appendChild(el(`<div style="margin-top:6px"><b>${esc(mt)}</b></div>`));
        box.appendChild(orderList(current[mt], sourceLabel, o => { current[mt] = o; }).el);
      }
      if (!any) box.appendChild(el(`<div class="muted">${tr('No media type is offered by more than one provider yet.')}</div>`));
      return { el: box, get: () => (Object.keys(current).length ? current : null) };
    }
    case 'media_export_priority': {
      current = {};
      box.appendChild(el(`<div class="muted">${tr("Export artwork: per slot, whose picture an emulator gets, best first. A box scan before a poster: TheGamesDB and MobyGames come before SteamGridDB by default.")}</div>`));
      const sourceLabel = p => p === 'manual' ? `<b>${esc(tr('your uploads'))}</b>` : providerIcon(p) + esc(p);
      const slotNames = { box: tr('box (Named_Boxarts, covers)'), title: tr('title screen (Named_Titles)'), snap: tr('screenshot (Named_Snaps)'), logo: tr('logo (Named_Logos)') };
      // In the order RetroArch lists them, not the server's alphabetical one.
      for (const slot of ['box', 'title', 'snap', 'logo'].filter(x => (vocab.media.export_slots || {})[x])) {
        const types = vocab.media.export_slots[slot];
        const defaults = (vocab.media.export_priority || {})[slot] || ['manual'];
        // The default order, then any other provider that has art of the slot's types.
        const able = defaults.concat(vocab.media.providers.filter(p => p.types.some(t => types.includes(t)) && !defaults.includes(p.name)).map(p => p.name));
        const stored = Array.isArray((value || {})[slot]) ? value[slot].filter(p => able.includes(p)) : null;
        current[slot] = stored ? stored.concat(able.filter(p => !stored.includes(p))) : able;
        box.appendChild(el(`<div style="margin-top:6px"><b>${esc(slotNames[slot] || slot)}</b></div>`));
        box.appendChild(orderList(current[slot], sourceLabel, o => { current[slot] = o; }).el);
      }
      return { el: box, get: () => (Object.keys(current).length ? current : null) };
    }
    case 'media_show': case 'media_client_keep': {
      const keep = key === 'media_client_keep';
      const types = vocab.media.types;
      current = {};
      if (keep) {
        box.appendChild(el(`<div class="muted">${tr('Client mode only. Ticked: this machine keeps its own copy, fetched from the main server; images are stored as AVIF when that is smaller. Not ticked: nothing is stored, and a page streams it from the main server when it shows it.')}</div>`));
        box.appendChild(el(`<div class="warnbox">${tr("Caution: a downloaded video is kept in its original format (nothing here converts video), so it takes its full size. Streaming is recommended for video on a client. bgm (audio) off means the player streams the server's tracks; on, the audio_sync job fetches a copy of every tagged track in the format audio_client_format names.")}</div>`));
      } else box.appendChild(el(`<div class="muted">${tr('Which media title and release pages show in their media strip. bgm is the audio player.')}</div>`));
      const row = el('<div class="radios"></div>');
      for (const mt of types) {
        current[mt] = typeof (value || {})[mt] === 'boolean' ? value[mt] : !(keep && (mt === 'video' || mt === 'bgm'));
        const l = el(`<label><input type="checkbox" ${current[mt] ? 'checked' : ''}> ${esc(mt)}</label>`); l.firstElementChild.onchange = e => { current[mt] = e.target.checked; };
        row.appendChild(l);
      }
      box.appendChild(row);
      return { el: box, get };
    }
    default: return null;
  }
}

// The server process itself: what's running, and the only ways to stop it besides Ctrl+C.
// Closing the browser never stops anything -- the worker keeps running queued jobs.
// Recurring syncs: a job (provider bulk sync, DAT sync, DB optimize) plus a fixed interval,
// a cheap change check, or both. A check only enqueues a diff run when the provider says
// its data changed; an identical job still queued is never added twice.
async function showSchedules() {
  const [list, ps, dirs] = await Promise.all([api('/api/v1/schedules'), api('/api/v1/providers'), api('/api/v1/directories').catch(() => [])]);
  const dirPath = id => (dirs.find(d => d.id === id) || {}).path || ('#' + id);
  const bulk = ps.filter(p => p.available && (p.capabilities.platform || p.capabilities.full));
  const units = ['minutes', 'hours', 'days', 'weeks', 'months'];
  const unitSel = (name) => `<select name="${name}">${units.map(u => `<option value="${u}" ${u === 'days' ? 'selected' : ''}>${tr(u)}</option>`).join('')}</select>`;
  const describe = t => t.job_type === 'provider_bulk_sync' ? `${t.provider} ${t.full ? tr('full') : (t.platform === 'all' || t.platform == null ? tr('all platforms') : (vocab.platforms.find(p => p.id === t.platform)?.name || t.platform))}` : t.job_type === 'dat_sync' ? trf('DAT sync {source}', { source: t.source || tr('all sources') }) : t.job_type === 'file_scan' ? trf('quick scan {dir}', { dir: dirPath(t.directory_id) }) : t.job_type === 'ra_badges' ? trf('RA badges: {scope}', { scope: t.scope === 'owned' ? tr('owned games') : tr('played by the account') }) : t.job_type === 'media_backfill' ? trf('missing media: {scope}', { scope: (t.scope === 'all' ? tr('the whole catalogue') : tr('owned games')) + (t.platform != null ? ' · ' + (vocab.platforms.find(p => p.id === t.platform)?.name || t.platform) : '') }) : t.job_type;
  const when = (n, u) => n ? trf('every {n} {unit}', { n, unit: tr(u) }) : '';
  view.innerHTML = `
    <div class="card"><h2>${tr('Add / edit schedule')}</h2>
      <p class="muted">${tr('<b>Fixed</b> runs the job every interval. <b>Check</b> asks the provider every interval whether its data changed (one small request: IGDB update count, TheGamesDB dump ETag, Hasheous checksums, EmuReady game count) and runs a diff sync only then; RetroAchievements has no such check, so use fixed for it. <b>Both</b> does the two independently.')}</p>
      <form class="inline" id="schform"><input type="hidden" name="id">
        <label>${tr('name')}<input type="text" name="name" required style="min-width:180px"></label>
        <label>${tr('job')}<select name="job_type"><option value="provider_bulk_sync">${tr('provider bulk sync')}</option><option value="dat_sync">${tr('DAT sync')}</option><option value="db_optimize">${tr('DB optimize')}</option><option value="integrity_check">${tr('integrity check')}</option><option value="file_scan">${tr('file quick scan')}</option><option value="media_backfill">${tr('download missing media')}</option><option value="ra_badges">${tr('RA badges download/update')}</option></select></label>
        <label data-s="rabadges">${tr('RetroAchievements games')}<select name="rascope"><option value="played">${tr('played by the account')}</option><option value="owned">${tr('owned games')}</option></select></label>
        <label data-s="media">${tr('media for')}<select name="mscope"><option value="owned">${tr('owned games')}</option><option value="all">${tr('the whole catalogue')}</option></select></label>
        <label data-s="media">${tr('platform')}<select name="mplatform">${platformOptions('', tr('all platforms'))}</select></label>
        <label data-s="scan">${tr('directory')}<select name="directory_id"><option value="">${tr('— choose —')}</option>${dirs.map(d => `<option value="${d.id}">${esc(d.path)}</option>`).join('')}</select></label>
        <label data-s="prov">${tr('provider')}<select name="provider">${bulk.map(p => `<option>${esc(p.name)}</option>`).join('')}</select></label>
        <label data-s="prov">${tr('scope')}<select name="scope"></select></label>
        <label data-s="plat">${tr('platform')}<select name="platform">${platformOptions('', tr('— choose —'))}</select></label>
        <label data-s="dat">${tr('source')}<select name="source"><option value="">${tr('all sources')}</option>${vocab.jobs.dat_sources.map(x => `<option>${esc(x)}</option>`).join('')}</select></label>
        <label>${tr('mode')}<select name="mode"><option value="diff">${tr('diff')}</option><option value="redownload">${tr('redownload')}</option></select></label>
        <label>${tr('trigger')}<select name="trigger"><option value="fixed">${tr('fixed')}</option><option value="check">${tr('check')}</option><option value="both">${tr('both')}</option></select></label>
        <label data-s="fixed">${tr('fixed every')}<span style="display:flex;gap:4px"><input type="number" name="fixed_every_n" min="1" value="7" style="width:64px">${unitSel('fixed_unit')}</span></label>
        <label data-s="check">${tr('check every')}<span style="display:flex;gap:4px"><input type="number" name="check_every_n" min="1" value="6" style="width:64px">${unitSel('check_unit')}</span></label>
        <label><span>${tr('enabled')}</span><input type="checkbox" name="enabled" checked></label>
        <label title="${tr('A due run waits until no other job is queued or running.')}"><span>${tr('run only when idle')}</span><input type="checkbox" name="when_idle" checked></label>
        <button class="btn primary">${tr('save')}</button><button class="btn" type="button" id="schreset">${tr('clear')}</button>
      </form>
      <p class="bad" data-s="dbopt" style="display:none">${tr('Scheduling this is almost never right: it repeatedly destroys the records that let moved and renamed files be recognised, and the &quot;missing, but found elsewhere&quot; hint with them. Prefer running it by hand when the database is actually too large.')}</p></div>
    <div class="card"><h2>${trf('Schedules ({n})', { n: list.length })}</h2><table class="grid"><thead><tr><th>${tr('name')}</th><th>${tr('job')}</th><th>${tr('mode')}</th><th>${tr('trigger')}</th><th>${tr('next fixed')}</th><th>${tr('next check')}</th><th>${tr('last run')}</th><th>${tr('last check')}</th><th></th></tr></thead><tbody>
      ${list.map(x => `<tr><td>${esc(x.name)} ${x.enabled ? '' : badge(tr('disabled'), 'dim')} ${x.when_idle ? badge(tr('when idle'), 'dim') : ''}</td><td>${esc(describe(x.target))}</td><td>${esc(x.mode)}</td><td>${esc(x.trigger)} <span class="muted">${esc([when(x.fixed_every_n, x.fixed_unit), when(x.check_every_n, x.check_unit)].filter(Boolean).join(' / '))}</span></td><td>${fmtDate(x.next_fixed_at)}</td><td>${fmtDate(x.next_check_at)}</td><td>${fmtDate(x.last_run_at)} ${x.last_job_id ? `<span class="muted">#${x.last_job_id}</span>` : ''}</td><td class="muted" style="white-space:normal;max-width:260px">${fmtDate(x.last_check_at)} ${esc(x.last_check_result || '')}</td><td><button class="btn small" data-run="${x.id}">${tr('run now')}</button> <button class="btn small" data-edit="${x.id}">${tr('edit')}</button> <button class="btn small danger" data-del="${x.id}">${tr('delete')}</button></td></tr>`).join('') || `<tr><td colspan="9" class="muted">${tr('none yet')}</td></tr>`}
    </tbody></table></div>`;
  const form = document.getElementById('schform');
  const show = (key, on) => form.querySelectorAll(`[data-s="${key}"]`).forEach(e => e.style.display = on ? '' : 'none');
  const refresh = () => {
    const jt = form.job_type.value, prov = bulk.find(p => p.name === form.provider.value), c = prov?.capabilities || {};
    form.platform.innerHTML = platformOptions(form.platform.value, tr('— choose —'), prov?.bulk_platforms);
    const keep = form.scope.value;
    form.scope.innerHTML = [c.platform ? `<option value="platform">${tr('one platform')}</option><option value="all">${tr('every catalog platform')}</option>` : '', c.full ? `<option value="full">${tr('full database')}</option>` : ''].join('');
    if ([...form.scope.options].some(o => o.value === keep)) form.scope.value = keep;
    show('prov', jt === 'provider_bulk_sync'); show('plat', jt === 'provider_bulk_sync' && form.scope.value === 'platform'); show('dat', jt === 'dat_sync'); show('scan', jt === 'file_scan'); show('media', jt === 'media_backfill'); show('rabadges', jt === 'ra_badges');
    view.querySelectorAll('[data-s="dbopt"]').forEach(e => e.style.display = jt === 'db_optimize' ? '' : 'none');
    show('fixed', form.trigger.value !== 'check'); show('check', form.trigger.value !== 'fixed');
  };
  for (const n of ['job_type', 'provider', 'scope', 'trigger']) form[n].onchange = refresh;
  refresh();
  document.getElementById('schreset').onclick = () => { form.reset(); form.id.value = ''; refresh(); };
  form.onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(form); const jt = f.get('job_type');
    let target = { job_type: jt };
    if (jt === 'provider_bulk_sync') {
      target.provider = f.get('provider');
      if (f.get('scope') === 'full') target.full = true;
      else if (f.get('scope') === 'all') target.platform = 'all';
      else { if (!f.get('platform')) return toast(tr('choose a platform'), true); target.platform = Number(f.get('platform')); }
    } else if (jt === 'dat_sync') { target.source = f.get('source') || null; target.import = true; }
    else if (jt === 'file_scan') { if (!f.get('directory_id')) return toast(tr('pick a directory'), true); target.directory_id = Number(f.get('directory_id')); target.mode = 'new_only'; }
    else if (jt === 'ra_badges') target.scope = f.get('rascope');
    else if (jt === 'media_backfill') { target.scope = f.get('mscope'); target.platform = f.get('mplatform') ? Number(f.get('mplatform')) : null; }
    const trigger = f.get('trigger');
    const spec = { name: f.get('name'), target, mode: f.get('mode'), trigger, enabled: !!f.get('enabled'), when_idle: !!f.get('when_idle'),
      fixed_every_n: trigger !== 'check' ? Number(f.get('fixed_every_n')) : null, fixed_unit: trigger !== 'check' ? f.get('fixed_unit') : null,
      check_every_n: trigger !== 'fixed' ? Number(f.get('check_every_n')) : null, check_unit: trigger !== 'fixed' ? f.get('check_unit') : null };
    try { const id = f.get('id'); await api(id ? '/api/v1/schedules/' + id : '/api/v1/schedules', { method: id ? 'PUT' : 'POST', body: spec }); toast(tr('saved')); showSchedules(); } catch (err) { toast(err.message, true); }
  };
  for (const b of view.querySelectorAll('[data-run]')) b.onclick = async () => { try { const r = await api('/api/v1/schedules/' + b.dataset.run + '/run', { method: 'POST' }); toast(r.already_queued ? tr('already queued') : trf('enqueued job #{id}', { id: r.job_id })); refreshHeader(); } catch (err) { toast(err.message, true); } };
  for (const b of view.querySelectorAll('[data-del]')) b.onclick = async () => { if (!confirm(tr('Delete this schedule? (jobs it already queued stay)'))) return; try { await api('/api/v1/schedules/' + b.dataset.del, { method: 'DELETE' }); showSchedules(); } catch (err) { toast(err.message, true); } };
  for (const b of view.querySelectorAll('[data-edit]')) b.onclick = () => {
    const x = list.find(y => String(y.id) === b.dataset.edit), t = x.target;
    form.id.value = x.id; form.name.value = x.name; form.job_type.value = t.job_type; form.mode.value = x.mode; form.trigger.value = x.trigger; form.enabled.checked = x.enabled; form.when_idle.checked = x.when_idle !== false;
    if (t.directory_id) form.directory_id.value = t.directory_id;
    if (t.provider) form.provider.value = t.provider;
    refresh();
    form.scope.value = t.full ? 'full' : (t.platform === 'all' || t.platform == null ? 'all' : 'platform');
    if (typeof t.platform === 'number') form.platform.value = t.platform;
    if (t.source) form.source.value = t.source;
    if (t.job_type === 'ra_badges') form.rascope.value = t.scope || 'played';

    if (x.check_every_n) { form.check_every_n.value = x.check_every_n; form.check_unit.value = x.check_unit; }
    refresh(); window.scrollTo(0, 0);
  };
}

// Config › Server: how much memory MariaDB keeps the catalogue in, and whether it is read in
// at start. Saved to data/database.env; the size applies from the next start.
async function databaseCacheCard(card) {
  let c;
  try { c = await api('/api/v1/server/database_cache'); } catch (e) { card.innerHTML = `<h2>${tr('Database cache')}</h2><div class="bad">${esc(e.message)}</div>`; return; }
  const GiB = 1 << 30, ram = c.total_ram_bytes;
  const fixedGiB = c.fixed_bytes ? +(c.fixed_bytes / GiB).toFixed(2) : Math.max(1, Math.round(c.next_start_bytes / GiB));
  const warm = c.warm || {};
  const warmText = {
    idle: tr('not run in this process'), waiting: tr("waiting for MariaDB's own reload to finish"),
    running: trf('reading… {done} of {total} tables ({bytes})', { done: warm.tables_done, total: warm.tables_total, bytes: fmtSize(warm.bytes_done) }),
    done: trf('{n} tables, {bytes} in {s}s', { n: warm.tables_done, bytes: fmtSize(warm.bytes_done), s: (warm.seconds || 0).toFixed(1) }) + (warm.tables_skipped ? ' — ' + trf('{n} left out: the cache is smaller than the catalogue', { n: warm.tables_skipped }) : ''),
    skipped: tr('skipped') + (warm.message ? ' — ' + esc(warm.message) : ''), failed: tr('failed') + (warm.message ? ' — ' + esc(warm.message) : ''),
  }[warm.state] || esc(warm.state || '');
  card.innerHTML = `<h2>${tr('Database cache')}</h2>
    <p class="muted">${tr('MariaDB keeps tables and indexes in memory so screens are not read from disk each time. Memory is only used as the catalogue fills it, so a generous size costs nothing until it is needed. Saved for this installation and used from the next start.')}</p>
    ${c.local ? '' : `<div class="warn">${tr('This database runs on another machine; these settings only apply to a database this installation starts itself.')}</div>`}
    <form id="dbcacheform">
      <label style="display:block;margin:4px 0"><input type="radio" name="mode" value="percent" ${c.mode === 'percent' ? 'checked' : ''}> ${tr('share of memory')}
        <input type="number" name="percent" min="${c.min_percent}" max="${c.max_percent}" style="width:70px" value="${c.percent || 25}"> %</label>
      <label style="display:block;margin:4px 0"><input type="radio" name="mode" value="fixed" ${c.mode === 'fixed' ? 'checked' : ''}> ${tr('fixed size')}
        <input type="number" name="fixed" min="0.125" step="0.125" style="width:90px" value="${fixedGiB}"> GiB</label>
      <div class="muted" id="dbcache-calc"></div>
      <label style="display:block;margin:8px 0"><input type="checkbox" name="warm" ${c.warm_cache ? 'checked' : ''}> ${tr('read the catalogue into the cache when the database starts (in the background)')}</label>
      <h3 style="margin-top:12px">${tr('Writing')}</h3>
      <label style="display:block;margin:4px 0"><input type="checkbox" name="fast" ${c.fast_writes ? 'checked' : ''} ${c.local ? '' : 'disabled'}> ${tr('fast writes: flush to disk about once a second instead of at every commit')}</label>
      <div class="muted">${tr('Much faster scans and imports. A crash of the app or the database loses nothing; a power cut or an operating system crash can lose up to the last second of changes. Off: every change waits for the disk.')}</div>
      <label style="display:block;margin:8px 0">${tr('database disk')}
        <select name="disk" ${c.local ? '' : 'disabled'}>${[['auto', trf('auto (detected: {kind})', { kind: c.disk_detected === 'ssd' ? 'SSD' : tr('hard disk') })], ['ssd', 'SSD'], ['nvme', 'NVMe SSD'], ['hdd', tr('hard disk')]].map(([v, l]) => `<option value="${v}" ${c.disk === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
      <div class="muted">${tr('How hard the database writes in the background. A hard disk setting on an SSD holds heavy writes back; an SSD setting on a hard disk makes everything else wait.')}</div>
      <div class="toolbar"><button class="btn primary">${tr('save')}</button></div>
      <p class="muted">${tr('The writing settings apply as soon as they are saved.')} ${c.in_process ? tr('Both settings take effect only when the database restarts: quit and reopen the app.') : tr('Both settings take effect only when the database restarts: use "restart server" above, which restarts the database it started along with itself.')}</p>
    </form>
    ${c.restart_needed ? `<div class="warn">${trf('Restart needed: the cache is {now} now and will be {next} after a restart.', { now: fmtSize(c.live_bytes), next: fmtSize(c.next_start_bytes) })}${c.in_process ? '' : ` <button class="btn small" type="button" id="dbcache-restart">${tr('restart server')}</button>`}</div>` : ''}
    <div class="kv">
      <div>${tr('memory')}</div><div>${fmtSize(ram)}</div>
      <div>${tr('cache now')}</div><div>${c.live_bytes != null ? fmtSize(c.live_bytes) : '—'}${c.cached_bytes != null ? ' · ' + trf('{n} holding data', { n: fmtSize(c.cached_bytes) }) : ''}</div>
      <div>${tr('catalogue on disk')}</div><div>${c.catalogue_bytes != null ? fmtSize(c.catalogue_bytes) : '—'}${c.catalogue_bytes && c.live_bytes && c.catalogue_bytes > c.live_bytes * 0.9 ? ' ' + badge(tr('bigger than the cache'), 'warn') : ''}</div>
      <div>${tr('reload at start')}</div><div>${esc(c.load_status || '—')}</div>
      <div>${tr('warm-up')}</div><div>${warmText}</div>
      <div>${tr('writing now')}</div><div>${c.live_flush_at_commit == null ? '—' : (c.live_flush_at_commit === 1 ? tr('flush at every commit') : tr('flush about once a second')) + (c.live_io_capacity != null ? ' · ' + trf('{n} background writes per second', { n: c.live_io_capacity }) : '')}</div>
    </div>`;
  const form = card.querySelector('#dbcacheform'), calc = card.querySelector('#dbcache-calc');
  const chosen = () => {
    const f = new FormData(form);
    return f.get('mode') === 'fixed' ? { text: Math.round(Number(f.get('fixed')) * 1024) + 'M', bytes: Number(f.get('fixed')) * GiB } : { text: Number(f.get('percent')) + '%', bytes: ram * Number(f.get('percent')) / 100 };
  };
  const recalc = () => { const x = chosen(); calc.textContent = trf('next start: {size} of {ram}', { size: fmtSize(Math.min(x.bytes, ram * 0.9)), ram: fmtSize(ram) }) + (x.bytes > ram * 0.9 ? ' ' + tr('(capped at 90% of memory)') : ''); };
  form.oninput = recalc; recalc();
  const rb = card.querySelector('#dbcache-restart');
  if (rb) rb.onclick = () => document.getElementById('srvrestart').click();
  form.onsubmit = async ev => {
    ev.preventDefault();
    try { await api('/api/v1/server/database_cache', { method: 'PUT', body: Object.assign({ buffer_pool: chosen().text, warm_cache: form.warm.checked }, c.local ? { fast_writes: form.fast.checked, disk: form.disk.value } : {}) }); toast(tr('saved — used from the next start')); databaseCacheCard(card); } catch (e) { toast(e.message, true); }
  };
}

async function showServer() {
  const s = await api('/api/v1/server');
  view.innerHTML = `<div class="card"><h2>${tr('Server')}</h2>
    <div class="kv"><div>${tr('process')}</div><div>${trf('pid {pid}, version {version}', { pid: s.pid, version: esc(s.version) })}</div><div>${tr('running since')}</div><div>${fmtDate(s.started_at)}</div>
      <div>${tr('background worker')}</div><div>${s.worker_running ? badge(tr('running in this process'), 'ok') : badge(tr('not in this process (--no-worker)'), 'warn')}</div>
      <div>${tr('TLS certificate')}</div><div>${s.tls_fingerprint ? `<span class="mono" style="word-break:break-all">${esc(s.tls_fingerprint.match(/.{1,2}/g).join(':'))}</span><div class="muted">${tr('SHA-256. A device connecting for the first time shows this: it should match.')}</div>` : `<span class="muted">${tr("none (this app's own database, or a server started with --no-tls)")}</span>`}</div></div>
    <p class="muted">${tr('The server and its worker keep running with no browser open; queued jobs carry on. Only these buttons (or Ctrl+C where it was started) stop it. Jobs still running are put back in the queue and start over on the next start.')}</p>
    <div class="toolbar"><button class="btn" id="srvrestart">${tr('restart server')}</button><button class="btn danger" id="srvstop">${tr('shut down server')}</button></div>
    <div id="srvstate" class="muted"></div></div>
    <div class="card"><h2>${tr('Ports')}</h2>
      <p class="muted">${tr('Saved for this installation and used from the next start. Each installation on a machine needs its own database port; one that finds its port taken by another installation moves to the next free one by itself and records it here.')}</p>
      <form class="inline" id="portsform">
        <label>${tr('database port')}<input name="db_port" type="number" min="1024" max="65535" style="width:110px" value="${s.db_port}"></label>
        <label>${tr('server port')}<input name="server_port" type="number" min="1024" max="65535" style="width:110px" value="${s.server_port}"></label>
        <button class="btn primary">${tr('save')}</button>
      </form></div>
    <div class="card" id="dbcache"><h2>${tr('Database cache')}</h2><div class="muted">${tr('loading…')}</div></div>`;
  databaseCacheCard(document.getElementById('dbcache'));
  document.getElementById('portsform').onsubmit = async ev => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    try { await api('/api/v1/server/ports', { method: 'PUT', body: { db_port: Number(f.get('db_port')), server_port: Number(f.get('server_port')) } }); toast(tr('saved — used from the next start')); } catch (err) { toast(err.message, true); }
  };
  const state = document.getElementById('srvstate');
  document.getElementById('srvrestart').onclick = async () => {
    if (!confirm(tr('Restart the server? Running jobs are re-queued and start over.'))) return;
    try { await api('/api/v1/server/restart', { method: 'POST' }); } catch (err) { return toast(err.message, true); }
    state.textContent = tr('restarting…');
    // Wait for the old process to go and a new one to answer: another pid, or the same pid
    // started again later (a container's server is pid 1 every time).
    for (let i = 0; i < 120; i++) {
      await new Promise(r => setTimeout(r, 1000));
      try { const now = await api('/api/v1/server'); if (now.pid !== s.pid || now.started_at !== s.started_at) { toast(tr('server restarted')); return showServer(); } } catch (e) {}
      state.textContent = trf('restarting… ({s}s)', { s: i + 1 });
    }
    state.textContent = tr("the server hasn't come back after 2 minutes — check the console it was started from");
  };
  document.getElementById('srvstop').onclick = async () => {
    if (!confirm(tr('Shut the server down? The console stops working until it is started again; running jobs are re-queued.'))) return;
    try { await api('/api/v1/server/shutdown', { method: 'POST' }); } catch (err) { return toast(err.message, true); }
    state.textContent = tr('shutting down — start romexplorer_server again to use the console.');
  };
}

// Config › Settings is the form: every known key through its editor, nothing typed as JSON.
// Config › Settings (JSON) is the same list with every value as the server stores it, plus
// keys the server does not know and a way to add one.
async function showSettings() { return settingsPage(false); }
async function showSettingsJson() { return settingsPage(true); }
// The sections a settings list falls into, in the order the server lists them.
function settingGroups(list) {
  const groups = [];
  for (const s of list) { const g = s.group || 'other'; let e = groups.find(x => x.id === g); if (!e) { e = { id: g, label: s.group_label || 'Other', n: 0 }; groups.push(e); } e.n++; }
  return groups;
}

// Pill tabs for the sections; `base` is the route they link under. Only the chosen one is
// shown -- the page is one section long rather than all sixty settings -- except while the
// filter box has text, which searches every section.
function sectionTabs(groups, active, base) {
  return `<nav class="subsub">${groups.map(g => `<button class="${g.id === active ? 'active' : ''}" onclick="go('${base}/${g.id}')">${esc(tr(g.label))}<span class="n">${g.n}</span></button>`).join('')}</nav>`;
}
function showSection(host, active, query) {
  for (const card of host.querySelectorAll('[data-group]')) {
    if (query) {
      const rows = [...card.querySelectorAll('[data-search]')];
      for (const r of rows) r.style.display = r.dataset.search.includes(query) ? '' : 'none';
      card.style.display = rows.some(r => r.style.display !== 'none') ? '' : 'none';
    } else {
      for (const r of card.querySelectorAll('[data-search]')) r.style.display = '';
      card.style.display = card.dataset.group === active ? '' : 'none';
    }
  }
}

async function settingsPage(json, group) {
  const list = await api('/api/v1/settings');
  if (!json) return settingsForm(list, group);
  const other = json ? tr(`the <span class="link" onclick="go('config/settings')">form</span> covers the same keys.`) : tr(`the <span class="link" onclick="go('config/settings_json')">JSON view</span> shows the stored values as they are.`);
  view.innerHTML = `<div class="card"><h2>${json ? tr('Settings (JSON)') : tr('Settings')}</h2><p class="muted">${tr('Changes apply after saving and reloading a screen. "reset to default" removes the stored value;')} ${other}</p><div id="rows"></div>
    ${json ? `<form class="inline" id="newkey"><label>${tr('new key')}<input type="text" name="key" placeholder="${tr('key')}"></label><label>${tr('JSON value')}<input type="text" name="value" placeholder='"value" or {"a":1}' style="min-width:300px"></label><button class="btn">${tr('add')}</button></form>` : ''}</div>`;
  const rows = document.getElementById('rows');
  const groups = settingGroups(list);
  const active = groups.some(g => g.id === group) ? group : (groups[0] || {}).id;
  rows.insertAdjacentHTML('beforebegin', `${sectionTabs(groups, active, 'config/settings_json')}<div class="toolbar"><input type="text" id="setfilter" placeholder="${tr('filter settings…')}" style="min-width:240px"></div>`);
  for (const g of groups) rows.appendChild(el(`<div data-group="${esc(g.id)}"></div>`));
  const again = () => settingsPage(json, active);
  for (const s of list) {
    const card = el(`<div class="card"><h3>${esc(s.key)} ${s.value === null ? badge(tr('default'), 'dim') : badge(tr('set'), 'ok')}</h3><div class="muted">${esc(s.description || '')}</div><div class="editor"></div><textarea style="display:none"></textarea><div class="toolbar actions"><button class="btn primary">${tr('save')}</button><button class="btn danger">${tr('reset to default')}</button><span class="muted">${s.updated_at ? trf('updated {date}', { date: fmtDate(s.updated_at) }) : ''}</span></div></div>`);
    const holder = card.querySelector('.editor'), ta = card.querySelector('textarea');
    // The mode and the id are refused by the server whichever view writes them.
    const editor = json ? (['instance_mode', 'catalog_from', 'instance_id'].includes(s.key) ? settingEditor(s.key, s.value) : null) : settingEditor(s.key, s.value);
    const readonly = editor && editor.readonly;
    if (readonly) card.querySelector('.actions').style.display = 'none';
    if (editor) holder.appendChild(editor.el);
    else if (json) { ta.value = s.value === null ? '' : JSON.stringify(s.value, null, 2); ta.style.display = ''; }
    else holder.innerHTML = `<span class="muted">${tr(`no form for this one yet: edit it under <span class="link" onclick="go('config/settings_json')">Settings (JSON)</span>`)}</span>`;
    if (!editor && !json) card.querySelector('.actions').style.display = 'none';
    // Scoped to the card's own action bar: an editor may carry toolbars/buttons of its own.
    const [save, reset] = card.querySelector('.actions').querySelectorAll('button');
    save.onclick = async () => {
      let v;
      if (json) { try { v = ta.value.trim() ? JSON.parse(ta.value) : null; } catch (e) { return toast(tr('not valid JSON'), true); } } else { v = editor.get(); }
      try {
        if (v === null || v === undefined) { await api('/api/v1/settings/' + encodeURIComponent(s.key), { method: 'DELETE' }); toast(trf('cleared {key}', { key: s.key })); }
        else { await api('/api/v1/settings/' + encodeURIComponent(s.key), { method: 'PUT', body: JSON.stringify(v), headers: { 'Content-Type': 'application/json' } }); toast(trf('saved {key}', { key: s.key })); }
        await loadUiSettings(); again();
      } catch (err) { toast(err.message, true); }
    };
    reset.onclick = async () => { try { await api('/api/v1/settings/' + encodeURIComponent(s.key), { method: 'DELETE' }); toast(trf('reset {key}', { key: s.key })); await loadUiSettings(); again(); } catch (err) { toast(err.message, true); } };
    card.dataset.search = (s.key + ' ' + (s.description || '')).toLowerCase();
    rows.querySelector(`[data-group="${CSS.escape(s.group || 'other')}"]`).appendChild(card);
  }
  showSection(rows, active, '');
  document.getElementById('setfilter').oninput = e => showSection(rows, active, e.target.value.trim().toLowerCase());
  if (!json) return;
  document.getElementById('newkey').onsubmit = async (e) => { e.preventDefault(); const f = new FormData(e.target); let v; try { v = JSON.parse(f.get('value')); } catch (err) { return toast(tr('value must be JSON'), true); } try { await api('/api/v1/settings/' + encodeURIComponent(f.get('key')), { method: 'PUT', body: JSON.stringify(v), headers: { 'Content-Type': 'application/json' } }); again(); } catch (err) { toast(err.message, true); } };
}

// Config › Settings as a form: a card per section, a row per setting. Each row is the key,
// its stored/default badge and a "!" for what it does; the editor; save / reset. Long notes
// an editor carries move into the row's "!" too.
function settingsForm(list, group) {
  const sections = settingGroups(list);
  const active = sections.some(g => g.id === group) ? group : (sections[0] || {}).id;
  view.innerHTML = `${sectionTabs(sections, active, 'config/settings')}<div class="card"><h2>${tr('Settings')} ${info(`<p>${tr('Changes apply after saving and reloading a screen. "reset to default" removes the stored value;')} ${tr(`the <span class="link" onclick="go('config/settings_json')">JSON view</span> shows the stored values as they are.`)}</p>`)}</h2>
    <div class="toolbar"><input type="text" id="setfilter" placeholder="${tr('filter settings…')}" style="min-width:240px"><span class="grow"></span><span class="muted">${trf('{n} settings', { n: list.length })}</span></div></div><div id="setgroups"></div>`;
  const host = document.getElementById('setgroups');
  const groups = new Map();
  for (const s of list) {
    const g = s.group || 'other';
    if (!groups.has(g)) { const card = el(`<div class="card setgroup" data-group="${esc(g)}"><h2>${esc(tr(s.group_label || 'Other'))}</h2><div class="rows"></div></div>`); host.appendChild(card); groups.set(g, card); }
    groups.get(g).querySelector('.rows').appendChild(settingRow(s, active));
  }
  // Wide editors (lists, tables) get a line of their own once they are measurable.
  // Measured with every section showing (a hidden one measures 0), then back to the tab.
  requestAnimationFrame(() => {
    for (const card of host.querySelectorAll('[data-group]')) card.style.display = '';
    for (const row of host.querySelectorAll('.setrow')) { const ed = row.querySelector('.editor'); if (ed.offsetHeight > 72 || ed.querySelector('table, textarea, .olist')) row.classList.add('wide'); }
    showSection(host, active, (document.getElementById('setfilter') || {}).value || '');
  });
  document.getElementById('setfilter').oninput = e => showSection(host, active, e.target.value.trim().toLowerCase());
}

function settingRow(s, section) {
  const updated = s.updated_at ? trf('updated {date}', { date: fmtDate(s.updated_at) }) : '';
  const row = el(`<div class="setrow" data-search="${esc((s.key + ' ' + (s.description || '')).toLowerCase())}">
    <div class="setname" title="${esc(updated)}"><span class="mono">${esc(s.key)}</span> ${s.value === null ? badge(tr('default'), 'dim') : badge(tr('set'), 'ok')}${(s.explain || []).length ? info(s.explain.map(x => `<p>${esc(tr(x))}</p>`).join('')) : s.description ? info(`<p>${esc(tr(s.description))}</p>`) : ''}</div>
    <div class="editor"></div>
    <div class="setact"><button class="btn small primary">${tr('save')}</button><button class="btn small danger" title="${tr('reset to default')}">${tr('reset')}</button></div></div>`);
  const holder = row.querySelector('.editor'), name = row.querySelector('.setname'), act = row.querySelector('.setact');
  // An unset key whose default depends on the server's build starts on that default.
  const editor = COPY_SCREEN_KEYS.includes(s.key) ? copyScreenEditor(s.value) : settingEditor(s.key, s.value ?? s.default ?? null);
  if (editor) holder.appendChild(editor.el);
  else holder.innerHTML = `<span class="muted">${tr(`no form for this one yet: edit it under <span class="link" onclick="go('config/settings_json')">Settings (JSON)</span>`)}</span>`;
  if (!editor || editor.readonly) act.style.display = 'none';
  // An editor's own long note joins the row's "!" -- one button per setting. A setting with
  // its own explanation (`explain`) already says it there, so its notes just go.
  const notes = [];
  for (const m of [...holder.querySelectorAll('.muted')]) {
    if (m.querySelector('input, select, textarea, button') || m.classList.contains('pf-auto') || (m.textContent || '').trim().length < EXPLAIN_MIN_CHARS) continue;
    notes.push(`<p>${m.innerHTML}</p>`);
    m.remove();
  }
  if (notes.length && !(s.explain || []).length) {
    const b = name.querySelector('.info');
    if (b) INFO.set(b.dataset.info, INFO.get(b.dataset.info) + notes.join(''));
    else name.insertAdjacentHTML('beforeend', info(notes.join('')));
  }
  const [save, reset] = act.querySelectorAll('button');
  const done = async msg => { toast(msg); await loadUiSettings(); settingsPage(false, section); };
  save.onclick = async () => {
    const v = editor.get();
    try {
      if (v === null || v === undefined) { await api('/api/v1/settings/' + encodeURIComponent(s.key), { method: 'DELETE' }); await done(trf('cleared {key}', { key: s.key })); }
      else { await api('/api/v1/settings/' + encodeURIComponent(s.key), { method: 'PUT', body: JSON.stringify(v), headers: { 'Content-Type': 'application/json' } }); await done(trf('saved {key}', { key: s.key })); }
    } catch (err) { toast(err.message, true); }
  };
  reset.onclick = async () => { try { await api('/api/v1/settings/' + encodeURIComponent(s.key), { method: 'DELETE' }); await done(trf('reset {key}', { key: s.key })); } catch (err) { toast(err.message, true); } };
  return row;
}

// A job's payload, shortened (an IGDB follow-up can carry hundreds of ids): long arrays show

  const text = short.length > 90 ? short.slice(0, 88) + '…' : short;

// A step's label in the UI language, by its key; the English the worker sent otherwise.
function stepLabel(st) {

    bundle: tr('Bundle DLC and updates with their games'),
    patched: tr('One release per patched work'),
    bases: tr('Link patched releases to their originals'),
    merge: tr('Merge titles that share a game'),
    versions: tr("Find each game's official versions"),
    basegames: tr('Link ports, remakes and add-ons to their base game'),

function fmtSecs(secs) { return Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'); }

function stepsHtml(j, full) {
  const d = j.progress_detail;
  if (!d || !Array.isArray(d.steps)) return '';
  const mark = st => ({ done: '✓', running: '●' })[st] || '○';
  if (!full) {
    const tip = d.steps.map((st, i) => `${mark(st.state)} ${i + 1}. ${stepLabel(st)}${st.note ? ' — ' + st.note : ''}`).join('\n');
    return `<span class="stepmarks" title="${esc(tip)}">${d.steps.map(st => `<span class="${esc(st.state)}">${mark(st.state)}</span>`).join('')}</span>`;
  }
  // Each step has `span` of the bar's numbers from `base` (`jobs::Steps` on the server).
  const pct = (d.span && j.progress_done != null && j.progress_total === d.steps.length * d.span) ? Math.min(100, Math.floor(100 * Math.max(0, j.progress_done - d.base) / d.span)) : null;
  const rows = d.steps.map((st, i) => {
    let tail = st.state === 'running' && pct !== null ? `<div class="pbar"><div style="width:${pct}%"></div></div><span class="num">${pct}%</span>` : '';
    const said = [st.note, st.secs != null ? fmtSecs(st.secs) : null].filter(Boolean);
    if (said.length) tail += `<span class="muted note">${esc(said.join(' · '))}</span>`;
    return `<div class="step ${esc(st.state)}"><span class="mark">${mark(st.state)}</span><span class="slabel">${i + 1}. ${esc(stepLabel(st))}</span>${tail}</div>`;
  }).join('');

// A job's live progress (written by the worker about once a second): a bar when the total is
// known, else just the count, plus what it's doing right now.
function progressCell(j) { return progressBar(j, false); }
// The same with the whole message, wrapping onto more lines when it is long: for a running
// job shown on its own (the Scan tab's Running now), where there is room for all of it.
function progressFull(j) { return progressBar(j, true); }
function progressBar(j, full) {
  if (j.progress_done == null && !j.progress_message) return '';
  // Rounded down: 100% only once it is all done, never while the last bit is still going.
  const pct = j.progress_total ? Math.min(100, Math.floor(100 * j.progress_done / j.progress_total)) : null;

  const msg = j.progress_message || '';
  return `<div class="prog${full ? ' full' : ''}" title="${esc(msg)}">${bar}${full ? '' : stepsHtml(j, false)}<span class="muted">${esc(full ? msg : msg.slice(0, 90))}</span></div>`;

async function runNextJobs(ids) {
  try {
    const r = await api('/api/v1/jobs/run-next', { method: 'POST', body: { ids } });
    const moved = r.positions.filter(p => p.position != null);
    if (moved.length === 1) toast(trf('#{id} runs next in its lane (position {n})', { id: moved[0].id, n: moved[0].position }));
    else toast(trf('{n} job(s) moved to the front of their lanes', { n: moved.length }));
    route();
  } catch (err) { toast(err.message, true); }
}
// A jobs row's buttons: retry a failed or cancelled job, run a waiting one next, cancel a
// waiting or running one, and for a finished one with a result (a scan's errors and
// warnings, say) open it.
function jobActions(j) {
  const finished = ['done', 'failed', 'cancelled'].includes(j.status);
  const next = j.status === 'pending' ? `<button class="btn small" title="${esc(tr('Starts after the job running in its lane; jobs in other lanes are not affected.'))}" onclick="runNextJobs([${j.id}])">${tr('run next')}</button> ` : '';
  const main = (j.status === 'failed' || j.status === 'cancelled') ? `<button class="btn small" onclick="retryJob(${j.id})">${tr('retry')}</button>` : (j.status === 'pending' || j.status === 'in_progress') ? `${next}<button class="btn small danger" onclick="cancelJob(${j.id}, ${j.status === 'in_progress'})">${tr('cancel')}</button>` : '';
  const result = finished && j.result ? ` <button class="btn small" onclick="showJobResult(${j.id})">${tr('result')}</button>` : '';
  return main + result;
}
async function showJobResult(id) {
  let j; try { j = await api('/api/v1/jobs/' + id); } catch (err) { return toast(err.message, true); }
  const box = openModal(`<h2>${esc('#' + id + ' ' + j.job_type)}</h2>
    ${j.progress_message ? `<p class="muted">${esc(j.progress_message)}</p>` : ''}
    ${j.last_error ? `<div class="bad">${esc(j.last_error)}</div>` : ''}
    <div style="max-height:65vh; overflow:auto">${resultView(j.result)}</div>
    <div class="fsfoot"><span class="grow"></span><button type="button" class="btn" data-id="close">${tr('close')}</button></div>`);
  box.querySelector('[data-id="close"]').onclick = closeModal;
}
async function retryJob(id) { try { await api('/api/v1/jobs/' + id + '/retry', { method: 'POST' }); toast(trf('retrying #{id}', { id })); route(); } catch (err) { toast(err.message, true); } }

// How much of a provider is held here: cached entries, the share of the provider's own total
// when a sync learned it, and per platform whether the last bulk sync got the whole list.
function coverageCell(c) {
  const num = n => Number(n).toLocaleString();
  const pct = (a, b) => b ? Math.min(100, Math.round(1000 * a / b) / 10) : null;
  const got = c.fetched ?? c.cached;
  let html = trf('<b>{n}</b> cached', { n: num(c.cached) });
  if (c.fetched != null && c.fetched !== c.cached) html += ` · ${trf('{n} fetched', { n: num(c.fetched) })}`;
  if (c.remote_total) html += ` · ${trf('<b>{pct}%</b> of {total}', { pct: pct(got, c.remote_total), total: num(c.remote_total) })}`;
  if (c.full) html += ' ' + badge(tr('full sync'), 'ok');
  if (!c.platforms.length) return html;
  const full = c.platforms.filter(p => p.complete).length;
  const rows = c.platforms.map(p => `<tr><td>${esc(p.platform_name)}</td><td class="num">${num(p.entries)}</td><td>${p.complete ? badge(tr('full list'), 'ok') : (p.remote_total ? badge(trf('partial {pct}%', { pct: pct(p.entries, p.remote_total) }), 'warn') + ` <span class="muted">${trf('of {total}', { total: num(p.remote_total) })}</span>` : badge(tr('partial'), 'warn'))}</td><td class="muted">${fmtDate(p.synced_at)}</td></tr>`).join('');
  return html + `<details><summary>${c.platforms.length === 1 ? trf('1 platform ({full} full)', { full }) : trf('{n} platforms ({full} full)', { n: c.platforms.length, full })}</summary><table class="grid"><thead><tr><th>${tr('platform')}</th><th>${tr('entries')}</th><th>${tr('list')}</th><th>${tr('synced')}</th></tr></thead><tbody>${rows}</tbody></table></details>`;
}

// The provider "Manual request" form, on Data › Providers and again on Jobs: `ps` is
// /api/v1/providers.
function providerRequestCard(card, ps) {
  const enqueue = async (body) => { try { const r = await api('/api/v1/jobs', { method: 'POST', body }); toast(trf('enqueued {type} #{id} — progress under Jobs', { type: r.job_type, id: r.id })); refreshHeader(); } catch (err) { toast(err.message, true); } };
  const usable = ps.filter(p => p.available && (p.capabilities.keyword || p.capabilities.platform || p.capabilities.full));
  card.innerHTML = `
<h2>${tr('Metadata request')}</h2>
      <p class="muted">${tr("Runs as a job on the server's worker (progress under Jobs). <b>Keyword</b> looks a name up and links the best match. <b>Platform</b> pulls one platform's whole catalog from the provider (or every platform your catalog has). <b>Full</b> pulls the provider's whole database — offered only where its API allows that. Bulk results link to your catalog by exact name (or by hash, for Hasheous); keyword results may link a close match.")}</p>
      <form class="inline" id="reqform">
        <label>${tr('provider')}<select name="provider">${usable.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('')}</select></label>
        <label>${tr('request')}<select name="mode"></select></label>
        <label data-for="keyword">${tr('keyword')}<input type="text" name="name" placeholder="${tr('game name')}" style="min-width:200px"></label>
        <label data-for="platform">${tr('platform')}<select name="platform"></select></label>
        <label data-for="pages">${tr('max pages')}<input type="number" name="max_pages" min="1" style="width:80px" placeholder="${tr('all')}"></label>
        <label data-for="redownload" title="${tr('By default a bulk sync fetches only what changed since the last complete sync (a dump that did not change is not downloaded at all). Tick to fetch everything again.')}"><span>${tr('redownload everything')}</span><input type="checkbox" name="redownload"></label>
        <button class="btn primary">${tr('send')}</button>
        <div data-for="platforms" style="flex-basis:100%">${platformPickerHtml('plats')}</div>
      </form>
      <p class="muted" id="reqnotes" style="margin-top:8px"></p><p class="muted" id="reqonly"></p>`;
  const form = card.querySelector('#reqform');
  if (!usable.length) { form.innerHTML = `<span class="muted">${tr('No provider available — check api.env.')}</span>`; return; }
  const show = (key, on) => { form.querySelector(`[data-for="${key}"]`).style.display = on ? '' : 'none'; };
  const refresh = () => {
    const p = usable.find(x => x.name === form.provider.value), c = p.capabilities;
    const modes = [];
    if (c.keyword) modes.push(['keyword', tr('keyword search')]);
    if (c.platform) { modes.push(['platform', tr('bulk: checked platforms')]); modes.push(['all', tr('bulk: every catalog platform')]); }
    if (c.full) modes.push(['full', tr('bulk: full database')]);
    const keep = form.mode.value;
    form.mode.innerHTML = modes.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
    if (modes.some(([v]) => v === keep)) form.mode.value = keep;
    const mode = form.mode.value;
    show('keyword', mode === 'keyword');
    show('platform', mode === 'keyword');
    show('platforms', mode === 'platform');
    form.platform.innerHTML = platformOptions(form.platform.value, mode === 'keyword' ? (c.keyword_needs_platform ? tr('— choose a platform —') : tr('any platform')) : tr('— choose a platform —'), p.bulk_platforms);
    // Only the platforms this provider has: the rest are hidden and unticked.
    for (const box of form.querySelectorAll('input[name="plats"]')) { const ok = !p.bulk_platforms || p.bulk_platforms.includes(Number(box.value)); box.closest('label').hidden = !ok; if (!ok) box.checked = false; }
    card.querySelector('#reqonly').textContent = p.bulk_platforms ? trf('{provider} has {n} of these platforms; the others are not offered.', { provider: p.name, n: p.bulk_platforms.length }) : '';
    show('pages', mode === 'platform' || mode === 'all' ? ['igdb', 'thegamesdb', 'emuready'].includes(p.name) : false);
    show('redownload', mode !== 'keyword');
    card.querySelector('#reqnotes').textContent = c.notes;
    recount();
  };
  // "one platform or more": each ticked platform becomes its own single-platform job.
  const picker = wirePlatformPicker(form.querySelector('[data-for="platforms"]'), 'plats');
  const checks = picker.checks, recount = picker.recount;
  form.provider.onchange = refresh; form.mode.onchange = refresh; refresh();
  // Ticked to start with: the platforms the DAT sync setting stands for (Settings ›
  // dat_sync_platforms), so a bulk sync covers what you have.
  api('/api/v1/dat_platforms').then(r => { if (Array.isArray(r.platforms)) { picker.set(r.platforms); refresh(); } }).catch(() => {});
  queueable(submitOf(form));
  form.onsubmit = e => {
    e.preventDefault();
    const f = new FormData(form), provider = f.get('provider'), mode = f.get('mode'), c = usable.find(x => x.name === provider).capabilities;
    const platform = f.get('platform') ? Number(f.get('platform')) : null;
    if (mode === 'keyword') {
      if (!f.get('name')) return toast(tr('type a keyword'), true);
      if (c.keyword_needs_platform && !platform) return toast(trf('{provider} searches per platform: choose one', { provider }), true);
      const body = { job_type: 'provider_query', provider, name: f.get('name') }; if (platform) body.platform = platform;
      return enqueue(body);
    }
    const body = { job_type: 'provider_bulk_sync', provider, mode: f.get('redownload') ? 'redownload' : 'diff' };
    if (f.get('max_pages')) body.max_pages = Number(f.get('max_pages'));
    if (mode === 'full') {
      if (!confirm(trf("Pull {provider}'s whole database?", { provider }) + `\n\n${c.notes}`)) return;
      body.full = true;
    } else if (mode === 'all') {
      if (!confirm(trf("Sync {provider} for every platform your catalog has releases for? This can take a long time and use the provider's quota.", { provider }))) return;
      body.platform = 'all';
    } else {
      const ids = checks().filter(c => c.checked).map(c => Number(c.value));
      if (!ids.length) return toast(tr('check at least one platform'), true);
      return (async () => {
        const queued = [];
        for (const id of ids) {
          try { queued.push((await api('/api/v1/jobs', { method: 'POST', body: { ...body, platform: id } })).id); } catch (err) { toast(`${vocab.platforms.find(p => p.id === id)?.name || id}: ${err.message}`, true); }
        }
        if (queued.length) toast(trf('enqueued {n} job(s) — progress under Jobs', { n: queued.length }));
        refreshHeader();
      })();
    }
    enqueue(body);
  };
}

// The credentials each provider needs. Write-only: which keys are set, and new values; an
// empty field keeps what is there, × clears the key on save.
async function showCredentials(card, scope = 'providers') {
  let fields;
  try { fields = await api('/api/v1/providers/credentials' + qs({ scope })); } catch (err) { card.innerHTML = `<h2>${tr('Credentials')}</h2><p class="muted">${esc(err.message)}</p>`; return; }
  const providers = [...new Set(fields.map(f => f.provider))];
  const edits = {};
  card.innerHTML = `<h2>${tr('Credentials')}</h2><p class="muted">${tr('Type a value to set it, or leave a field blank to keep what is there. To clear a key, press its × and save. Saved values take effect on the next request or job, no restart needed.')}</p><form id="credform">${providers.map(p => `<div style="margin:8px 0"><h3>${providerIcon(p)} ${esc(p)}</h3><table class="grid"><tbody>${fields.filter(f => f.provider === p).map(f => `<tr data-key="${esc(f.key)}"><td>${esc(f.label)}${f.required ? '' : ` <span class="muted">${tr('(optional)')}</span>`}</td><td class="state">${f.set ? badge(tr('set'), 'ok') : badge(tr('not set'), 'dim')}</td><td><input type="${f.secret ? 'password' : 'text'}" autocomplete="off" style="min-width:320px" placeholder="${f.set ? tr('(unchanged)') : ''}"></td><td>${f.set ? `<button class="btn small danger" type="button" title="${tr('clear this key on save')}">×</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`).join('')}<div class="toolbar actions"><button class="btn primary">${tr('save')}</button></div></form>`;
  const form = card.querySelector('#credform');
  for (const row of form.querySelectorAll('tr[data-key]')) {
    const key = row.dataset.key, inp = row.querySelector('input'), state = row.querySelector('.state'), x = row.querySelector('button');
    inp.oninput = () => { if (inp.value) { edits[key] = inp.value; state.innerHTML = badge(tr('changed'), 'warn'); } else { delete edits[key]; state.innerHTML = fields.find(f => f.key === key).set ? badge(tr('set'), 'ok') : badge(tr('not set'), 'dim'); } };
    if (x) x.onclick = () => { edits[key] = ''; inp.value = ''; state.innerHTML = badge(tr('will be cleared'), 'warn'); };
  }
  form.onsubmit = async e => {
    e.preventDefault();
    if (!Object.keys(edits).length) return toast(tr('nothing changed'));
    try { await api('/api/v1/providers/credentials', { method: 'PUT', body: edits }); toast(tr('credentials saved')); if (card.onsaved) card.onsaved(); else showCredentials(card, scope); } catch (err) { toast(err.message, true); }
  };
}

    if (value === null || value === '') await api('/api/v1/settings/' + key, { method: 'DELETE' });

      <label>${tr('Ask menu: first link')} <select name="ask_first">${o.ask_links.map(([id, label]) => `<option value="${id}" ${id === o.ask_first ? 'selected' : ''}>${esc(label)}</option>`).join('')}</select></label>
      <label>${tr('ask saved answers again after (days; empty: keep)')} <input name="cache_days" type="number" min="0" value="${o.cache_days || ''}" style="width:90px"></label>

    const file = cache.querySelector('#aiimportfile').files[0];
    if (!file) return toast(tr('choose a file'), true);
    let list; try { list = JSON.parse(await file.text()); } catch (e) { return toast(tr('That file is not JSON.'), true); }
    try { const r = await api('/api/v1/ai/import', { method: 'POST', body: Array.isArray(list) ? list : [] }); toast(trf('{n} answer(s) imported', { n: r.imported })); showAiPage(); } catch (e) { toast(e.message, true); }

// Polls one job until it finishes, rendering its progress into `box` and then its `result`
// (the full summary the worker produced) underneath. Nothing else here watches a single
// job -- the Jobs tab refreshes its whole list -- so the timers are tracked and stopped on
// every route change.
let watchTimers = [];
function stopWatching() { for (const t of watchTimers) clearInterval(t); watchTimers = []; }
function watchJob(id, box, onDone) {
  box.innerHTML = `<div class="muted">${trf('job #{id} queued…', { id })}</div>`;
  let timer = null, last = '', ended = false;
  const tick = async () => {
    if (ended) return;
    // A job that is gone stays gone; anything else (the server restarting, a dropped
    // connection) is shown under the last progress and tried again on the next tick.
    let j; try { j = await api('/api/v1/jobs/' + id); } catch (err) { box.innerHTML = last + `<div class="bad">${esc(err.message)}</div>`; if (err.status === 404) { ended = true; clearInterval(timer); } return; }
    const done = ['done', 'failed', 'cancelled'].includes(j.status);
    last = `<div class="prog">${badge('#' + id + ' ' + j.job_type + ' · ' + j.status, { pending: 'warn', in_progress: 'warn', done: 'ok', failed: 'bad', cancelled: 'dim' }[j.status])} ${progressCell(j)}</div>`
      + (j.last_error ? `<div class="bad">${esc(j.last_error)}</div>` : '') + (done && j.result ? resultView(j.result) : '');
    box.innerHTML = last;
    if (done) {
      ended = true; clearInterval(timer);
      // The screen usually redraws itself when the job ends, which makes a new, empty box:
      // the result or error is put back in it, as the app's job watch keeps showing it.
      const redrawn = onDone ? onDone(j) : null;
      Promise.resolve(redrawn).then(() => { const again = box.id && document.getElementById(box.id); if (again && again !== box && !again.innerHTML.trim()) again.innerHTML = last; });
    }
  };
  timer = setInterval(tick, 1000); watchTimers.push(timer); tick();
}
// A job's `result` rendered generically: `[name, count]` lists as a collapsed per-table
// breakdown with a total, other lists joined, scalars as key/value. Empty things are skipped
// so "nothing was skipped" doesn't take up a row.
function resultView(r) {
  if (!r || typeof r !== 'object') return '';
  const rows = [];
  for (const [k, v] of Object.entries(r)) {
    if (v === null || v === undefined || v === '' || v === false || (Array.isArray(v) && !v.length)) continue;
    if (Array.isArray(v) && Array.isArray(v[0]) && v[0].length === 2) rows.push(`<div>${esc(k)}</div><div><details><summary>${trf('{n} table(s), {rows} rows', { n: v.length, rows: v.reduce((a, [, n]) => a + Number(n || 0), 0) })}</summary><table class="grid">${v.map(([n, c]) => `<tr><td class="mono">${esc(n)}</td><td class="num">${c}</td></tr>`).join('')}</table></details></div>`);
    // A long list (a scan's errors and warnings) one per line, folded.
    else if (Array.isArray(v) && v.length > 3) rows.push(`<div>${esc(k)}</div><div><details><summary>${trf('{n} item(s)', { n: v.length })}</summary><div class="mono" style="white-space:pre-wrap; max-height:40vh; overflow:auto">${v.map(x => esc(typeof x === 'string' ? x : JSON.stringify(x))).join('\n')}</div></details></div>`);
    else if (Array.isArray(v)) rows.push(`<div>${esc(k)}</div><div>${esc(v.join(', '))}</div>`);
    else if (typeof v === 'object') rows.push(`<div>${esc(k)}</div><div>${Object.entries(v).map(([k2, v2]) => `<div><span class="muted">${esc(k2)}</span> ${esc(typeof v2 === 'string' ? v2 : JSON.stringify(v2))}</div>`).join('')}</div>`);
    else rows.push(`<div>${esc(k)}</div><div>${esc(String(v))}</div>`);
  }
  return `<div class="kv" style="margin-top:6px">${rows.join('')}</div>`;
}

// The server's refusal (a 409 with exactly what a catalogue replacement costs) shown
// verbatim, the art choice, then a native confirm -- the same two-stage shape as removing a
// directory tree. `onProceed(media)` resends whatever was refused, with consent.
function consentDialog(title, message, onProceed) {
  const box = openModal(`<h2>${esc(title)}</h2>
    <pre style="white-space:pre-wrap; font:inherit; max-height:50vh; overflow:auto; margin:6px 0 10px">${esc(message)}</pre>
    <div class="kv" style="grid-template-columns:max-content 1fr"><div>${tr('downloaded art')}</div><div>
      <label><input type="radio" name="media" value="relink" checked> ${tr('keep the files and re-attach them after the sync (relink)')}</label><br>
      <label><input type="radio" name="media" value="redownload"> ${tr('forget them; art comes back on the next provider query (redownload)')}</label></div></div>
    <div class="fsfoot"><span class="grow"></span><button type="button" class="btn" data-id="cancel">${tr('cancel')}</button><button type="button" class="btn danger" data-id="go">${tr('replace the catalogue')}</button></div>`);
  box.querySelector('[data-id="cancel"]').onclick = closeModal;
  box.querySelector('[data-id="go"]').onclick = () => {
    const media = box.querySelector('input[name=media]:checked').value;
    if (!confirm(tr("Are you sure? This machine's own catalogue is deleted and replaced by the server's on the next sync. Files, folders and settings stay."))) return;
    closeModal(); onProceed(media);
  };
}

// Config › Backup: the configuration as one JSON file (`api::config_file`). Export downloads
// it. Import reads the chosen file here, asks which of its sections to bring in, and then
// shows what was applied, what was already so, and what was skipped and why.
const CONFIG_SECTIONS = [['settings', 'Settings'], ['directories', 'Directories'], ['storage', 'Storage'], ['emulators', 'Emulators'], ['output', 'Copy folders and formats'], ['schedules', 'Scheduled jobs']];
function configSectionCount(config, section) {
  const v = config[section];
  if (!v || typeof v !== 'object') return 0;
  if (section === 'storage') return (v.media_dirs || []).length + (v.temp_dirs || []).length;
  if (section === 'output') return Object.keys(v.folders || {}).length + Object.keys(v.formats || {}).length;
  return Array.isArray(v) ? v.length : Object.keys(v).length;
}
// The last import's summary. Outside the card, because an import that changed the settings
// draws the page again (in the UI language it may have just set) and the new card shows it.
let configImported = null;
function configImportSummary(r, label) {
  const skipped = r.sections.flatMap(s => s.skipped.map(k => `<tr><td>${esc(label(s.section))}</td><td class="mono">${esc(k.item)}</td><td class="bad">${esc(k.reason)}</td></tr>`));
  return `<table class="grid"><thead><tr><th>${tr('section')}</th><th class="num">${tr('added or changed')}</th><th class="num">${tr('already so')}</th><th class="num">${tr('skipped')}</th></tr></thead><tbody>${r.sections.map(s => `<tr><td>${esc(label(s.section))}</td><td class="num">${s.applied}</td><td class="num">${s.unchanged}</td><td class="num">${s.skipped.length}</td></tr>`).join('')}</tbody></table>
    ${skipped.length ? `<table class="grid"><thead><tr><th>${tr('section')}</th><th>${tr('skipped')}</th><th>${tr('why')}</th></tr></thead><tbody>${skipped.join('')}</tbody></table>` : ''}`;
}
function configFileCard(host) {
  host.insertAdjacentHTML('beforeend', `<div class="card"><h2>${tr('Configuration file')}</h2>
    <p class="muted">${tr('Settings, scheduled jobs, emulators, copy folder names and formats, collection directories and storage folders as one JSON file — for a new install or another machine. Provider credentials and accounts are not in it. Importing adds and changes; it never removes.')}</p>
    <div class="toolbar"><button class="btn primary" id="cfg-export">${tr('export configuration')}</button><span class="grow"></span><input type="file" id="cfg-file" accept=".json,application/json"><button class="btn" id="cfg-read">${tr('import configuration…')}</button></div><div id="cfg-box"></div></div>`);
  const box = document.getElementById('cfg-box');
  const label = id => tr((CONFIG_SECTIONS.find(s => s[0] === id) || [id, id])[1]);
  if (configImported) box.innerHTML = configImportSummary(configImported, label);
  document.getElementById('cfg-export').onclick = async () => {
    try {
      const res = await fetch('/api/v1/config/export', { headers: token ? { Authorization: 'Bearer ' + token } : {} });
      if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0, 200));
      const name = (/filename="([^"]+)"/.exec(res.headers.get('Content-Disposition') || '') || [])[1] || 'romexplorer-config.json';
      const url = URL.createObjectURL(await res.blob());
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    } catch (e) { toast(e.message, true); }
  };
  document.getElementById('cfg-read').onclick = async () => {
    const file = document.getElementById('cfg-file').files[0];
    if (!file) return toast(tr('choose a file'), true);
    let config;
    try { config = JSON.parse(await file.text()); } catch (e) { return toast(tr('That file is not JSON.'), true); }
    const held = CONFIG_SECTIONS.map(([id]) => [id, configSectionCount(config || {}, id)]).filter(s => s[1] > 0);
    if (!config || config.format !== 'romexplorer-config' || !held.length) return toast(tr('That is not a romexplorer configuration file, or it is empty.'), true);
    configImported = null;
    box.innerHTML = `<p>${trf('{name}: exported {date} by romexplorer {version}. Bring in:', { name: esc(file.name), date: esc(config.exported_at || '?'), version: esc(config.app_version || '?') })}</p>
      <div class="toolbar">${held.map(([id, n]) => `<label><input type="checkbox" data-cfg="${id}" checked> ${esc(label(id))} <span class="muted">(${n})</span></label>`).join('')}<span class="grow"></span><button class="btn primary" id="cfg-go">${tr('import')}</button></div>`;
    document.getElementById('cfg-go').onclick = async () => {
      const sections = [...box.querySelectorAll('[data-cfg]')].filter(c => c.checked).map(c => c.dataset.cfg);
      if (!sections.length) return toast(tr('tick at least one section'), true);
      try {
        const r = await api('/api/v1/config/import', { method: 'POST', body: { config, sections } });
        configImported = r;
        // Settings take effect as a Save would: the console's copy of them (the UI language
        // among them) is read again, and the page drawn again with it.
        if (r.sections.some(s => s.section === 'settings' && s.applied > 0)) { await loadUiSettings(); route(); }
        else box.innerHTML = configImportSummary(r, label);
        toast(tr('configuration imported'));
      } catch (err) { toast(err.message, true); }
    };
  };
}

  view.innerHTML = `<div class="card"><h2>${tr('Share: remote sources')}</h2>
    <p class="muted">${tr("The servers and peers this machine syncs from. One may be the <b>main</b> server — where this machine's catalogue comes from, and what \"not on server\" is measured against; the rest are <b>peer</b> shares, whose collections show up as \"on a peer\". Tokens go in and never come back out.")}</p>
    ${mode.mode !== 'client' ? `<p class="muted" data-keep>${badge(tr('standalone'), 'warn')} ${tr("This machine builds its own catalogue. Designating a main server here replaces that catalogue with the server's — you will be asked first. Choosing <a class=\"link\" onclick=\"go('config/mode')\">client mode</a> first is the intended order.")}</p>` : ''}
    <div class="toolbar"><button class="btn primary" id="src-add">${tr('add source')}</button></div>
    <div id="src-watch"></div>
    <table class="grid"><thead><tr><th>${tr('name')}</th><th>${tr('role')}</th><th>${tr('address')}</th><th>${tr('token')}</th><th>${tr('enabled')}</th><th>${tr('last sync')}</th><th>${tr('mirrored')}</th><th></th></tr></thead><tbody>
    ${sources.length ? sources.map(s => `<tr><td>${esc(s.name)}</td><td>${badge(s.role, s.role === 'main' ? 'ok' : 'dim')}</td><td class="mono">${esc(s.base_url)}${s.tls_fingerprint ? `<div class="muted" title="${tr('the certificate this machine trusts for it (SHA-256)')}">${esc(trf('cert {fp}…', { fp: s.tls_fingerprint.slice(0, 16) }))}</div>` : ''}</td><td>${s.has_token ? badge(tr('set'), 'ok') : badge(tr('none'), 'bad')}</td><td>${s.enabled ? badge(tr('yes'), 'ok') : badge(tr('no'), 'dim')}</td><td>${fmtDate(s.last_sync_at) || `<span class="muted">${tr('never')}</span>`}</td>
      <td>${s.tables.length ? `<details><summary>${trf('{n} table(s), {rows} rows', { n: s.tables.length, rows: s.tables.reduce((a, t) => a + t.row_count, 0) })}</summary><table class="grid">${s.tables.map(t => `<tr><td class="mono">${esc(t.table_name)}</td><td class="num">${t.row_count}</td><td>${fmtDate(t.synced_at)}</td></tr>`).join('')}</table></details>` : `<span class="muted">${tr('nothing yet')}</span>`}</td>
      <td style="white-space:nowrap"><span class="link" data-check="${s.id}">${tr('check')}</span> <span class="link" data-sync="${s.id}">${tr('sync')}</span> <span class="link" data-fullsync="${s.id}" title="${tr('download every table again, not only what changed -- for a mirror that has gone wrong')}">${tr('full sync')}</span> <span class="link" data-art="${s.id}" title="${tr('fetch the art this source has and this machine lacks: from it first, from the provider only for a file it no longer has')}">${tr('art')}</span> <span class="link" data-edit="${s.id}">${tr('edit')}</span>${s.tls_fingerprint ? ` <span class="link" data-trust="${s.id}" title="${tr("after the other machine's certificate was replaced on purpose")}">${tr('trust new certificate')}</span>` : ''} <span class="link" data-forget="${s.id}">${tr('forget')}</span> <span class="link" data-del="${s.id}">${tr('delete')}</span><div class="muted" id="src-check-${s.id}"></div><div data-mounts="${s.id}"></div></td></tr>`).join('') : `<tr><td colspan="8" class="muted">${tr('none — add the main server, or a peer whose share you want to see')}</td></tr>`}
    </tbody></table></div>`;
  const watch = document.getElementById('src-watch');
  const byId = id => sources.find(s => s.id === Number(id));
  document.getElementById('src-add').onclick = () => sourceDialog({ name: '', base_url: '', role: 'peer', enabled: true }, showSources);
  for (const b of view.querySelectorAll('[data-edit]')) b.onclick = () => sourceDialog(byId(b.dataset.edit), showSources);
  for (const b of view.querySelectorAll('[data-check]')) b.onclick = async () => {
    const out = document.getElementById('src-check-' + b.dataset.check), s = byId(b.dataset.check); out.textContent = tr('checking…');
    try {
      const r = await api('/api/v1/sources/' + s.id + '/check');

      // would otherwise just never supply a catalogue.
      const wrongPort = s.role === 'main' && r.reachable && r.authorized && !r.offers_catalog;
      out.innerHTML = [badge(r.reachable ? tr('reachable') : tr('unreachable'), r.reachable ? 'ok' : 'bad'), badge(r.authorized ? tr('token ok') : tr('token rejected'), r.authorized ? 'ok' : 'bad'), badge(r.offers_catalog ? tr('offers catalogue') : tr('ownership only'), r.offers_catalog ? 'ok' : (wrongPort ? 'bad' : 'dim'))].join(' ')
        + ` <span class="muted">${esc(r.detail)}</span>` + (wrongPort ? `<div class="bad">${tr("Set as the main server, but this address is a share: it cannot supply a catalogue. Use the server's main port, not its share port.")}</div>` : '');
