function reviewStatusBadge(status) {
  return status === 'accepted' ? badge(tr('taken'), 'ok') : status === 'dismissed' ? badge(tr('said no'), 'dim') : '';
}

// The releases on a merge review card as boxes, one per title, to drag between (the app's
// ArrangePanel): into another title, or onto "+" for a new title named after the first one
// dropped there. A tap picks a release and a tap on a box puts it there, for touch screens.
// Starts from the recommended choice's grouping, or from the titles as they are.
function arrangeStart(it, fromSuggestion) {
  const names = {};
  for (const t of it.titles) for (const r of t.releases) names[r.id] = r;
  for (const [id, r] of Object.entries(it.releases || {})) names[id] = r;
  const holder = id => (it.releases[id] || {}).title_id ?? it.titles.find(t => t.releases.some(r => r.id === Number(id)))?.id;
  const live = it.titles.filter(t => !t.deleted);
  const rec = it.options.find(o => o.recommended && (o.groups || []).length);
  let boxes;
  if (fromSuggestion && rec) {
    const used = new Set();
    boxes = rec.groups.map(g => {
      const count = {};
      for (const id of g) { const t = holder(id); if (t != null) count[t] = (count[t] || 0) + 1; }
      const pick = Object.entries(count).sort((a, b) => b[1] - a[1]).map(([t]) => Number(t)).find(t => !used.has(t) && live.some(x => x.id === t));
      if (pick != null) used.add(pick);
      return { title_id: pick ?? null, releases: g.slice() };
    });
    for (const t of live) if (!used.has(t.id)) boxes.push({ title_id: t.id, releases: [] });
  } else {
    boxes = live.map(t => ({ title_id: t.id, releases: [] }));
    const placed = new Set();
    for (const id of Object.keys(names).map(Number)) {
      const b = boxes.find(x => x.title_id === holder(id));
      if (b && !placed.has(id)) { b.releases.push(id); placed.add(id); }
    }
  }
  return { boxes, names };
}
function arrangePanel(host, it, q) {
  let { boxes, names } = arrangeStart(it, true);
  let picked = null;
  const titleName = id => (it.titles.find(t => t.id === id) || {}).name || '#' + id;
  const label = id => { const r = names[id]; return r ? `${esc(r.name)} ${regionBadges(r.region)}` : '#' + id; };
  const move = (rid, to) => {
    for (const b of boxes) b.releases = b.releases.filter(x => x !== rid);
    if (to === 'new') boxes.push({ title_id: null, releases: [rid] }); else boxes[to].releases.push(rid);
    boxes = boxes.filter(b => b.title_id != null || b.releases.length);
    picked = null; draw();
  };
  const draw = () => {
    const box = (b, i) => `<div class="card" data-box="${i}" style="flex:1 1 240px;margin:0;min-height:60px">
      <div><b>${b.title_id != null ? `<a class="link" href="#collection/titles/${b.title_id}">${esc(titleName(b.title_id))}</a>` : `${tr('new title')}: ${b.releases.length ? esc(names[b.releases[0]]?.name || '') : ''}`}</b>${b.title_id != null && !b.releases.length ? ` <span class="muted">${tr('(left empty: removed)')}</span>` : ''}</div>
      <div style="display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:12px">${b.releases.map(r => `<span draggable="true" data-rel="${r}" style="cursor:grab;padding:2px 4px;border-radius:4px;${picked === r ? 'outline:2px solid var(--accent, #4a8);' : ''}">⋮⋮ ${label(r)}</span>`).join('')}</div></div>`;
    host.innerHTML = `<h3>${tr('Arrange yourself')}</h3><p class="muted" style="font-size:12px">${tr('Drag releases to the title they belong to, or onto + for a new title named after the first one. Or tap a release, then a box.')}</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${boxes.map(box).join('')}<div class="card" data-box="new" style="flex:0 0 120px;margin:0;min-height:60px;display:flex;align-items:center;justify-content:center;font-size:28px;border-style:dashed" title="${tr('a new title')}">+</div></div>
      <div class="toolbar" style="margin-top:8px"><button class="btn primary" id="arr-go">${tr('apply this grouping')}</button> <button class="btn" id="arr-now">${tr('start from the titles as they are')}</button> <button class="btn" id="arr-rec">${tr('start from the suggestion')}</button></div>`;
    for (const s of host.querySelectorAll('[data-rel]')) {
      s.ondragstart = e => { e.dataTransfer.setData('text/plain', s.dataset.rel); };
      s.onclick = e => { e.stopPropagation(); picked = picked === Number(s.dataset.rel) ? null : Number(s.dataset.rel); draw(); };
    }
    for (const b of host.querySelectorAll('[data-box]')) {
      const to = b.dataset.box === 'new' ? 'new' : Number(b.dataset.box);
      b.ondragover = e => e.preventDefault();
      b.ondrop = e => { e.preventDefault(); const rid = Number(e.dataTransfer.getData('text/plain')); if (rid) move(rid, to); };
      b.onclick = () => { if (picked != null) move(picked, to); };
    }
    host.querySelector('#arr-now').onclick = () => { ({ boxes, names } = arrangeStart(it, false)); draw(); };
    host.querySelector('#arr-rec').onclick = () => { ({ boxes, names } = arrangeStart(it, true)); draw(); };
    host.querySelector('#arr-go').onclick = async () => {
      try { await api('/api/v1/review/merges/' + encodeURIComponent(it.key) + '/apply', { method: 'POST', body: { layout: boxes.map(b => ({ title_id: b.title_id, releases: b.releases })) } }); q.done(); } catch (e) { toast(e.message, true); }
    };
  };
  draw();
}

// Merge review's "What differs" (the app's LookupPanel): the in-app AI's answer, saved per
// suggestion and language, with Ask again / pin, "Ask in <language>" when only another
// language's answer is saved, and the Ask menu of browser links.
async function lookupPanel(look, key, req) {
  look.innerHTML = `<h3>${tr('What differs')}</h3><span class="muted">${tr('asking…')}</span>`;
  let v;
  try { v = await api('/api/v1/review/merges/' + encodeURIComponent(key) + '/lookup', { method: 'POST', body: Object.assign({ lang: uiLanguage }, req) }); }
  catch (e) { look.innerHTML = `<h3>${tr('What differs')}</h3><span class="bad">${esc(e.message)}</span>`; return; }
  const a = v.answer || v.other_language;
  const sources = a && a.sources && a.sources.length ? `<div class="muted" style="font-size:12px;margin-top:4px">${tr('sources:')} ${a.sources.map(s => `<a class="link" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>`).join(' ')}</div>` : '';
  const meta = a ? `<div class="muted" style="font-size:12px;margin-top:4px">${esc(trf('saved on {date} · {model}', { date: fmtDate(a.created_at), model: a.model }))}${a.cost_usd != null ? ' · ' + esc(trf('approx. US${cost}', { cost: Number(a.cost_usd).toFixed(4) })) : ''}${a.pinned ? ' ' + badge(tr('pinned'), 'ok') : ''}</div>` : '';
  const other = !v.answer && v.other_language ? `<div class="muted">${esc(trf('Saved in {language}.', { language: langNative(v.other_language.lang) }))}</div>` : '';
  const buttons = [];
  if (v.answer && !v.answer.pinned) buttons.push(`<button class="btn small" data-look="again" title="${esc(tr('asks the AI again and replaces this answer'))}">${tr('Ask again')}</button>`);
  if (v.answer) buttons.push(`<button class="btn small" data-look="pin" title="${esc(tr('a pinned answer is kept: never asked again, expired or cleared with the cache'))}">${v.answer.pinned ? tr('unpin') : tr('pin')}</button>`);
  if (!v.answer && v.other_language) buttons.push(`<button class="btn small primary" data-look="ask">${esc(trf('Ask in {language}', { language: langNative(v.lang) }))}</button>`);
  const links = (v.ask_links || []).map((l, i) => `<a class="btn small${i === 0 ? ' primary' : ''}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(' ');
  look.innerHTML = `<h3>${tr('What differs')}</h3>${other}${a ? `<div style="white-space:pre-wrap;font-size:13px">${esc(a.answer)}</div>` : ''}${sources}${meta}
    ${v.error ? `<div class="muted">${esc(v.error)}</div>` : ''}
    ${buttons.length ? `<div class="toolbar" style="margin-top:6px">${buttons.join(' ')}</div>` : ''}
    <div class="toolbar" style="margin-top:6px"><span class="muted" title="${esc(tr('opens the question in the browser, signed in as you'))}">${tr('Ask:')}</span> ${links} <a class="link" href="${esc(v.google_url)}" target="_blank" rel="noopener">${tr('search')}</a></div>`;
  for (const b of look.querySelectorAll('[data-look]')) b.onclick = async () => {
    if (b.dataset.look === 'pin') {
      try { await api('/api/v1/ai/answers/' + v.answer.id + '/pin', { method: 'PUT', body: { pinned: !v.answer.pinned } }); } catch (e) { return toast(e.message, true); }
      lookupPanel(look, key, {});
    } else lookupPanel(look, key, { [b.dataset.look]: true });
  };
}

  const grid = makeGrid(document.getElementById('grid'), {

      { key: 'reason', label: tr('why'), render: r => `<span class="mono">${esc(r.reason)}</span>` },
      { key: 'grade', label: tr('grade'), render: r => badge(tr(r.grade), r.grade === 'name' ? 'warn' : 'dim') },
      { key: 'releases', label: tr('releases'), cls: 'num', render: r => r.release_count ?? `<span class="muted" title="${tr('merged before titles were archived')}">?</span>` },
      { key: 'when', label: tr('merged'), render: r => fmtDate(r.merged_at) },
      { key: 'act', label: '', render: r => r.undone_at ? `<span class="muted">${trf(r.reason === 'split' ? 'rejoined {date} →' : 'decoupled {date} →', { date: fmtDate(r.undone_at) })}</span> <a class="link" href="#collection/titles/${r.restored_title_id}">#${r.restored_title_id}</a>` : `<button class="btn small" data-decouple="${r.id}">${tr(r.reason === 'split' ? 'undo split' : 'decouple')}</button>` },
    ],
    filters: [
      { key: 'grade', label: tr('grade'), type: 'select', options: () => `<option value="">${tr('any grade')}</option>` + ['name', 'hash', 'manual'].map(g => `<option value="${g}">${tr(g)}</option>`).join('') },
      { key: 'include_undone', label: tr('include decoupled'), type: 'check' },

    fetch: st => api('/api/v1/catalog/titles/merges' + qs({ search: st.search, title_id: only, grade: st.filters.grade, include_undone: st.filters.include_undone, limit: st.limit, offset: st.offset })),
  });
  // Every merge of the grade picked in the filter, 500 a request until none is left.
  const all = el(`<button class="btn small" title="${tr('decouple every merge of the grade picked in the filter')}">${tr('decouple all of this grade')}</button>`);
  all.onclick = async () => {
    const grade = grid.state.filters.grade;

    try {

      do { r = await api('/api/v1/catalog/titles/merges/decouple', { method: 'POST', body: { grade } }); done += r.decoupled; } while (r.decoupled > 0 && r.remaining > 0);

    } catch (err) { toast(err.message, true); }
    all.disabled = false;
  };
  view.querySelector('.card h2').appendChild(document.createTextNode(' ')); view.querySelector('.card h2').appendChild(all);

    const b = e.target.closest('[data-decouple]'); if (!b) return;
    e.stopPropagation(); const r = (grid.state.items || []).find(x => String(x.id) === b.dataset.decouple);
    const split = r && r.reason === 'split';
    if (!confirm(split ? trf('Put "{merged}" back into "{current}"?', { merged: r.merged_name, current: r.current_title_name || '' }) : trf('Split "{merged}" back out of "{into}"?', { merged: r ? r.merged_name : tr('this title'), into: r ? r.current_title_name : '' }))) return;
    try { const res = await api('/api/v1/catalog/titles/merges/' + b.dataset.decouple + '/decouple', { method: 'POST' }); toast(trf(split ? 'back in title #{id}' : 'decoupled: title #{id}', { id: res.title_id })); grid.reload(); } catch (err) { toast(err.message, true); }
  });
}

// Base game filter: type to search titles (server-side), pick one -> the list shows it, its
// base game and every title sharing that base game (ports, remakes, DLC).
function baseGameFilter(getGrid, initialId) {
  const wrap = el(`<span class="combo" title="${tr('base game: a title and its ports / remakes')}"><span class="chips"></span><input type="text" placeholder="${tr('base game…')}"><div class="drop" style="display:none"></div></span>`);
  const chips = wrap.querySelector('.chips'), inp = wrap.querySelector('input'), drop = wrap.querySelector('.drop');
  const setChip = (id, label) => {
    chips.innerHTML = id ? `<span class="badge">${esc(label || ('#' + id))} <b title="${tr('remove')}">×</b></span>` : '';
    const x = chips.querySelector('b'); if (x) x.onclick = () => pick(null);
  };
  const pick = (id, label) => { const g = getGrid(); setChip(id, label); if (g) { g.state.filters.basegame = id ? String(id) : ''; g.state.offset = 0; g.reload(); } };
  let timer = null;
  inp.oninput = () => {
    clearTimeout(timer);
    const q = inp.value.trim(); if (q.length < 2) { drop.style.display = 'none'; return; }
    timer = setTimeout(async () => {
      try {
        const page = await api('/api/v1/catalog/titles' + qs({ search: q, limit: 15, view: 'collection' }));
        drop.innerHTML = page.items.map(t => `<div class="opt" data-id="${t.id}" data-l="${esc(t.display_name || t.name)}">${esc(t.display_name || t.name)} <span class="muted">${esc(t.platforms || '')} · ${esc(t.category)}</span></div>`).join('') || `<div class="muted">${tr('no titles')}</div>`;
        for (const d of drop.querySelectorAll('.opt')) d.onmousedown = e => { e.preventDefault(); inp.value = ''; drop.style.display = 'none'; pick(Number(d.dataset.id), d.dataset.l); };
        drop.style.display = '';
      } catch (e) { toast(e.message, true); }
    }, 300);
  };
  inp.onblur = () => setTimeout(() => { drop.style.display = 'none'; }, 150);
  if (initialId) api('/api/v1/catalog/titles/' + initialId).then(t => setChip(initialId, t.display_name || t.name)).catch(() => setChip(initialId));
  return wrap;
}

  const full = el(`<button class="btn small" title="${tr('the merge pass normally looks only at titles, releases and links changed since the last pass; this one goes over every title')}">${tr('full merge pass')}</button>`);
  full.onclick = async () => { try { const r = await api('/api/v1/catalog/titles/dedupe?full=true', { method: 'POST' }); toast(r.already_queued ? tr('already queued') : trf('merge pass queued #{id}', { id: r.job_id })); } catch (e) { toast(e.message, true); } };
  const reapply = el(`<button class="btn small" title="${tr('re-apply cached IGDB games to titles that have no localized names yet; for others, tick them and use re-apply IGDB metadata on the selection')}">${tr('re-apply IGDB metadata')}</button>`);
  reapply.onclick = async () => { try { const r = await api('/api/v1/jobs', { method: 'POST', body: { job_type: 'igdb_reapply' } }); toast(trf('queued #{id}', { id: r.id })); } catch (e) { toast(e.message, true); } };
  const reapplyAll = el(`<button class="btn small" title="${tr('re-apply the cached IGDB game of every IGDB-linked title, also those that have localized names already (names, genres, companies, base game); only name lookups go to IGDB')}">${tr('re-apply IGDB metadata (all)')}</button>`);
  reapplyAll.onclick = async () => { if (!confirm(tr('Re-apply IGDB metadata to every IGDB-linked title? On a large catalogue this takes a while.'))) return; try { const r = await api('/api/v1/jobs', { method: 'POST', body: { job_type: 'igdb_reapply', all: true } }); toast(trf('queued #{id}', { id: r.id })); } catch (e) { toast(e.message, true); } };
  return [sug, links, pass, full, reapply, reapplyAll];
}
async function mergeSuggestions(status = 'pending', offset = 0) {
  const page = await api('/api/v1/catalog/titles/merge-suggestions' + qs({ status, limit: 50, offset }));
  const box = openModal(`<h2>${tr('Merge suggestions')}</h2>
    <p class="muted">${tr("Titles linked to the same IGDB game that weren't merged automatically: the link is only a name-search guess, or the titles are on different platforms (ports). Accept merges them into one title (renamed by region priority); dismiss keeps them apart.")}</p>
    <div class="toolbar">${['pending', 'accepted', 'dismissed'].map(x => `<button class="btn small ${x === status ? 'on' : ''}" data-st="${x}">${tr(x)}</button>`).join('')} <span class="muted">${page.total} ${tr(status)}</span></div>
    ${status !== 'accepted' && page.total ? `<div class="toolbar"><label><input type="checkbox" id="ms-page"> ${tr('select this page')}</label>
      <button class="btn small primary" data-bulk="accept" disabled>${tr('merge selected')}</button>${status === 'pending' ? ` <button class="btn small" data-bulk="dismiss" disabled>${tr('dismiss selected')}</button>` : ''}
      <span class="spacer"></span>
      <button class="btn small" data-all="accept">${trf('merge all {n}', { n: page.total })}</button>${status === 'pending' ? ` <button class="btn small" data-all="dismiss">${trf('dismiss all {n}', { n: page.total })}</button>` : ''}</div>` : ''}
    <table class="grid">${page.items.map(g => `<tr>${status !== 'accepted' ? `<td><input type="checkbox" data-pick="${esc(g.igdb_id)}"></td>` : ''}<td>${g.igdb_id.startsWith('name:') ? tr('name match') : `<a class="link" href="https://www.igdb.com/search?q=${encodeURIComponent(g.titles[0] ? g.titles[0].name : '')}" target="_blank" rel="noopener">IGDB ${esc(g.igdb_id)}</a>`}<br>${badge(g.reason.replace('_', ' '), g.reason === 'name_link' ? 'warn' : 'dim')}</td>
      <td>${g.titles.map(t => `<div><span class="link" onclick="closeModal(); go('collection/titles/${t.id}')">${esc(t.name)}</span> <span class="muted">#${t.id} · ${esc(t.platforms || '')}</span> ${t.confidence ? badge(t.confidence, ['exact', 'hash', 'manual'].includes(t.confidence) ? 'ok' : 'warn') : ''}</div>`).join('')}</td>
      <td>${status === 'pending' ? `<button class="btn small primary" data-acc="${esc(g.igdb_id)}">${tr('merge')}</button> <button class="btn small" data-dis="${esc(g.igdb_id)}">${tr('dismiss')}</button>` : status === 'dismissed' ? `<button class="btn small" data-acc="${esc(g.igdb_id)}">${tr('merge anyway')}</button>` : ''}</td></tr>`).join('') || `<tr><td class="muted">${tr('none')}</td></tr>`}</table>
    <div class="pager"><button class="btn" data-prev ${offset === 0 ? 'disabled' : ''}>${tr('‹ prev')}</button><span>${trf('{from}–{to} of {total}', { from: page.total ? offset + 1 : 0, to: Math.min(offset + 50, page.total), total: page.total })}</span><button class="btn" data-next ${offset + 50 >= page.total ? 'disabled' : ''}>${tr('next ›')}</button> <button class="btn" id="ms-close">${tr('close')}</button></div>`);
  for (const b of box.querySelectorAll('[data-st]')) b.onclick = () => { closeModal(); mergeSuggestions(b.dataset.st, 0); };
  box.querySelector('[data-prev]').onclick = () => { closeModal(); mergeSuggestions(status, Math.max(0, offset - 50)); };
  box.querySelector('[data-next]').onclick = () => { closeModal(); mergeSuggestions(status, offset + 50); };
  box.querySelector('#ms-close').onclick = closeModal;
  const act = async (id, action) => { try { const r = await api('/api/v1/catalog/titles/merge-suggestions/' + encodeURIComponent(id) + '/' + action, { method: 'POST' }); toast(action === 'accept' ? trf('merged into title #{id}', { id: r.title_id }) : tr('dismissed')); closeModal(); mergeSuggestions(status, offset); } catch (e) { toast(e.message, true); } };
  for (const b of box.querySelectorAll('[data-acc]')) b.onclick = () => act(b.dataset.acc, 'accept');
  for (const b of box.querySelectorAll('[data-dis]')) b.onclick = () => act(b.dataset.dis, 'dismiss');
  // Several at once: the ticked ones, or the whole backlog of this status.
  const picks = () => [...box.querySelectorAll('[data-pick]:checked')].map(c => c.dataset.pick);
  const refreshBulk = () => { for (const b of box.querySelectorAll('[data-bulk]')) b.disabled = !picks().length; };
  for (const c of box.querySelectorAll('[data-pick]')) c.onchange = refreshBulk;
  const pageBox = box.querySelector('#ms-page');
  if (pageBox) pageBox.onchange = () => { for (const c of box.querySelectorAll('[data-pick]')) c.checked = pageBox.checked; refreshBulk(); };
  const bulk = async (action, body, n) => {
    if (body.all && !confirm(action === 'accept' ? trf('Merge all {n} suggestions? Each can be undone under Edit › Combined titles.', { n }) : trf('Dismiss all {n} suggestions?', { n }))) return;
    try {
      const r = await api('/api/v1/catalog/titles/merge-suggestions/bulk', { method: 'POST', body: Object.assign({ action, status }, body) });
      toast((action === 'accept' ? trf('merged {n} suggestion(s)', { n: r.resolved }) : trf('dismissed {n} suggestion(s)', { n: r.resolved })) + (r.failed.length ? ' — ' + trf('{n} could not be merged', { n: r.failed.length }) : ''), r.failed.length > 0);
      closeModal(); mergeSuggestions(status, 0);
    } catch (e) { toast(e.message, true); }
  };
  for (const b of box.querySelectorAll('[data-bulk]')) b.onclick = () => bulk(b.dataset.bulk, { ids: picks() }, picks().length);
  for (const b of box.querySelectorAll('[data-all]')) b.onclick = () => bulk(b.dataset.all, { all: true }, page.total);
}

// A row's sizes for the selection total: a title's four (on disk / catalogue, all its releases
// and its first), a release's two. Null for rows that carry none.
function rowSizes(r) {
  if ('local_size_all' in r) return [[tr('on disk, all releases'), r.local_size_all], [tr('on disk, first release'), r.local_size_top], [tr('catalogue, all releases (raw)'), r.catalog_size_all], [tr('catalogue, first release (raw)'), r.catalog_size_top]];
  if ('local_size' in r) return [[tr('on disk'), r.local_size], [tr('catalogue (raw)'), r.catalog_size]];
  return null;
}

// A title's size: with several releases, all of them and its first (by region priority) on two
// lines, "—" where there is nothing; with one, the one number.
function sizeCell(all, first, several) {
  const f = n => n ? fmtSize(n) : '—';
  return several ? `<div>${esc(trf('all: {size}', { size: f(all) }))}</div><div class="muted">${esc(trf('first: {size}', { size: f(first) }))}</div>` : (all ? fmtSize(all) : '');
}

// A release's name as the lists show it: its localized title first when "display localized
// title as title" is on (the DAT name under it), else the DAT name (the localized one under it).
function releaseDisplayName(r) { return localizedNames ? (r.display_name || r.local_title || r.name) : r.name; }
// The gray line: the canonical DAT name under a localized main name, or the localized name
// under the DAT name when localized titles are off.
function releaseSubName(r) { const main = releaseDisplayName(r); const other = main === r.name ? (r.local_title || r.display_name) : r.name; return other && other !== main ? other : ''; }
function editionBadges(r) { return [r.is_budget && badge(tr('budget'), 'ok'), r.is_special_edition && badge(tr('special edition'), 'warn'), r.is_aftermarket && badge(tr('aftermarket')), r.is_rerelease && badge(tr('re-release'), 'dim')].filter(Boolean).join(' '); }
function releaseNameHtml(r) { const other = releaseSubName(r), ed = [kindBadge(r), editionBadges(r)].filter(Boolean).join(' '); return esc(releaseDisplayName(r)) + (ed ? ' ' + ed : '') + (other ? `<div class="localname">${esc(other)}</div>` : ''); }
// What put a set's row in it: D a definitive version (a family), C a cross-platform game, T a
// title, R a release.
function entryType(r) {
  return r.set_via === 'family' ? ['D', tr('Def'), tr('definitive version')] : r.set_via === 'game' ? ['C', tr('Cross'), tr('cross-platform game')] : r.set_via === 'title' ? ['T', tr('Title'), tr('title')] : ['R', tr('Release'), tr('release')];
}
// The list's word.
function entryTypeBadge(r) { const [letter, word, label] = entryType(r); return `<span class="badge entry-type ${letter}" title="${esc(label)}">${esc(word)}</span>`; }
// The round emblem on a cover.
function entryTypeEmblem(r) { const [letter, word, label] = entryType(r); return `<span class="entry-emblem ${letter}" title="${esc(word + ': ' + label)}">${letter}</span>`; }
function releaseCard(r) { const main = releaseDisplayName(r), other = releaseSubName(r); return { title: main, media: r.cover_media_id, local: heldClass(r), flags: statusBadges(r), chips: kindBadge(r) + releaseChips(r), sub: (other ? `<div class="localname">${esc(other)}</div>` : '') + cbadge('platform', r.platform) + regionBadges(r.region) }; }

// Opening a title/release page queues its metadata/art fetches at interactive priority
// (the worker's fast lanes), so it never waits behind a bulk sync. Silent unless asked.
const refreshed = new Set();
async function pageRefresh(kind, id, loud) {
  const key = kind + ':' + id;
  if (!loud && refreshed.has(key)) return;
  refreshed.add(key);
  try { const r = await api('/api/v1/catalog/' + kind + '/' + id + '/refresh', { method: 'POST', body: {} }); if (loud || r.jobs.length) toast(r.jobs.length ? trf('refresh queued: {n} job(s) at high priority — reload in a bit', { n: r.jobs.length }) : tr('nothing to refresh') + (r.already_queued.length ? ' ' + trf('(already queued: {jobs})', { jobs: r.already_queued.join(', ') }) : '')); } catch (e) { if (loud) toast(e.message, true); }
}

  const serialBadge = x => x.serial_match ? `<span class="badge warn" title="${esc(trf(serialTitles[x.serial_match] || serialTitles.header, { serial: x.serial_matched || '' }))}">${esc(tr('serial match'))}</span>` : '';
  const completeBadge = x => x.serial_match ? serialBadge(x) : x.complete === true ? badge(tr('complete'), 'ok') : x.complete === false ? badge(x.contents_required ? trf('incomplete {p}/{r}', { p: x.contents_present, r: x.contents_required }) : tr('incomplete'), 'warn') : '';

// Collection › Definitive: one row per game with its ports, remakes, remasters, editions and
// the collections that hold it, led by its definitive version (or, toggled, its base game).
const RELATIONS = ['port', 'remaster', 'remake', 'edition', 'expansion', 'standalone', 'dlc', 'mod', 'bundle'];
// A version note's text in the UI language, else English.
function noteText(note, field) { const t = (note && note[field]) || {}; return t[uiLanguage] || t.en || ''; }
function rankBadge(rank) {
  const tip = { S: tr('S: the older version is strongly recommended'), A: tr('A: which version is better depends on preference') }[rank] || tr('B: an older version has content the latest lacks; the latest is still the better one');
  return `<span class="badge ${{ S: 'bad', A: 'warn' }[rank] || 'dim'}" title="${esc(tip)}">${esc(trf('note {rank}', { rank }))}</span>`;
}
function platformsHtml(v) { return (v || '').split(', ').filter(Boolean).map(p => cbadge('platform', p)).join(' '); }
async function showDefinitive() {
  view.innerHTML = '<div id="grid"></div>';
  const same = r => r.lead.title_id === r.other.title_id;
  const sideLink = s => `<span class="link" onclick="event.stopPropagation(); go('collection/titles/${s.title_id}')">${esc(s.name)}</span>`;
  makeGrid(document.getElementById('grid'), {
    gridKey: 'definitive', explain: ['explain.collection.definitive', 'explain.definitive.notes', 'explain.list.ownership'],
    modes: [['list', tr('list')], ['grid', tr('grid')], ['dual', tr('two-cover grid')]],
    columns: [
      { key: 'lead', label: tr('title'), sort: 'name', render: r => sideLink(r.lead) },
      { key: 'lead_platforms', label: tr('platform'), render: r => platformsHtml(r.lead.platforms) },
      { key: 'other', label: tr('base game / definitive version'), render: r => same(r) ? `<span class="muted">${tr('(the same)')}</span>` : sideLink(r.other) },
      { key: 'other_platforms', label: tr('its platform'), render: r => same(r) ? '' : platformsHtml(r.other.platforms) },
      { key: 'members', label: tr('versions'), sort: 'members', cls: 'num' },
      { key: 'note_rank', label: tr('note'), render: r => r.note_rank ? rankBadge(r.note_rank) : '' },
    ],
    filters: [
      { key: 'lead', label: tr('show'), type: 'select', options: () => `<option value="">${tr('definitive version')}</option><option value="base">${tr('base game')}</option>` },
      { key: 'noted', label: tr('version note'), type: 'select', options: () => `<option value="">${tr('no filter')}</option><option value="S">${tr('rank S')}</option><option value="A">${tr('rank A and above')}</option><option value="B">${tr('rank B and above')}</option>` },
      platformFilter(),
    ].concat(displayFilters()),
    fetch: st => api('/api/v1/catalog/definitive' + qs(Object.assign({ search: st.search, sort: st.sort, desc: st.desc, limit: st.limit, offset: st.offset, platforms: st.filters.platform, lead: st.filters.lead, noted: st.filters.noted }, Object.fromEntries(DISPLAY_KEYS.filter(k => st.filters[k]).map(k => [k, st.filters[k]]))))),
    rowLink: r => 'collection/definitive/' + r.id,
    isLocal: r => r.local_games > 0 ? 'local' : '',
    // Into a set as the game's definitive version: copy_definitive decides which release.
    context: async (r, sel) => [{ label: sel && sel.length > 1 ? trf('{n} selected games', { n: sel.length }) : r.lead.name, head: true }].concat(await setMenuItems({ family_ids: sel || [r.id] })),
    selection: { key: r => r.id, actions: [{ label: tr('add to set'), run: async (ids, done) => { await pickSet({ family_ids: ids }, done); } }] },

// A search box that picks one title (onPick(id, name)).
function titlePickInput(onPick) {
  const wrap = el(`<span class="combo"><input type="text" placeholder="${tr('base game…')}"><div class="drop" style="display:none"></div></span>`);
  const inp = wrap.querySelector('input'), drop = wrap.querySelector('.drop');
  let timer = null;
  inp.oninput = () => {
    clearTimeout(timer);
    const q = inp.value.trim(); if (q.length < 2) { drop.style.display = 'none'; return; }
    timer = setTimeout(async () => {
      try {
        const page = await api('/api/v1/catalog/titles' + qs({ search: q, limit: 15, view: 'collection' }));
        drop.innerHTML = page.items.map(t => `<div class="opt" data-id="${t.id}" data-l="${esc(t.display_name || t.name)}">${esc(t.display_name || t.name)} <span class="muted">${esc(t.platforms || '')} · ${esc(t.category)}</span></div>`).join('') || `<div class="muted">${tr('no titles')}</div>`;
        for (const d of drop.querySelectorAll('.opt')) d.onmousedown = e => { e.preventDefault(); inp.value = ''; drop.style.display = 'none'; onPick(Number(d.dataset.id), d.dataset.l); };
        drop.style.display = '';
      } catch (e) { toast(e.message, true); }
    }, 300);
  };
  inp.onblur = () => setTimeout(() => { drop.style.display = 'none'; }, 150);
  return wrap;
}
// The title page's base game editor: what this title is of which game. fixedBase: opened from
// the base game's page ("add port / remake…"), where the title is picked instead.
function editBasegameDialog(titleId, category, bases, fixedBase, after) {
  const picking = !!fixedBase;
  let target = titleId ? { id: titleId } : null;
  let rel = !category || category === 'base_game' ? 'port' : category;
  let picked = picking ? [fixedBase] : bases.slice();
  const box = openModal(`<h2>${picking ? tr('Add port / remake') : tr('Base game')}</h2><p class="muted">${tr('Saved as your own: IGDB updates leave it alone until you reset it.')}</p>
    <div class="kv">${picking ? `<div>${tr('title')}</div><div id="bg-target"></div>` : ''}<div>${tr('is a')}</div><div><select id="bg-rel">${RELATIONS.map(r => `<option value="${r}" ${r === rel ? 'selected' : ''}>${esc(t('relation.' + r, r))}</option>`).join('')}</select></div><div id="bg-of-label"></div><div id="bg-bases"></div></div>
    <div class="toolbar"><button class="btn" id="bg-save">${tr('save')}</button>${!picking && titleId ? ` <button class="btn" id="bg-none" title="${tr('no base game: this title is a game of its own')}">${tr('no base game')}</button>` : ''} <button class="btn" id="bg-cancel">${tr('cancel')}</button></div>`);
  const renderTarget = () => {
    const z = box.querySelector('#bg-target'); if (!z) return;
    z.innerHTML = target ? `<span class="badge">${esc(target.name)} <b>×</b></span> ` : '';
    const x = z.querySelector('b'); if (x) x.onclick = () => { target = null; renderTarget(); };
    z.appendChild(titlePickInput((id, name) => { target = { id, name }; renderTarget(); }));
  };
  const renderBases = () => {
    const bundle = rel === 'bundle';
    box.querySelector('#bg-of-label').textContent = bundle ? tr('games it holds') : tr('of');
    const z = box.querySelector('#bg-bases');
    z.innerHTML = picked.map((b, i) => `<span class="badge">${esc(b.name)} ${picking ? '' : `<b data-i="${i}" title="${tr('remove')}">×</b>`}</span> `).join('');
    for (const x of z.querySelectorAll('[data-i]')) x.onclick = () => { picked.splice(Number(x.dataset.i), 1); renderBases(); };
    if (!picking && (bundle || !picked.length)) z.appendChild(titlePickInput((id, name) => { if (!bundle) picked = []; if (!picked.some(b => b.id === id)) picked.push({ id, name }); renderBases(); }));
  };
  renderTarget(); renderBases();
  box.querySelector('#bg-rel').onchange = e => { rel = e.target.value; renderBases(); };
  box.querySelector('#bg-cancel').onclick = closeModal;
  const send = async (cat, ids) => {
    if (!target) { toast(tr('pick the title'), true); return; }
    try { await api('/api/v1/catalog/titles/' + target.id + '/basegame', { method: 'POST', body: { category: cat, base_title_ids: ids } }); closeModal(); after(); } catch (e) { toast(e.message, true); }
  };
  box.querySelector('#bg-save').onclick = () => send(rel, picked.map(b => b.id));
  const none = box.querySelector('#bg-none'); if (none) none.onclick = () => send('base_game', []);
}

// A set's size on disk: one local copy of each release (the one a copy takes), at its files'

function serverSize(s) { if (s.server_size === null || s.server_size === undefined) return ''; return `<span title="${esc(s.server_size_unknown ? trf('{n} release(s) the server does not have are not counted', { n: s.server_size_unknown }) : tr('one copy per release, the one a copy takes, at its real size'))}">${s.server_size_unknown ? '≥ ' : ''}${fmtSizeFine(s.server_size)}</span>`; }
function setSize(s) { return (s.size_unknown ? `<span title="${esc(trf('{n} release(s) not held here are not counted', { n: s.size_unknown }))}">≥ ` : '') + fmtSizeFine(s.total_size || 0) + (s.size_unknown ? '</span>' : ''); }
// Saves the sets `ids` (every set when empty) as a sets file.
async function exportSetsFile(ids) {
  try {
    const res = await fetch('/api/v1/sets/export' + qs({ ids: (ids || []).join(',') }), { headers: token ? { Authorization: 'Bearer ' + token } : {} });
    if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0, 200));
    const text = await res.text();
    let day = 'export'; try { day = (JSON.parse(text).exported_at || '').slice(0, 10) || day; } catch (e) {}
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = `romexplorer-sets-${day}.json`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  } catch (e) { toast(e.message, true); }
}
// Sets as a file: every set exported, or a file's sets brought in -- into the set of the same

function setsFileCard(host, after) {
  host.innerHTML = `<h2>${tr('Sets file')}</h2><p class="muted">${tr("Every set as one JSON file, its entries named so another catalogue finds them again: a release by its DAT name, platform and content, a title by its IGDB game, top release and name, a game by its IGDB game. For a server started clean, or another machine. Importing adds each set's entries, in order, to the set of the same name (made when there is none) and lists what it could not find; it never removes.")}</p>
    <div class="toolbar"><button class="btn primary" id="sf-export">${tr('export all sets')}</button><span class="grow"></span><input type="file" id="sf-file" accept=".json,application/json"><button class="btn" id="sf-read">${tr('import sets…')}</button></div><div id="sf-box"></div>`;
  const box = host.querySelector('#sf-box');
  host.querySelector('#sf-export').onclick = () => exportSetsFile([]);
  host.querySelector('#sf-read').onclick = async () => {
    const file = host.querySelector('#sf-file').files[0];
    if (!file) return toast(tr('choose a file'), true);
    let doc; try { doc = JSON.parse(await file.text()); } catch (e) { return toast(tr('That file is not JSON.'), true); }
    if (!doc || doc.format !== 'romexplorer-sets') return toast(tr('That is not a romexplorer sets file.'), true);
    box.innerHTML = `<p>${trf('{name}: exported {date} by romexplorer {version}. Bring in:', { name: esc(file.name), date: esc(doc.exported_at || '?'), version: esc(doc.app_version || '?') })}</p>
      <div class="toolbar">${doc.sets.map((x, i) => `<label><input type="checkbox" data-sf="${i}" checked> ${esc(x.name)} <span class="muted">(${x.entries.length})</span></label>`).join('')}<span class="grow"></span><button class="btn primary" id="sf-go">${tr('import')}</button></div>`;
    box.querySelector('#sf-go').onclick = async () => {
      const names = [...box.querySelectorAll('[data-sf]')].filter(c => c.checked).map(c => doc.sets[Number(c.dataset.sf)].name);
      if (!names.length) return toast(tr('tick at least one set'), true);
      try {
        const r = await api('/api/v1/sets/import', { method: 'POST', body: { file: doc, names } });
        const missing = r.flatMap(x => x.missing.map(m => `<tr><td>${esc(x.name)}</td><td>${esc(m.kind)}</td><td class="mono">${esc(m.name)}</td><td class="bad">${esc(m.reason)}</td></tr>`));
        box.innerHTML = `<table class="grid"><thead><tr><th>${trc('sets', 'set')}</th><th class="num">${tr('added')}</th><th class="num">${tr('already there')}</th><th class="num">${tr('not found')}</th></tr></thead><tbody>${r.map(x => `<tr><td>${esc(x.name)}${x.created ? ' ' + badge(tr('new'), 'ok') : ''}</td><td class="num">${x.added}</td><td class="num">${x.already}</td><td class="num">${x.missing.length}</td></tr>`).join('')}</tbody></table>
          ${missing.length ? `<table class="grid"><thead><tr><th>${trc('sets', 'set')}</th><th>${tr('kind')}</th><th>${tr('not found')}</th><th>${tr('why')}</th></tr></thead><tbody>${missing.join('')}</tbody></table>` : ''}`;
        toast(tr('sets imported'));
        // The list behind: its rows and counts, the result kept on screen.
        const kept = box.innerHTML;
        await after();
        const again = document.querySelector('#sets-file #sf-box'); if (again) again.innerHTML = kept;
      } catch (err) { toast(err.message, true); }
    };
  };
}

function setHeader(s) {
  return `<h2>${esc(s.name)} <span class="muted">${trf('{n} release(s), {local} held locally', { n: s.release_count, local: s.local_releases })}</span></h2><div class="muted">${esc(s.description || '')}</div>
      <div class="toolbar" style="margin-top:6px">${badge(trf('{n} title(s)', { n: s.title_count }), 'dim')}${badge(trf('{n} release(s)', { n: s.release_count }), 'dim')}${badge(trf('{n} platform(s)', { n: s.platform_count }), 'dim')}<span class="badge dim">${tr('size on disk')} ${setSize(s)}</span>${s.server_size !== null && s.server_size !== undefined ? `<span class="badge dim">${tr('size on server')} ${serverSize(s)}</span>` : ''}<span class="badge dim" title="${esc(RAW_NOTE())}">${tr('catalogue size (raw)')} ${fmtSizeFine(s.catalog_size || 0)}</span></div>`;
}

async function showSet(id) {
  const s = await api('/api/v1/sets/' + id);
  const rowsById = new Map();
  view.innerHTML = `<div class="crumbs"><a onclick="go('collection/sets')">${tr('Sets')}</a> › ${esc(s.name)}</div>
    <div class="card"><div id="set-head">${setHeader(s)}</div>
      <div class="toolbar" style="margin-top:6px"><button class="btn small" id="set-copy">${tr('copy to…')}</button> <button class="btn small" id="set-art">${tr('download art…')}</button> <button class="btn small" id="set-export">${tr('export art…')}</button></div></div>
    <div class="card"><div id="grid"></div></div>`;
  document.getElementById('set-copy').onclick = () => copyDialog(copySelection('sets', [Number(id)]), s.name);
  document.getElementById('set-art').onclick = () => artDialog(artSelection('sets', [id]), s.name);
  document.getElementById('set-export').onclick = () => exportArtDialog(artSelection('sets', [id]), s.name);
  const refreshHead = async () => {
    setsCache = null;
    try { const fresh = await api('/api/v1/sets/' + id); const head = document.getElementById('set-head'); if (head) head.innerHTML = setHeader(fresh); } catch (e) { toast(e.message, true); }
  };
  let showTypes = false;
  const cols = [{ key: 'set_position', label: '#', sort: 'position', cls: 'num', render: r => `${r.set_position ?? ''} <button class="btn small" data-up="${r.id}">▲</button><button class="btn small" data-down="${r.id}">▼</button>` },
    // What put the row in the set: D definitive version, C cross-platform game, T title, R release.
    { key: 'set_via', label: tr('type'), render: entryTypeBadge }].concat(releaseColumns());
  const grid = makeGrid(document.getElementById('grid'), {
    gridKey: 'set_' + id, columns: cols, pageSize: 500,
    // The Releases tab's filters, so part of a set can be picked out (and removed at once).
    // No kinds default: a set holds what was put in it, hacks included.
    filters: [platformFilter(), viewFilter(), kindsFilter(), { key: 'source', label: tr('source'), type: 'select', options: () => `<option value="">${tr('all sources')}</option>` + (vocab ? vocab.jobs.dat_sources.map(s => `<option>${esc(s)}</option>`).join('') : '') }].concat(facetFilters()).concat([
      // The grid's D/C/T/R badge sits on the cover, so it is shown on request.
      { key: 'type_badges', label: tr('entry type on covers'), type: 'check' }]),
    fetch: st => (showTypes = !!st.filters.type_badges && st.filters.type_badges !== 'false', api('/api/v1/sets/' + id + '/releases' + qs(Object.assign({ search: st.search, sort: st.sort, desc: st.desc, limit: st.limit, offset: st.offset, platforms: st.filters.platform, kinds: st.filters.kinds, view: st.filters.view, source: st.filters.source }, facetParams(st)))).then(page => { for (const r of page.items || []) rowsById.set(r.id, r); return page; })),
    selection: { key: r => r.id, actions: [{ label: tr('remove from this set'), run: async (ids, done) => {
      if (!confirm(trf('Remove {n} release(s) from this set? (the releases themselves are untouched)', { n: ids.length }))) return;
      try { const r = await api('/api/v1/sets/' + id + '/remove', { method: 'POST', body: { release_ids: ids } }); toast(trf('{n} release(s) removed from the set', { n: r.removed })); done(); refreshHead(); } catch (err) { toast(err.message, true); }
    } }, { label: tr('add to set'), run: async (ids, done) => { await pickSet(setRowsBody(ids.map(i => rowsById.get(i)).filter(Boolean)), done); } }, copySelAction('releases'), ...artSelActions('releases'), displaySelAction()] },
    rowLink: r => 'collection/releases/' + r.id,
    isLocal: heldClass,
    context: (r, sel) => releaseContext(r.id, r.name, { ids: sel, inSet: Number(id), body: setRowsBody((sel || [r.id]).map(i => rowsById.get(i)).filter(Boolean)), after: () => { grid.reload(); refreshHead(); } }),
    gridCard: (r, mode) => { const c = releaseCard(r, mode); if (showTypes) c.chips = entryTypeEmblem(r) + c.chips; return c; },
  });
  document.getElementById('grid').addEventListener('click', async (e) => {
    const up = e.target.closest('[data-up]'), down = e.target.closest('[data-down]');
    if (!up && !down) return;
    e.stopPropagation();
    // Only this page is known here, so the two rows swap and the rest of the set stays put.
    const ids = grid.state.items.map(r => r.id); const rid = Number((up || down).dataset[up ? 'up' : 'down']); const i = ids.indexOf(rid);
    const j = up ? i - 1 : i + 1; if (j < 0 || j >= ids.length) return;
    try { await api('/api/v1/sets/' + id + '/reorder', { method: 'POST', body: { swap: [ids[i], ids[j]] } }); grid.reload(); } catch (err) { toast(err.message, true); }
  });
}

      <div class="toolbar"><select id="emu-preset"><option value="">${tr('add from preset…')}</option>${presets.map(x => `<option value="${x.key}">${esc(x.name)}</option>`).join('')}</select><button class="btn small" id="emu-custom">${tr('add custom')}</button></div></div>

  const edit = e => emulatorDialog(e, () => showEmulators());
  document.getElementById('emu-preset').onchange = ev => {
    const x = presets.find(p => p.key === ev.target.value); if (!x) return;
    edit({ id: 0, name: x.name, preset: x.key, kind: x.kind, path: '', args: x.args, cores_dir: null, working_dir: null, supports_archives: x.supports_archives, supports_playlists: x.supports_playlists, enabled: true, artwork: x.artwork || null, platforms: x.platforms.map(([id, core]) => ({ app_platform_id: id, core, is_default: !list.some(o => o.platforms.some(p => p.app_platform_id === id && p.is_default)) })) });
  };
  document.getElementById('emu-custom').onclick = () => edit({ id: 0, name: '', preset: null, kind: 'standalone', path: '', args: '{rom}', cores_dir: null, working_dir: null, supports_archives: false, supports_playlists: true, enabled: true, platforms: [] });
  for (const b of view.querySelectorAll('[data-edit]')) b.onclick = () => edit(list.find(e => String(e.id) === b.dataset.edit));
  for (const b of view.querySelectorAll('[data-del]')) b.onclick = async () => { if (!confirm(tr('Delete this emulator? (Only the setting; the program itself is untouched.)'))) return; try { await api('/api/v1/emulators/' + b.dataset.del, { method: 'DELETE' }); showEmulators(); } catch (e) { toast(e.message, true); } };
}

      <div>${tr('working folder')}</div><div><input name="working_dir" value="${esc(e.working_dir || '')}" style="width:100%" placeholder="${tr("default: the emulator's folder")}"></div>

        <div class="art-only" style="margin-top:4px"><input name="art_dir" value="${esc((e.artwork || {}).dir || '')}" style="width:100%"> ${caps.native ? `<button class="btn small" type="button" id="art-browse">${tr('browse…')}</button>` : ''}</div>
        <div class="art-only" style="margin-top:4px">${tr('formats it reads: ')}${['png', 'jpg', 'webp'].map(x => `<label><input type="checkbox" data-fmt="${x}" ${((e.artwork || {}).formats || []).includes(x) ? 'checked' : ''}> ${x}</label>`).join(' ')}
          <div class="muted art-ra">${tr("JPG and WebP only work with RetroArch's Settings › Playlists › \"Allow non-PNG thumbnails\" on (1.20+); without it, leave PNG alone.")}</div>
          <div class="muted">${tr('A picture already in a ticked format is copied as it is; anything else is converted to the first ticked one this build can write (PNG, JPG).')}</div></div>
        <div class="art-only" style="margin-top:4px">${tr('max width ')}<input name="art_width" size="6" value="${(e.artwork || {}).max_width || ''}" placeholder="${tr('none')}"><span class="muted">${tr(' px; wider pictures are scaled down, never up')}</span></div>
        <div class="art-only" style="margin-top:4px"><label><input type="checkbox" name="art_after" ${(e.artwork || {}).after_copy ? 'checked' : ''}>${tr(' tick \"export artwork\" in the copy dialog for this emulator')}</label></div>

  const f = box.querySelector('#emu-form');
  f.kind.value = e.kind;
  // Formats kept in the order ticked: the first a picture is converted to.
  let artFormats = ((e.artwork || {}).formats || []).slice();
  f.art_layout.value = (e.artwork || {}).layout || '';
  const syncArt = () => {
    const layout = f.art_layout.value;
    for (const x of box.querySelectorAll('.art-only')) x.style.display = layout ? '' : 'none';

  };
  f.art_layout.onchange = () => {
    // A layout picked for the first time starts from what that emulator reads.
    if (!artFormats.length) {
      artFormats = f.art_layout.value === 'retroarch' ? ['png'] : ['jpg', 'png', 'webp'];
      for (const x of box.querySelectorAll('[data-fmt]')) x.checked = artFormats.includes(x.dataset.fmt);
      if (f.art_layout.value === 'retroarch' && !f.art_width.value) f.art_width.value = '512';
    }
    syncArt();
  };
  for (const x of box.querySelectorAll('[data-fmt]')) x.onchange = () => { artFormats = artFormats.filter(y => y !== x.dataset.fmt); if (x.checked) artFormats.push(x.dataset.fmt); };

  const renderPlats = () => {
    const t = box.querySelector('#emu-plats');
    t.innerHTML = `<tr><th>${tr('platform')}</th><th class="ra-core">${tr('core')}</th><th>${tr('default')}</th><th></th></tr>` + rows.map((p, i) => `<tr><td>${esc(((vocab.platforms || []).find(x => x.id === p.app_platform_id) || {}).name || p.app_platform_id)}</td><td class="ra-core"><input data-core="${i}" value="${esc(p.core || '')}" size="16"></td><td><input type="checkbox" data-def="${i}" ${p.is_default ? 'checked' : ''}></td><td><span class="link" data-rm="${i}">✕</span></td></tr>`).join('');
    for (const x of t.querySelectorAll('.ra-core')) x.style.display = f.kind.value === 'retroarch' ? '' : 'none';
    for (const x of t.querySelectorAll('[data-core]')) x.oninput = () => { rows[Number(x.dataset.core)].core = x.value; };
    for (const x of t.querySelectorAll('[data-def]')) x.onchange = () => { rows[Number(x.dataset.def)].is_default = x.checked; };
    for (const x of t.querySelectorAll('[data-rm]')) x.onclick = () => { rows.splice(Number(x.dataset.rm), 1); renderPlats(); };
  };
  f.kind.addEventListener('change', renderPlats); renderPlats();
  box.querySelector('#emu-addplat').onchange = ev => { const id = Number(ev.target.value); if (id && !rows.some(r => r.app_platform_id === id)) { rows.push({ app_platform_id: id, core: null, is_default: false }); renderPlats(); } ev.target.value = ''; };
  const browse = box.querySelector('#emu-browse');
  if (browse) browse.onclick = async () => { try { const r = await api('/api/v1/fs/pick', { method: 'POST', body: { file: true, start: f.path.value || null } }); if (r.path) f.path.value = r.path; } catch (err) { toast(err.message, true); } };
  box.querySelector('#emu-cancel').onclick = closeModal;
  f.onsubmit = async ev => {
    ev.preventDefault();
    const body = { id: e.id || 0, name: f.name.value.trim(), preset: e.preset, kind: f.kind.value, path: f.path.value.trim(), args: f.args.value.trim() || '{rom}', cores_dir: f.cores_dir.value.trim() || null, working_dir: f.working_dir.value.trim() || null, supports_archives: f.supports_archives.checked, supports_playlists: f.supports_playlists.checked, enabled: f.enabled.checked, platforms: rows,
      artwork: f.art_layout.value ? { dir: f.art_dir.value.trim(), layout: f.art_layout.value, formats: artFormats, max_width: Number(f.art_width.value) > 0 ? Math.trunc(Number(f.art_width.value)) : null, after_copy: f.art_after.checked } : null };
    try { await api('/api/v1/emulators', { method: 'POST', body }); toast(tr('saved')); closeModal(); done(); } catch (err) { toast(err.message, true); }
  };
}

async function showDirectories() {
  const dirs = await api('/api/v1/directories');
  const byId = new Map(dirs.map(d => [d.id, d]));
  const roots = dirs.filter(d => d.is_collection_root).sort((a, b) => a.path.localeCompare(b.path));
  // Tree order: each root, then everything configured below it (parents come from the
  // path, server-side), indented by depth.
  const depth = d => { let n = 0, p = d.parent_directory_id; while (p && byId.has(p) && n < 64) { n++; p = byId.get(p).parent_directory_id; } return n; };
  // The server lists them in tree order, siblings by priority (▲▼): the order a release's
  // local copies follow.
  const ordered = dirs;
  const orphans = [];
  const noRoot = roots.length === 0;
  view.innerHTML = `
    <div class="card"><h2>${tr('Add / edit directory')}</h2>
      <p class="muted">${noRoot
        ? tr('Add a <b>collection root</b> first — every other directory is configured inside one.')
        : tr('Collection roots hold your sets (any number, e.g. redump and no-intro apart, but never one inside another). Other directories go inside a root, to override its type/platform/archival; their parent follows from the path.')}</p>
      <form class="inline" id="dirform"><input type="hidden" name="id">
        <label>${tr('path')}<input type="text" name="path" required style="min-width:360px" placeholder="${noRoot ? tr('collection root folder') : tr('a folder inside a collection root')}" data-browse></label>
        <label>${tr('type')}<select name="dir_type"><option value="">${tr('inherit')}</option>${vocab.dir_types.map(t => `<option>${t}</option>`).join('')}</select></label>
        <label>${tr('platform')}<select name="app_platform_id">${platformOptions('', tr('inherit'))}</select></label>
        <label><span>${tr('collection root')}</span><input type="checkbox" name="is_collection_root" ${noRoot ? `checked disabled title="${tr('the first directory has to be a collection root')}"` : ''}></label>
        <label><span>${tr('archival')}</span><input type="checkbox" name="is_archival"></label>
        <button class="btn primary">${tr('save')}</button><button class="btn" type="button" id="dirreset">${tr('clear')}</button>
      </form></div>
    <div class="card"><h2>${trf('Configured directories ({n})', { n: dirs.length })}</h2><table class="grid"><thead><tr><th>${tr('path')}</th><th>${tr('type')}</th><th>${tr('platform')}</th><th>${tr('archival')}</th><th>${tr('parent')}</th><th>${tr('files')}</th><th>${tr('on disk')}</th><th></th></tr></thead><tbody>
      ${[...ordered, ...orphans].map(d => `<tr><td class="mono" style="padding-left:${8 + depth(d) * 18}px">${d.is_collection_root ? badge(tr('root'), 'ok') + ' ' : '└ '}${esc(d.path)}</td><td>${esc(d.dir_type || '')} ${!d.dir_type && d.effective_dir_type ? badge('→ ' + d.effective_dir_type, 'dim') : ''}</td><td>${cbadge('platform', d.platform_name)} ${!d.app_platform_id && d.effective_platform_name ? badge('→ ' + d.effective_platform_name, 'dim') : ''}</td><td>${d.is_archival ? badge(tr('archival'), 'warn') : ''}</td><td class="mono muted">${d.parent_directory_id && byId.has(d.parent_directory_id) ? esc(byId.get(d.parent_directory_id).path) : ''}</td><td class="num">${d.file_count}</td><td>${d.exists_on_disk ? badge(tr('yes'), 'ok') : badge(tr('missing'), 'bad')}</td><td><button class="btn small" data-dup="${d.id}" title="${tr('higher priority among its siblings')}">▲</button><button class="btn small" data-ddn="${d.id}" title="${tr('lower priority among its siblings')}">▼</button> <button class="btn small" data-edit="${d.id}">${tr('edit')}</button> <button class="btn small danger" data-del="${d.id}">${tr('remove')}</button></td></tr>`).join('') || `<tr><td colspan="8" class="muted">${tr('none yet — add a collection root above, then scan it from Jobs')}</td></tr>`}
    </tbody></table></div>`;
  const form = document.getElementById('dirform');
  // An empty path field starts the folder picker in the (first) collection root when adding
  // a subdirectory.
  form.path.browseStart = () => (!form.is_collection_root.checked && roots[0]) ? roots[0].path : '';
  attachBrowse(view);
  document.getElementById('dirreset').onclick = () => { form.reset(); if (noRoot) form.is_collection_root.checked = true; };
  form.onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(form);
    const spec = { path: f.get('path'), dir_type: f.get('dir_type') || null, app_platform_id: f.get('app_platform_id') ? Number(f.get('app_platform_id')) : null, is_collection_root: form.is_collection_root.checked, is_archival: !!f.get('is_archival') };
    try { const id = f.get('id'); await api(id ? '/api/v1/directories/' + id : '/api/v1/directories', { method: id ? 'PUT' : 'POST', body: spec }); toast(tr('saved')); showDirectories(); } catch (err) { toast(err.message, true); }

// Removing a directory's configuration. With configured subdirectories below it: a warning
// listing them, "delete", then an "are you sure?", then a recursive removal. Only
// romexplorer's configuration rows go -- folders and files on disk are never touched.
async function removeDirectory(d) {
  const DISK_NOTE = tr("Only romexplorer's configuration is removed — folders and files on disk are never touched.");
  const removedMsg = n => n === 1 ? tr('removed 1 directory configuration') : trf('removed {n} directory configurations', { n });
  const run = async (recursive) => {
    try { const r = await api('/api/v1/directories/' + d.id + (recursive ? '?recursive=true' : ''), { method: 'DELETE' }); toast(removedMsg(r.removed.length)); closeModal(); showDirectories(); }
    catch (err) { toast(err.message, true); }
  };
  if (!d.descendants.length) {
    if (!confirm(trf('Remove the configuration for {path}?', { path: d.path }) + `\n\n${DISK_NOTE}`)) return;
    try { const r = await api('/api/v1/directories/' + d.id, { method: 'DELETE' }); toast(removedMsg(r.removed.length)); showDirectories(); }
    catch (err) {
      // A subdirectory was configured since this list loaded (another tab/client): re-read
      // the row and go through the recursive warning instead of just failing.
      if (!err.message.startsWith('conflict')) return toast(err.message, true);
      try { const fresh = await api('/api/v1/directories/' + d.id); if (fresh.descendants.length) return removeDirectory(fresh); } catch (e) {}
      toast(err.message, true);
    }
    return;
  }
  const n = d.descendants.length;
  const box = openModal(`<h2>${d.is_collection_root ? tr('Remove collection root and its subdirectories?') : tr('Remove directory and its subdirectories?')}</h2>
    <p>${n === 1 ? trf('Removing <span class="mono">{path}</span> also removes the configuration of <b>1</b> subdirectory below it:', { path: esc(d.path) }) : trf('Removing <span class="mono">{path}</span> also removes the configuration of <b>{n}</b> subdirectories below it:', { path: esc(d.path), n })}</p>
    <ul class="mono" style="max-height:40vh; overflow:auto; margin:6px 0 10px">${d.descendants.map(x => `<li>${esc(x.path)}</li>`).join('')}</ul>
    <p class="muted">${esc(DISK_NOTE)}</p>
    <div class="fsfoot"><span class="grow"></span><button type="button" class="btn" data-id="cancel">${tr('cancel')}</button><button type="button" class="btn danger" data-id="delete">${tr('delete')}</button></div>`);
  box.querySelector('[data-id="cancel"]').onclick = closeModal;
  box.querySelector('[data-id="delete"]').onclick = () => {
    if (confirm(trf('Are you sure? This removes {n} directory configurations.', { n: n + 1 }) + `\n\n${DISK_NOTE}`)) run(true);
  };
}

function hslToHex(str) {
  const m = String(str).match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/); if (!m) return /^#[0-9a-f]{6}$/i.test(str) ? str : '#888888';
  const h = Number(m[1]) / 360, sat = Number(m[2]) / 100, l = Number(m[3]) / 100;
  const f = n => { const k = (n + h * 12) % 12; const a = sat * Math.min(l, 1 - l); const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}
function defaultColorOf(kind, value) { const saved = uiColors; uiColors = {}; const c = colorOf(kind, value); uiColors = saved; return c; }
// Drag-orderable list. items: string[]; label(item) -> html; onChange(newOrder)
function orderList(items, label, onChange, removable) {
  const ul = el('<ul class="olist"></ul>');
  let order = items.slice();
  function render() {
    ul.innerHTML = '';
    order.forEach((it, i) => {
      const li = el(`<li draggable="true"><span class="grip">⋮⋮</span><span class="lab">${label(it)}</span><span class="spacer"></span><button class="btn small" data-up>▲</button><button class="btn small" data-down>▼</button>${removable ? '<button class="btn small danger" data-x>×</button>' : ''}</li>`);
      li.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', String(i)); li.classList.add('drag'); });
      li.addEventListener('dragend', () => li.classList.remove('drag'));
      li.addEventListener('dragover', e => { e.preventDefault(); li.classList.add('over'); });
      li.addEventListener('dragleave', () => li.classList.remove('over'));
      li.addEventListener('drop', e => { e.preventDefault(); li.classList.remove('over'); const from = Number(e.dataTransfer.getData('text/plain')); if (Number.isNaN(from) || from === i) return; const [m] = order.splice(from, 1); order.splice(i, 0, m); render(); onChange(order); });
      li.querySelector('[data-up]').onclick = () => { if (i === 0) return; [order[i - 1], order[i]] = [order[i], order[i - 1]]; render(); onChange(order); };
      li.querySelector('[data-down]').onclick = () => { if (i === order.length - 1) return; [order[i + 1], order[i]] = [order[i], order[i + 1]]; render(); onChange(order); };
      if (removable) li.querySelector('[data-x]').onclick = () => { order.splice(i, 1); render(); onChange(order); };
      ul.appendChild(li);
    });
    if (!order.length) ul.innerHTML = `<li class="muted">${tr('empty')}</li>`;
  }
  render();
  return { el: ul, set(v) { order = v.slice(); render(); }, get: () => order.slice() };
}

// Wires a platformPickerHtml block inside `root`; `onChange` runs after any change.
function wirePlatformPicker(root, name, onChange) {
  const checks = () => [...root.querySelectorAll(`input[name="${name}"]`)];
  const offered = c => !c.closest('label').hidden;
  const shown = c => offered(c) && c.closest('label').style.display !== 'none';
  const recount = () => { const n = checks().filter(c => c.checked).length; const out = root.querySelector('[data-pcount]'); if (out) out.textContent = n ? trf('{n} checked', { n }) : ''; };
  const changed = () => { recount(); if (onChange) onChange(); };
  root.querySelector('[data-pgrid]').onchange = changed;
  const filter = root.querySelector('[data-pfilter]');
  filter.onkeydown = e => { if (e.key === 'Enter') e.preventDefault(); };
  filter.oninput = () => { const q = filter.value.trim().toLowerCase(); for (const l of root.querySelectorAll('[data-pgrid] label')) l.style.display = !q || l.dataset.name.includes(q) ? '' : 'none'; };
  for (const b of root.querySelectorAll('[data-pcheck]')) b.onclick = () => { for (const c of checks()) if (b.dataset.pcheck === '0' || shown(c)) c.checked = b.dataset.pcheck === '1'; changed(); };
  const toggle = match => { const set = checks().filter(c => offered(c) && match(c.closest('label'))); const on = !set.every(c => c.checked); for (const c of set) c.checked = on; changed(); };
  for (const b of root.querySelectorAll('[data-pfamily]')) b.onclick = () => toggle(l => l.dataset.family === b.dataset.pfamily && l.dataset.kind !== 'arcade');
  for (const b of root.querySelectorAll('[data-pgroup]')) b.onclick = () => toggle(l => l.dataset.kind === b.dataset.pgroup);
  return { checks, recount, set(ids) { for (const c of checks()) c.checked = ids.includes(Number(c.value)); recount(); }, get: () => checks().filter(c => c.checked).map(c => Number(c.value)) };
}
