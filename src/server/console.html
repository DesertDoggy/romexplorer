<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>romexplorer console</title>
<style>
:root { --bg:#14161a; --panel:#1c1f25; --line:#2a2e36; --fg:#e6e6e6; --dim:#9aa0aa; --acc:#6ab0f3; --ok:#6fcf97; --warn:#f2c94c; --bad:#eb5757; --hover:#232730; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, "Segoe UI", Roboto, "Noto Sans", "Noto Sans CJK JP", sans-serif; }
header { display:flex; align-items:center; gap:16px; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
header h1 { font-size:16px; margin:0; font-weight:600; }
header .spacer { flex:1; }
header .meta { color:var(--dim); font-size:12px; }
header select.lang { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font:inherit; font-size:12px; cursor:pointer; }
.langpick { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 10px; }
.langpick .btn { font-size:15px; padding:8px 16px; }
nav { display:flex; flex-wrap:wrap; gap:2px; padding:6px 16px 0; background:var(--panel); border-bottom:1px solid var(--line); }
nav button:not(.info) { background:none; border:1px solid transparent; border-bottom:none; color:var(--dim); padding:6px 12px; cursor:pointer; border-radius:6px 6px 0 0; font:inherit; }
nav button.active { color:var(--fg); background:var(--bg); border-color:var(--line); }
nav button:hover { color:var(--fg); }
#subnav .subinfo .info { margin-left:6px; }
header #hdr-info .info { margin-left:6px; }
nav.sub { padding:4px 16px; background:var(--bg); border-bottom:1px solid var(--line); }
nav.sub button:not(.info) { border-radius:6px; padding:3px 10px; font-size:13px; border:1px solid transparent; }
nav.sub button.active { background:var(--panel); border-color:var(--line); }
main { padding:16px; max-width:1700px; }
.toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
/* Every text box and pulldown, wherever it sits. Styling only the ones in a toolbar or form
   left the rest with the platform's white box but the page's light text -- unreadable in the
   desktop app (WebKitGTK), merely mismatched in a browser. `color-scheme` makes the native
   parts (popup lists, spinners, arrows) dark too. */
:root { color-scheme: dark; }
select, textarea, input[type=text], input[type=number], input[type=search], input[type=password], input[type=url], input:not([type]) { background:#0f1114; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:3px 6px; font:inherit; }
select:disabled, input:disabled, textarea:disabled { opacity:.55; }
::placeholder { color:var(--dim); opacity:.8; }
.toolbar input[type=text], .toolbar select, .toolbar input[type=number], form input, form select, textarea { background:#0f1114; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:5px 8px; font:inherit; }
/* The dropdown list is rendered by the platform, not by the select's own box: it does not
   inherit that background, but it does inherit `color`. Without this the options are the
   page's light text on the platform's white popup, i.e. invisible. */
select option, select optgroup { background:#0f1114; color:var(--fg); }
.toolbar input[type=text] { min-width:240px; }
button.btn, .btn { background:#2b3441; color:var(--fg); border:1px solid #3a4658; border-radius:4px; padding:5px 10px; cursor:pointer; font:inherit; }
button.btn:hover { background:#354052; }
button.btn.primary { background:#2f5f8f; border-color:#3d76ad; }
button.btn.danger { background:#5a2b2b; border-color:#7a3a3a; }
button.btn.small { padding:2px 7px; font-size:12px; }
button.btn:disabled { opacity:.5; cursor:default; }
button.btn.on { background:#3d76ad; }
table.grid { border-collapse:collapse; width:100%; font-size:13px; }
table.grid th, table.grid td { border-bottom:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top; white-space:nowrap; max-width:520px; overflow:hidden; text-overflow:ellipsis; }
table.grid th { position:sticky; top:0; background:var(--panel); cursor:pointer; user-select:none; color:var(--dim); font-weight:600; }
table.grid th.sorted { color:var(--acc); }
table.grid tr.click { cursor:pointer; }
table.grid tr.click:hover, table.grid tr.hover:hover { background:var(--hover); }
table.grid tr.local td:first-child { box-shadow:inset 3px 0 0 var(--ok); }
table.grid tr.unsynced td:first-child { box-shadow:inset 3px 0 0 var(--warn); }
table.grid tr.remoteonly td:first-child { box-shadow:inset 3px 0 0 var(--dim); }
table.grid td.num { text-align:right; font-variant-numeric:tabular-nums; }
table.grid td.mono, .mono { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
.pager { display:flex; gap:8px; align-items:center; margin:10px 0; color:var(--dim); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; }
.card h2, .card h3 { margin:0 0 8px; font-size:15px; }
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; }
.kv { display:grid; grid-template-columns:max-content 1fr; gap:3px 14px; font-size:13px; }
.kv div:nth-child(odd) { color:var(--dim); }
.badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; background:#2b3441; color:var(--fg); margin:1px 4px 1px 0; white-space:nowrap; }
.badge.ok { background:#1f4d33; color:var(--ok); } .badge.warn { background:#4d4020; color:var(--warn); } .badge.bad { background:#4d2323; color:var(--bad); } .badge.dim { color:var(--dim); }
.pico { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:6px; font-size:10px; font-weight:700; color:#fff; margin-right:4px; vertical-align:middle; letter-spacing:.3px; }
.ico { width:16px; height:16px; vertical-align:-3px; margin-right:4px; display:inline-block; object-fit:contain; }
.pchip { display:inline-flex; align-items:center; justify-content:center; width:28px; height:22px; border-radius:5px; background:#4a4f58; border:1px solid #5a606a; margin:1px 3px 1px 0; vertical-align:middle; padding:1px; }
.pchip .ico { margin:0; width:24px; height:18px; }
.fchip { display:inline-flex; align-items:center; justify-content:center; height:20px; margin:1px 3px 1px 0; vertical-align:middle; }
.fchip .flag { margin:0; font-size:17px; line-height:1; } .fchip .ico { margin:0; width:18px; height:18px; }
.badge.fb { font-weight:600; }
svg.ico { fill:currentColor; }

.flag { margin-right:4px; font-family:"Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
.crumbs { color:var(--dim); margin-bottom:10px; } .crumbs a { color:var(--acc); cursor:pointer; text-decoration:none; }
#popover { position:fixed; z-index:20; background:#0f1114; border:1px solid #3a4658; border-radius:6px; padding:8px 10px; font-size:12px; max-width:640px; max-height:50vh; overflow:auto; display:none; box-shadow:0 6px 24px rgba(0,0,0,.5); pointer-events:none; }
#ctxmenu { position:fixed; z-index:25; background:#1c1f25; border:1px solid #3a4658; border-radius:6px; padding:4px; min-width:200px; display:none; box-shadow:0 6px 24px rgba(0,0,0,.5); font-size:13px; overflow-y:auto; }
#ctxmenu div { padding:5px 10px; cursor:pointer; border-radius:4px; } #ctxmenu div:hover { background:var(--hover); } #ctxmenu div.head { color:var(--dim); cursor:default; font-size:11px; text-transform:uppercase; } #ctxmenu div.head:hover { background:none; } #ctxmenu div.sub { padding-left:24px; }
.combo { position:relative; display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap; max-width:420px; }
.combo input { min-width:120px; }
.combo .chips .badge b { cursor:pointer; margin-left:2px; }
.combo .drop { position:absolute; top:100%; left:0; z-index:22; background:#1c1f25; border:1px solid #3a4658; border-radius:6px; min-width:260px; max-height:320px; overflow-y:auto; overflow-x:hidden; box-shadow:0 6px 24px rgba(0,0,0,.5); font-size:12px; }
.combo .drop .opt { padding:4px 8px; cursor:pointer; white-space:nowrap; } .combo .drop .opt:hover { background:#2b3441; }
/* A filter of tick boxes: a button that opens them below itself. */
details.checks { position:relative; display:inline-block; }
details.checks summary { margin:0; list-style:none; border:1px solid #3a4658; border-radius:6px; padding:3px 8px; color:var(--fg); white-space:nowrap; }
details.checks summary::-webkit-details-marker { display:none; }
details.checks .pop { position:absolute; top:100%; left:0; z-index:22; background:#1c1f25; border:1px solid #3a4658; border-radius:6px; padding:6px 10px; min-width:220px; box-shadow:0 6px 24px rgba(0,0,0,.5); font-size:12px; }
details.checks .pop label { display:block; padding:2px 0; white-space:nowrap; cursor:pointer; }
details.checks .pop .sep { border-top:1px solid #3a4658; margin:4px 0; }
.combo .drop .logic { display:block; padding:4px 8px; border-bottom:1px solid #3a4658; }
#submodal { position:fixed; inset:0; z-index:29; background:rgba(0,0,0,.4); display:none; align-items:flex-start; justify-content:center; padding:72px 16px; overflow:auto; }
#submodal .box { background:#1c1f25; border:1px solid #3a4658; border-radius:8px; padding:14px 16px; width:min(760px, 100%); box-shadow:0 8px 32px rgba(0,0,0,.6); }
#submodal .box h2 { margin-top:0; }
#modal { position:fixed; inset:0; z-index:28; background:rgba(0,0,0,.55); display:none; align-items:flex-start; justify-content:center; padding:48px 16px; overflow:auto; }
#modal .box { background:#1c1f25; border:1px solid #3a4658; border-radius:8px; padding:14px 16px; width:min(860px, 100%); box-shadow:0 8px 32px rgba(0,0,0,.6); }
#modal .box h2 { margin-top:0; }
.browse { display:flex; flex-wrap:wrap; gap:4px; align-items:center; max-width:100%; } .browse input { flex:1; }
@media (max-width:600px) { .browse input { min-width:0 !important; width:100%; } }
.fsroots { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
.fspath { display:flex; gap:6px; margin-bottom:8px; } .fspath input { flex:1; min-width:0; }
.fslist { max-height:55vh; overflow:auto; border:1px solid var(--line); border-radius:6px; background:#0f1114; }
.fslist div { display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fslist div:hover { background:var(--hover); } .fslist div.empty { cursor:default; color:var(--dim); } .fslist div.empty:hover { background:none; }
.fslist svg { flex:none; width:16px; height:16px; fill:var(--warn); }
.prog { display:flex; align-items:center; gap:6px; white-space:nowrap; } .prog.full .muted { white-space:normal; overflow-wrap:anywhere; min-width:0; }
.runfiles { display:flex; flex-direction:column; gap:4px; margin:6px 0 2px 12px; } .runfiles .fname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; } .runfiles .pbar { width:160px; } .pbar { width:90px; height:8px; background:#0f1114; border:1px solid var(--line); border-radius:4px; overflow:hidden; flex:none; } .pbar div { height:100%; background:var(--acc); }
.runsteps { display:flex; flex-direction:column; gap:3px; margin:6px 0 2px 12px; } .runsteps .step { display:flex; align-items:center; gap:6px; } .runsteps .step.pending { color:var(--dim); } .runsteps .mark { width:14px; text-align:center; flex:none; } .runsteps .step.done .mark { color:var(--ok); } .runsteps .step.running .mark { color:var(--warn); } .runsteps .slabel { flex:none; } .runsteps .note { min-width:0; overflow-wrap:anywhere; }
.stepmarks { letter-spacing:1px; flex:none; } .stepmarks .done { color:var(--ok); } .stepmarks .running { color:var(--warn); } .stepmarks .pending { color:var(--dim); } .toolbar .grow { flex:1; }
.fsfoot { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; } .fsfoot .grow { flex:1; }
.statuschips .badge { margin-right:2px; }
.gcard .art .chips { position:absolute; left:4px; bottom:4px; display:flex; gap:2px; }
.gcard .art { position:relative; }
.gcard .art .chips .badge { font-size:10px; padding:1px 5px; }
/* A set row's entry type: a word in the list, a round emblem on a cover. */
.badge.entry-type { border-left:3px solid var(--et); }
.entry-type.D, .entry-emblem.D { --et:#d4a017; } .entry-type.C, .entry-emblem.C { --et:#1aa198; } .entry-type.T, .entry-emblem.T { --et:#7b4fd6; } .entry-type.R, .entry-emblem.R { --et:#6b7a8f; }
.entry-emblem { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; align-self:flex-end; font:800 14px/1 Georgia, "Times New Roman", serif; color:#fff; text-shadow:0 1px 2px #000a; border:2px solid #fff; box-shadow:0 1px 5px #000b, inset 0 -4px 7px #0005, inset 0 3px 5px #fff6; background:radial-gradient(circle at 32% 28%, #fff9, transparent 45%), var(--et); }
.gcard .art .chips .entry-emblem ~ .badge { align-self:center; }
.lb { display:inline-block; padding:1px 8px; border-radius:4px; font-size:11px; font-weight:800; letter-spacing:.05em; line-height:16px; color:#0b0d10; white-space:nowrap; }
.lb.local { background:var(--ok); } .lb.ra { background:#e0b400; } .lb.server { background:#7fa7d9; } .lb.peer { background:#c3a3e6; } .lb.warn { background:var(--warn); }
.gcard .art .flags { position:absolute; top:4px; right:4px; display:flex; flex-direction:column; gap:3px; align-items:flex-end; }
.gcard .art .flags .lb { font-size:10px; box-shadow:0 1px 4px #000a; }
.combo .drop .opt input, .combo .drop .logic input { min-width:0; width:auto; margin:0 6px 0 0; } .combo .drop .opt input { pointer-events:none; } .combo .drop .logic { display:flex; gap:10px; padding:4px 8px; border-bottom:1px solid var(--line); }
.hero { float:right; width:120px; margin:0 0 8px 12px; border-radius:6px; border:1px solid #3a4658; }
#toast { position:fixed; right:16px; bottom:16px; z-index:30; display:flex; flex-direction:column; gap:6px; }
#toast div { background:#2b3441; border:1px solid #3a4658; padding:8px 12px; border-radius:6px; max-width:480px; }
#toast div.bad { border-color:var(--bad); }
.hash { color:var(--dim); font-size:11px; }
form.inline { display:flex; flex-wrap:wrap; gap:8px; align-items:end; }
form.inline label { display:flex; flex-direction:column; font-size:12px; color:var(--dim); gap:2px; }
.muted { color:var(--dim); }
.link { color:var(--acc); cursor:pointer; text-decoration:none; }
a.link:hover { text-decoration:underline; }
textarea { width:100%; min-height:90px; }
.media-strip { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; align-items:flex-end; }
/* The Display card's screenshot at 4:3 and at the other aspect, side by side, same width. */
.aspect-compare { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-top:10px; }
.aspect-compare figure { margin:0; text-align:center; }
.aspect-compare .ac-box { width:256px; max-width:42vw; background:#000; border:2px solid transparent; border-radius:4px; overflow:hidden; }
.aspect-compare figure.on .ac-box { border-color:var(--accent, #4a8); }
.aspect-compare .ac-box img { width:100%; height:100%; object-fit:fill; image-rendering:pixelated; display:block; }
.aspect-compare figcaption { margin-top:4px; }
.media-strip figure { margin:0; flex:0 0 auto; text-align:center; }
.media-strip img, .media-strip video { height:180px; width:auto; max-width:420px; object-fit:contain; border-radius:4px; background:#0003; display:block; }
.media-strip img { cursor:zoom-in; }
.media-strip audio { width:260px; display:block; }
.media-strip figcaption { font-size:11px; opacity:.7; margin-top:3px; }
.media-zoom { position:fixed; inset:0; z-index:1000; background:#000c; display:flex; align-items:center; justify-content:center; cursor:zoom-out; }
.media-zoom img { max-width:96vw; max-height:96vh; }
.warnbox { border-left:3px solid #d9a400; padding:4px 8px; margin:6px 0; font-size:12px; }
.olist { list-style:none; margin:6px 0; padding:0; max-width:520px; }
.olist li { display:flex; align-items:center; gap:8px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; margin-bottom:4px; background:#0f1114; cursor:grab; }
.olist li.drag { opacity:.5; } .olist li.over { border-color:var(--acc); }
.olist .grip { color:var(--dim); cursor:grab; letter-spacing:-2px; } .olist .spacer { flex:1; }
.radios { display:flex; flex-wrap:wrap; gap:14px; margin:6px 0; } .radios label { display:flex; align-items:center; gap:6px; cursor:pointer; }
details summary { cursor:pointer; margin:6px 0; color:var(--acc); }
input[type=color] { width:44px; height:26px; padding:0; border:1px solid var(--line); background:none; }

.two { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media (max-width:900px) { .two { grid-template-columns:1fr; } }
.cardgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
.gcard { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; }
.gcard:hover { border-color:#3d76ad; }
.gcard.local { box-shadow:inset 0 3px 0 var(--ok); }
.gcard.unsynced { box-shadow:inset 0 3px 0 var(--warn); }
.gcard.remoteonly { box-shadow:inset 0 3px 0 var(--dim); }
.gcard .art { aspect-ratio:3/4; background:#0f1114; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:28px; font-weight:700; overflow:hidden; }
.gcard .art img { width:100%; height:100%; object-fit:cover; }
/* Collection > Definitive's two-cover grid: both covers cropped to fill their half, so the halves meet exactly. */
.gcard .art.dual img { position:absolute; object-fit:cover; }
.gcard .art.dual.top_bottom img { left:0; width:100%; height:50%; }
.gcard .art.dual.top_bottom img.a { top:0; }
.gcard .art.dual.top_bottom img.b { top:50%; }
.gcard .art.dual.left_right img { top:0; height:100%; width:50%; }
.gcard .art.dual.left_right img.a { left:0; }
.gcard .art.dual.left_right img.b { left:50%; }
.gcard .art.dual.diagonal img { inset:0; width:100%; height:100%; }
.gcard .art.dual.diagonal img.a { clip-path:polygon(0 0, 100% 0, 0 100%); }
.gcard .art.dual.diagonal img.b { clip-path:polygon(100% 0, 100% 100%, 0 100%); }
.notice { border-left:3px solid var(--warn, #e0b020); padding:6px 10px; margin:8px 0; background:#e0b02014; }
.gcard .cap { padding:6px 8px; font-size:12px; line-height:1.3; }
.gcard .cap .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gcard .art .cardsel { position:absolute; top:6px; left:6px; width:18px; height:18px; z-index:2; }
.selbar { display:inline-flex; gap:6px; align-items:center; margin-left:8px; }
.localname { color:var(--dim); font-size:12px; }
/* RetroAchievements grids: square icon / badge-mosaic art (the mosaic keeps its full width
   and is cut off at the bottom), 4:3 screenshots, award-coloured frames. */
.gcard.square .art { aspect-ratio:1/1; }
.gcard.shot .art { aspect-ratio:4/3; }
.gcard.badges .art img { object-fit:cover; object-position:top; }
.gcard.icon .art img { object-fit:contain; }
.gcard.award-mastered { border-color:#e0b020; box-shadow:0 0 0 1px #e0b020; }
.gcard.award-completed { border-color:#b8c0d0; }
.gcard.award-beaten-hardcore, .gcard.award-beaten-softcore { border-color:#4f9a6a; }
.rabar { height:5px; background:#2a2d33; border-radius:3px; overflow:hidden; margin-top:3px; }
.rabar > div { height:100%; background:#4f8fd0; }
.rabar > div.hc { background:#e0b020; }
.rahead { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }

.rahead .stat { display:flex; flex-direction:column; min-width:90px; }
.rahead .stat b { font-size:18px; }
.ach { display:grid; grid-template-columns:64px 1fr auto; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
.ach img { width:64px; height:64px; border-radius:4px; }
.ach.hc img { outline:3px solid #e0b020; }
.ach.sc img { outline:2px solid #b8c0d0; }
.mosaic { max-width:100%; border-radius:6px; }
  .dropbefore { box-shadow: inset 0 3px 0 var(--accent, #4a8fe0); }
  .dropafter { box-shadow: inset 0 -3px 0 var(--accent, #4a8fe0); }
  .gcard.dropbefore { box-shadow: -3px 0 0 var(--accent, #4a8fe0); }
  .gcard.dropafter { box-shadow: 3px 0 0 var(--accent, #4a8fe0); }
  table.grid th { position: relative; }
  .colgrip { position: absolute; top: 0; right: 0; bottom: 0; width: 6px; cursor: col-resize; user-select: none; }
  .colgrip:hover { background: var(--accent, #4a8fe0); opacity: .5; }
  /* Custom widths: the table is as wide as its columns add up to (so one can be stretched
     past the card, scrolling sideways) rather than squeezed into 100%, and a cell may be as
     wide as its content asks. Sticky headers give way to the scroll container then. */
  /* table-layout:fixed only takes effect with a definite table width, so the script sets it to
     the sum of the column widths: with width:auto the browser falls back to automatic layout,
     where a nowrap column can never be narrower than its text. border-box so a frozen
     offsetWidth comes back as the same width. */
  table.grid.fixedcols { table-layout: fixed; }
  table.grid.fixedcols td, table.grid.fixedcols th { box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: none; }
  .gridscroll.fixed { overflow-x: auto; }

<script>

  const lines = [
    tr('Purging soft-deleted rows is NOT recommended, and nothing in romexplorer needs it.'),
    '',
    tr('A row marked deleted is not junk — it is the record of a file this machine once held. It is what lets romexplorer recognise a file you moved, renamed, re-archived or restored from a backup as the SAME file instead of re-hashing it as a stranger and losing its release, its RetroAchievements hash and its place in a game.'),
    '',
    trf('It is also the whole basis of the "missing, but found elsewhere" hint: {n} of your missing files are currently traceable to bytes you still have, and that hint disappears the moment those rows go.', { n: p.missing_found }),

    tr('Purging frees database rows, not disk space — your ROMs are never touched. It is worth doing only when the database itself has grown beyond the space you have for it.'),
    '',
    tr('This run would permanently delete:'),
    '  ' + tr('files') + '    ' + p.files,
    '  ' + tr('roms') + '     ' + p.roms,
    '  ' + tr('games') + '    ' + p.games,
    '  ' + tr('hashes') + '   ' + p.hashes,
    '  ' + tr('contents') + ' ' + p.contents,

// Manual match: search a provider by name (or paste an id), link it to a title or release,
// unlink existing links. kind = 'titles' | 'releases'.
// Media slots of a title / release: every linked item (manual picks first, marked), plus
// set-from-URL / upload / remove. A manual pick replaces the slot on the target (and its
// revisions) and is never replaced by a provider sync; screenshots/videos/fanart/audio
// are lists and get added to. Removing only unlinks -- no file is deleted.
function mediaSlots(host, kind, id, list, reload) {
  const key = kind === 'titles' ? 'title_id' : 'release_id';
  const subs = ['', 'front', 'back', 'top', 'bottom', 'left', 'right', 'spine'];
  const isImg = m => !['video', 'bgm'].includes(m.media_type);
  host.innerHTML = (list.length ? '<table class="grid">' + list.map(m => `<tr><td>${isImg(m) ? `<img src="${thumbUrl(m.id)}" alt="" style="max-height:48px;max-width:64px">` : m.media_type === 'video' ? `<video controls preload="metadata" src="${mediaUrl(m.id)}" style="max-height:120px;max-width:213px;display:block"></video>` : `<audio controls preload="none" src="${mediaUrl(m.id)}" style="width:213px"></audio>`}</td><td>${esc(m.media_type)}${m.sub_category ? '/' + esc(m.sub_category) : ''}</td><td>${m.source === 'manual' ? badge(tr('manual'), 'ok') : esc(m.source || '')}</td><td><a class="link" href="${mediaUrl(m.id)}" target="_blank">${esc(m.path.split('/').pop())}</a></td><td>${m.via ? badge(m.via === 'title' ? tr('from the title') : tr('from the game'), 'dim') : `<button class="btn small danger" data-rm="${m.id}">${tr('remove')}</button>`}</td></tr>`).join('') + '</table>' : `<span class="muted">${tr('none')}</span>`) + `
    <form class="inline" id="ms-form" style="margin-top:8px"><span class="muted">${tr('set slot:')}</span>
      <select name="media_type">${vocab.media_types.map(t => `<option ${t === 'box' ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
      <select name="sub_category">${subs.map(x => `<option value="${x}" ${x === 'front' ? 'selected' : ''}>${x || tr('(none)')}</option>`).join('')}</select>
      <input type="text" name="url" placeholder="${tr('image/video/audio file URL')}" style="min-width:260px"><button class="btn small" data-act="url">${tr('set from URL')}</button>
      <input type="file" name="file"><button class="btn small" data-act="upload">${tr('upload')}</button></form>`;
  const form = host.querySelector('#ms-form');
  let act = 'url';
  for (const b of form.querySelectorAll('[data-act]')) b.onclick = () => { act = b.dataset.act; };
  // A taken file name is the user's call: overwrite, a new name, or cancel (null).
  const onConflict = msg => confirm(msg + '\n\n' + tr('Overwrite it? (Cancel for other options)')) ? 'overwrite' : confirm(tr('Save it under a new name instead? (Cancel to stop)')) ? 'rename' : null;
  form.onsubmit = async e => {
    e.preventDefault(); const f = new FormData(form);
    const send = async onConf => {
      if (act === 'url') {
        return api('/api/v1/media/manual', { method: 'POST', body: { [key]: id, media_type: f.get('media_type'), sub_category: f.get('sub_category') || null, url: f.get('url').trim(), on_conflict: onConf } });
      }
      const file = form.file.files[0];
      const body = new FormData(); body.append(key, id); body.append('media_type', f.get('media_type')); body.append('sub_category', f.get('sub_category')); if (onConf) body.append('on_conflict', onConf); body.append('file', file, file.name);
      return api('/api/v1/media/upload', { method: 'POST', body });
    };
    try {
      if (act === 'url' && !f.get('url').trim()) return toast(tr('paste a file URL'), true);
      if (act !== 'url' && !form.file.files[0]) return toast(tr('choose a file'), true);
      let r;
      try { r = await send(null); } catch (err) {
        if (!err.message.startsWith('conflict:')) throw err;
        const choice = onConflict(err.message.slice('conflict:'.length).trim());
        if (!choice) return;
        r = await send(choice);
      }
      toast(trf('media #{id} set', { id: r.media_id }) + (r.replaced ? ' ' + trf('(replaced {id})', { id: r.replaced }) : '') + (r.linked_releases.length > 1 ? ' ' + trf('— shared by {n} releases', { n: r.linked_releases.length }) : ''));
      reload();
    } catch (err) { toast(err.message, true); }
  };
  for (const b of host.querySelectorAll('[data-rm]')) b.onclick = async () => {
    if (!confirm(kind === 'releases' ? tr("Unlink this media item here (and from this release's revisions)? The file itself is kept.") : tr('Unlink this media item here? The file itself is kept.'))) return;
    try { await api('/api/v1/media/' + b.dataset.rm + qs({ [key]: id }), { method: 'DELETE' }); toast(tr('removed')); reload(); } catch (err) { toast(err.message, true); }
  };
}

// release context: add to set / new set / remove from set
let setsCache = null;
async function loadSets(force) { if (!setsCache || force) setsCache = await api('/api/v1/sets'); return setsCache; }
// "Open with <emulator>" for a rom ({rom_id}) or a game ({game_id}: its .m3u playlist when
// it has one): the emulators set up for its platform (Config › Emulators), default first.
async function openWithItems(target) {

    if (x.unusable) return toast(`${x.name} ${x.unusable}`, true);
    try { const r = await api('/api/v1/launch', { method: 'POST', body: Object.assign({}, target, { emulator_id: x.id }) }); toast(trf('started {name}', { name: r.emulator })); } catch (e) { toast(e.message, true); }
  } }));

// Adds releases (body.release_ids), titles (body.title_ids) or cross-platform games (body.igdb_ids) to a
// set picked in a small dialog (or a new one).
// From FOLD_SETS_AT sets on, the RECENT_SETS last added to (updated_at is bumped on every add) are
// listed, then a fold holding every set. `except`: a set to leave out (the one a set page shows).
const FOLD_SETS_AT = 4, RECENT_SETS = 3;
async function setMenuItems(body, after, except) {
  const sets = (await loadSets(true)).filter(x => x.id !== except);
  const suffix = body.family_ids ? ' ' + tr('(as the definitive version)') : body.title_ids || body.title_row_ids || body.title_rows ? ' ' + tr('(as a title)') : '';
  const add = async (setId, name) => { try { const r = await api('/api/v1/sets/' + setId + '/releases', { method: 'POST', body }); toast(trf('added {n} release(s) to {set}', { n: r.added, set: name })); setsCache = null; if (after) after(); } catch (e) { toast(e.message, true); } };
  const item = (x, label) => ({ label, action: () => add(x.id, x.name) });
  const full = x => item(x, trf('Add to set: {set}', { set: x.name }) + suffix);
  const items = sets.length < FOLD_SETS_AT ? sets.map(full)
    : sets.slice().sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at))).slice(0, RECENT_SETS).map(full)
      .concat([{ label: trf('Add to set: all sets ({n})', { n: sets.length }) + suffix, children: sets.map(x => item(x, x.name)) }]);
  return items.concat([{ label: tr('New set…'), action: async () => { const name = prompt(tr('New set name:')); if (!name) return; try { const x = await api('/api/v1/sets', { method: 'POST', body: { name } }); await add(x.id, name); } catch (e) { toast(e.message, true); } } }]);
}
// --- display data: how a release is meant to be shown (api::display) ---
const DISPLAY_FIELDS = () => [['aspect', tr('aspect')], ['widescreen', tr('widescreen')], ['modes', tr('resolutions')], ['refresh', tr('refresh rate')]];
// Presets (common::display::ASPECTS / REFRESH); any W:H or Hz is accepted.
const DISPLAY_CHOICES = { aspect: ['4:3', '8:7', '16:9', '3:4', '3:2', '10:9', '5:3', '16:10', '16:15', '10:7', '14:9', '20:19', '12:7', '80:51', '1:1'], widescreen: ['none', 'option', 'native', 'patch'], refresh: ['60', '50', '50,60', '56', '55', '75', '60,120'] };
const DISPLAY_OUTPUTS = () => ({ tv: tr('TV'), screen: tr('screen'), top: tr('top screen'), bottom: tr('bottom screen'), gamepad: tr('GamePad') });
// "screen:960x544p,720x480p" -> [['screen', ['960x544p']], ['tv', ['720x480p']]]: a resolution
// without an output is on the TV.
function resolutionGroups(list) {
  const groups = [];
  for (const p of list) { const i = p.indexOf(':'); const o = i > 0 ? p.slice(0, i) : 'tv'; const r = i > 0 ? p.slice(i + 1) : p; let g = groups.find(x => x[0] === o); if (!g) groups.push(g = [o, []]); g[1].push(r); }
  return groups;
}
function resolutionsLabel(list) {
  const groups = resolutionGroups(list);
  if (groups.length === 1 && groups[0][0] === 'tv') return groups[0][1].join(' · ');
  return groups.map(([o, rs]) => `${DISPLAY_OUTPUTS()[o] || o} ${rs.join(' · ')}`).join(' — ');
}
function displayValueLabel(field, value) {
  if (value === null || value === undefined) return '—';
  if (field === 'widescreen') return { none: tr('no'), option: tr('16:9 option'), native: tr('16:9 native'), patch: tr('widescreen patch') }[value] || value;
  if (field === 'refresh') return value.split(',').join('/') + ' Hz';
  if (field === 'modes') return resolutionsLabel(value.split(','));
  return value;
}
function displaySourceLabel(source) {
  return { user: tr('set by you'), sfo: tr("from the game's PARAM.SFO"), mame: tr("from MAME's machine list"), pcsx2: tr("PCSX2's widescreen patches"), consolemods: tr('from a ConsoleMods list'), ipbin: tr("from the disc's IP.BIN") }[source] || source;
}
async function setDisplay(releaseIds, field, value) {
  return api('/api/v1/catalog/releases/display', { method: 'POST', body: { release_ids: releaseIds, field, value } });
}
// The Display card of a release or title page: each value with its Default / Confirmed badge;
// confirm (keep the default as yours), change…, reset (take your value back).
// The screenshot at 4:3 beside 8:7 (NES / SNES) or its own square-pixel shape (systems whose
// width varies by game), a button under each to choose. `media`: the page's media-strip query.
const ASPECT_SNAP = ['8:7', '16:15', '10:7', '3:2', '4:3', '5:4'];
function squareAspect(w, h) {
  const r = w / h;
  const near = ASPECT_SNAP.map(a => { const [x, y] = a.split(':').map(Number); return [a, Math.abs(x / y - r) / r]; }).sort((a, b) => a[1] - b[1])[0];
  if (near[1] < 0.02) return near[0];
  const gcd = (a, b) => b ? gcd(b, a % b) : a; const g = gcd(w, h);
  return (w / g) + ':' + (h / g);
}
async function aspectCompare(host, value, kind, media, releaseIds, after) {
  if (!host || !kind || !media) return;
  let items; try { items = await api('/api/v1/media/strip' + qs(media)); } catch (e) { return; }
  const rank = m => ({ screenshot: 0, title_screen: 1, box: 2, cover: 3 }[m.media_type] ?? 9);
  // A box's back or spine shows nothing of the picture.
  const shots = items.filter(m => m.kind === 'image' && rank(m) < 9 && !(m.media_type === 'box' && m.sub_category && m.sub_category !== 'front')).sort((a, b) => rank(a) - rank(b));
  // Only a box or cover to show: a sample, not something to judge the pixel shape by.
  const noScreenshot = shots.length > 0 && !shots.some(m => m.media_type === 'screenshot' || m.media_type === 'title_screen');
  const withToken = path => path + (token ? '?token=' + encodeURIComponent(token) : '');
  let at = 0;
  const draw = async () => {
    const m = shots[at];
    let other = kind === 'square' ? null : kind, note = '';
    if (m && kind === 'square') {
      const img = new Image(); img.src = withToken(m.file);
      try { await img.decode(); other = squareAspect(img.naturalWidth, img.naturalHeight); note = `${img.naturalWidth}×${img.naturalHeight}`; } catch (e) { other = null; }
      if (other === '4:3') note += ' · ' + tr('this image is already 4:3');
    }
    const box = (aspect, label) => { const [x, y] = aspect.split(':'); return `<figure class="${value === aspect ? 'on' : ''}">${m ? `<div class="ac-box" style="aspect-ratio:${x}/${y}"><img src="${esc(withToken(m.file))}" alt=""></div>` : ''}<figcaption><button class="btn small${value === aspect ? ' primary' : ''}" data-ac="${esc(aspect)}">${esc(label)}</button></figcaption></figure>`; };

    else if (r.set_via === 'title' && r.set_title_id) { if (!body.title_ids.includes(r.set_title_id)) body.title_ids.push(r.set_title_id); }

    const goBtn = host.querySelector('[data-id="go"]');
    if (goBtn) goBtn.onclick = async () => {

      catch (e) { st.error = e.message; }

      if (st.job) watchJob(st.job, host.querySelector('[data-id="watch"]'), () => {});

// ---------------------------------------------------------------------------
// "Copy to…": the dialog, its conversion settings, and Config > Copy
// ---------------------------------------------------------------------------
// Everything the dialog shows beyond the four choices (where, which mode, how folders are
// named, what files are converted to) is the server's own plan from /copy/preview, so the
// numbers on screen are the numbers the job will produce.
const COPY_MODES = {

  to_external: ['to external media', 'an SD card, a phone, a USB stick. Nothing is written to the database, and nothing is skipped for being held here -- a second copy is the point.'],
  in_local: ['within my collection (convert in place)', 'read from one folder here, write to another -- mostly how a conversion is done. Both stay registered. You decide what happens to any file already at the destination.'],
  in_server: ["within the server's collection", 'the server rearranging its own collection. Every file is checked, and nothing already there is ever overwritten: it is skipped and reported while the rest carry on.'],
  upload: ['up to the server', "your files up to the server, through the mount, for content it doesn't have. Never overwrites. The server hashes what arrived itself."],

const FOLDER_SCHEMES = [['dat', 'pack name with manufacturer (No-Intro / Redump / RetroArch)'], ['display', 'display name, no manufacturer'], ['slug', 'IGDB slug (RomM)'], ['es', 'short name (EmulationStation / RetroArch)'], ['custom', 'custom']];
const QUICK_HASHES = ['xxh3_128', 'crc32', 'md5', 'sha1', 'sha256'];
// The archive settings pulldowns: mirrors of romexplorer_types::copy's lists of the same
// names, whose test parses every entry, so none is a value the server would refuse.
const ZIP_CODECS = ['zstd', 'deflate', 'bzip2', 'lzma', 'store'];
const SEVEN_ZIP_CODECS = ['zstd', 'lzma2', 'lzma', 'bzip2', 'deflate', 'copy'];
// romexplorer_types::copy::codec_levels: [lowest, highest, default] level per codec.
const codecLevels = c => ['store', 'copy', 'uncompressed'].includes(c) ? [0, 0, 0] : c === 'zstd' ? [1, 22, 5] : [1, 9, 5];
const RVZ_CODECS = ['zstd', 'lzma2', 'lzma', 'bzip2', 'uncompressed'];
const RVZ_BLOCK_SIZES = ['32k', '64k', '128k', '256k', '512k', '1m', '2m'];
const WIA_CODECS = ['lzma', 'lzma2', 'bzip2', 'uncompressed'];
const CHD_CD_CODECS = ['cdzs', 'cdfl', 'cdlz', 'cdzl'];
const CHD_DVD_CODECS = ['zstd', 'lzma', 'zlib', 'flac', 'huff'];
const CHD_MAX_CODECS = 4;
// The stored settings with every missing part filled in from the server's defaults
// (romexplorer_types::copy::OutputSettings), so a form never reads an undefined group.
function outputWithDefaults(o) {
  o = o && typeof o === 'object' ? JSON.parse(JSON.stringify(o)) : {};
  o.per_platform = o.per_platform || [];
  o.zip = Object.assign({ codec: 'zstd', level: 5, re_archive: false }, o.zip);
  o.seven_zip = Object.assign({ codec: 'zstd', level: 5, re_archive: false }, o.seven_zip);
  o.rvz = Object.assign({ codec: 'zstd', block_size: '128k', level: 5, remove_junk_data: false, re_archive: false }, o.rvz);
  o.gcz = Object.assign({ block_size: '128k', re_archive: false }, o.gcz);
  o.wia = Object.assign({ codec: 'lzma', level: 5, re_archive: false }, o.wia);
  o.chd = Object.assign({ preset: 'chdman_default', codecs: [], dvd_codecs: [], re_archive: false }, o.chd);
  return o;
}
const copyMandatoryVerify = m => m === 'in_server';
const copyNeverOverwrites = m => m === 'in_server' || m === 'upload';

// A selection of `kind` rows ("titles" | "releases" | "sets" | "games" | "roms" | "files"). A
// "titles" row is a Titles-list row (`row_id`): one kind of a title's releases.
// Catalogue levels are plain ids; ownership levels name whose row it is (none = this machine).
function copySelection(kind, ids) {
  const refs = ids.map(id => ({ id }));
  return kind === 'titles' ? { title_row_ids: ids } : kind === 'releases' ? { release_ids: ids } : kind === 'sets' ? { set_ids: ids }
    : kind === 'roms' ? { rom_ids: refs } : kind === 'files' ? { file_ids: refs } : { game_ids: refs };

// "Copy to…" for a row's menu, or for the whole selection when the clicked row is in it.
function copyMenuItem(kind, id, name, sel) {

    ? { label: trf('Copy {n} selected {kind} to…', { n: many.length, kind: kindWord(kind) }), action: () => copyDialog(copySelection(kind, many), trf('{n} selected {kind}', { n: many.length, kind: kindWord(kind) })) }
    : { label: tr('Copy to…'), action: () => copyDialog(copySelection(kind, [id]), name || trf('this {kind}', { kind: kindWord(kind, true) })) };
}
// The selection-bar button. The selection stays: a copy doesn't change the list it started from.
function copySelAction(kind) {

}

// Numbers: a page's id comes from its route as text, and the server reads ids as integers.
function artSelection(kind, ids) { ids = ids.map(Number); return kind === 'titles' ? { title_row_ids: ids } : kind === 'sets' ? { set_ids: ids } : { release_ids: ids }; }

// A started job in a dialog: its progress, and either leave it running or cancel it; once

function jobFooter(box, id) {

  foot.querySelector('[data-bg]').onclick = closeModal;
  foot.querySelector('[data-abort]').onclick = async ev => {

  };

}
async function artDialog(selection, what) {

          <td class="muted">9</td>
          <td class="muted">${tr('PS2 / PSP .iso only')}</td></tr>
        <tr class="${off('chd')}"><td>chd ${info(`<p>${tr('pc: zstd. A CD gets cdzs (zstd) with cdfl for its audio tracks; a DVD gets zstd. Fast to read, and every current PC emulator reads it.')}</p><p>${tr('mobile: the same, except PlayStation 2, which gets zlib (cdzl + cdfl for a CD, zlib for a DVD): some mobile emulators have trouble with zstd CHDs, and PS2 is where that shows.')}</p><p>${tr('Both presets choose the hunk size: for a CD, 2448 bytes (one sector) for Neo Geo CD, PC Engine CD and Dreamcast, which read in small scattered pieces, and 19584 (chdman\'s own) elsewhere; for a DVD, 4096, or 2048 for PSP.')}</p><p>${tr('chdman default: no codec list or hunk size, chdman decides. custom: your own codecs (up to 4) and hunk size, separately for CDs and DVDs.')}</p>`)}</td><td colspan="2"><select data-k="chd.preset">${[['chdman_default', 'chdman default'], ['pc', 'pc (zstd)'], ['mobile', 'mobile (zstd; PS2 zlib)'], ['custom', 'custom']].map(([v, l]) => `<option value="${v}" ${o.chd.preset === v ? 'selected' : ''}>${tr(l)}</option>`).join('')}</select>
          ${o.chd.preset === 'custom' ? chdLine('cd') + chdLine('dvd') : ''}</td>
          <td><label><input data-k="chd.re_archive" type="checkbox" ${o.chd.re_archive ? 'checked' : ''}> ${tr('re-encode a file that is already a chd')}</label></td></tr>
      </tbody></table>
      ${unavailable.length ? `<div class="warn">${trf('this machine has no native library for: {list} — those stay plain copies', { list: unavailable.join(', ') })}</div>` : ''}</div>`;
    for (const input of host.querySelectorAll('[data-k]')) input.onchange = () => {
      const [group, key] = input.dataset.k.split('.');
      let v = input.type === 'checkbox' ? input.checked : input.value;
      if (key === 'level') { const [lo, hi, def] = codecLevels(output[group].codec); v = Number(v); if (!(v >= lo && v <= hi)) v = def; }
      if (key === 'hunk_size' || key === 'dvd_hunk_size') { v = Number(v) > 0 ? Number(v) : undefined; }
      if (v === undefined) delete output[group][key]; else output[group][key] = v;
      // A new codec brings its own level range: keep the level inside it.
      if (key === 'codec') { const [lo, hi, def] = codecLevels(v); if (!(output[group].level >= lo && output[group].level <= hi)) output[group].level = def; draw(); }
      if (key === 'preset') draw();
      if (onChange) onChange();
    };
    // Up to four CHD codecs, best first; a blank slot is simply skipped.
    for (const s of host.querySelectorAll('[data-codec]')) s.onchange = () => {
      const media = s.dataset.codec;
      output.chd[media === 'dvd' ? 'dvd_codecs' : 'codecs'] = [...host.querySelectorAll(`[data-codec="${media}"]`)].map(x => x.value).filter(Boolean);
      if (onChange) onChange();
    };
  };
  draw();
}

// What happens to each file already at its destination: skip (the default -- unanswered is
// skip), rename (written beside it as " (2)") or overwrite, per file or for all. `choices` is
// the dialog's own object, keyed by destination; the app's ConflictChoices.
const CONFLICT_OPTIONS = [['skip', 'skip'], ['rename', 'rename'], ['overwrite', 'overwrite']];
function conflictChoicesHtml(conflicts, choices, group = 'conflict') {
  return `<div class="toolbar"><button class="btn small" type="button" data-all="skip">${tr('skip all')}</button><button class="btn small" type="button" data-all="rename">${tr('rename all')}</button><button class="btn small" type="button" data-all="overwrite">${tr('overwrite all')}</button></div>
    <table class="grid"><thead><tr><th>${tr('destination')}</th><th></th></tr></thead><tbody>${conflicts.map((key, i) => `<tr><td class="mono" title="${esc(key)}">${esc(key)}</td><td>${CONFLICT_OPTIONS.map(([v, l]) => `<label><input type="radio" name="${group}-${i}" data-conflict="${i}" value="${v}" ${(choices[key] || 'skip') === v ? 'checked' : ''}> ${tr(l)}</label>`).join(' ')}</td></tr>`).join('')}</tbody></table>`;
}
function wireConflictChoices(root, conflicts, choices, redraw) {
  for (const b of root.querySelectorAll('[data-all]')) b.onclick = () => { for (const k of conflicts) choices[k] = b.dataset.all; for (const r of root.querySelectorAll(`[data-conflict][value="${b.dataset.all}"]`)) r.checked = true; if (redraw) redraw(); };
  for (const r of root.querySelectorAll('[data-conflict]')) r.onchange = () => { choices[conflicts[Number(r.dataset.conflict)]] = r.value; };
}

        ${artTargets.length ? `<div>${tr('artwork')}</div><div><span>${tr('export art afterwards for: ')}</span>${artTargets.map(e => `<label style="margin-right:10px"><input type="checkbox" data-art="${e.id}" ${exportFor.has(e.id) ? 'checked' : ''}> ${esc(e.name)}</label>`).join('')}
          <div class="muted">${tr("Named after the files this copy writes, into each emulator's artwork folder (Config › Emulators).")}</div></div>` : ''}

          <div class="muted">${tr('A complete copy always beats an incomplete one, whichever machine holds it.')}</div></div>
      </div>
      <div style="margin:8px 0"><button class="btn small" type="button" data-id="toggle">${st.showOutput ? tr('hide conversion settings') : tr('change conversion for this copy…')}</button>${st.showOutput ? '' : ` <span class="muted">${tr('using the settings from Config › Copy')}</span>`}</div>

            <div class="fsfoot"><span class="grow"></span><button type="button" class="btn" data-id="pop-cancel">${tr('cancel')}</button><button type="button" class="btn primary" data-id="pop-go">${tr('copy')}</button></div>`);
          const redraw = () => { pop.querySelector('[data-id="choices"]').innerHTML = conflictChoicesHtml(p.conflicts, st.choices, 'pop-conflict'); wireConflictChoices(pop, p.conflicts, st.choices, redraw); };
          wireConflictChoices(pop, p.conflicts, st.choices, redraw);
          pop.querySelector('[data-id="pop-cancel"]').onclick = () => { closeSubModal(); draw(); };
          pop.querySelector('[data-id="pop-go"]').onclick = async () => {

            closeSubModal();
            st.starting = true;

        }

      await start();
    };
    attachBrowse(box);
  };
  draw();
}

      <label style="display:block; margin-bottom:6px">${tr('a checked copy compares with ')}<select id="cc-hash">${QUICK_HASHES.map(h => `<option ${defaults.populate_hash === h ? 'selected' : ''}>${h}</option>`).join('')}</select>
        ${info(`<p>${tr("A checked copy compares what it wrote against this hash whenever the catalogue has it for those bytes. Where it does not, it compares against the cheapest hash the catalogue does hold and records this one once the copy matches, so later checks use it. xxh3_128 (the default) is far stronger than crc32 at nearly its speed. The integrity check has its own setting (integrity_populate_hash).")}</p>`)}</label>
      <label style="display:block; margin-bottom:6px"><input type="checkbox" id="cc-decide" ${defaults.decide_on_copy ? 'checked' : ''}>${tr(" decide on copy — open every copy's dialog with these settings expanded and editable")}</label>
      <div id="cc-output"></div>
      <div class="toolbar"><span class="grow"></span><button class="btn primary" type="button" id="cc-save-output">${tr('save archive settings')}</button></div></div>
    <div class="card"><h2>${tr('Which file a copy takes')}</h2><p class="muted">${tr('A copy takes one copy of each release and one file of each game. These decide which, when there is more than one.')}</p>
      <label style="display:block; margin-bottom:6px">${tr('headered or headerless: ')}<select id="cc-header">${[['priority', tr('folder priority')], ['headered', tr('headered')], ['headerless', tr('headerless')]].map(([v, l]) => `<option value="${v}" ${(defaults.header_preference || 'priority') === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
        ${info(`<p>${tr("When one copy of a release holds a headered and a headerless dump of one cartridge (the DAT names the headerless one .unh), which one a copy takes. Folder priority takes the one in the folder first under Config › Directories. The set's size counts the same file.")}</p>`)}</label>
      <label style="display:block; margin-bottom:6px">${tr('Wii U, wua or wux: ')}<select id="cc-wiiu">${[['wua', tr('wua')], ['wux', tr('wux / wud')], ['priority', tr('folder priority')]].map(([v, l]) => `<option value="${v}" ${(defaults.wiiu_preference || 'wua') === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
        ${info(`<p>${tr("When one copy of a release holds a Wii U game both as Cemu's .wua and as a disc image (.wux or .wud), which one a copy takes. With the .wua, the disc's .key stays behind too. Folder priority takes the one in the folder first under Config › Directories. The set's size counts the same file.")}</p>`)}</label>
      <div style="margin-bottom:6px">${tr('dump formats, first preferred:')}<br><textarea id="cc-formats" rows="5" style="width:100%; font-family:monospace">${esc((defaults.format_order || DEFAULT_FORMAT_ORDER).map(f => f.join(', ')).join('\n'))}</textarea> <button class="btn small" id="cc-formats-reset" type="button">${tr('back to the defaults')}</button> ${info(`<p>${tr("When one copy holds the same game in several formats (the same name, different extensions), a copy takes the first format of its line. One family per line, first preferred. A disc's cue and bin are never two formats, and .nes / .unh follow the headered or headerless setting. The set's size counts the same file.")}</p>`)}</div>
      <label style="display:block; margin-bottom:6px"><input type="checkbox" id="cc-decrypt" ${defaults.prefer_decrypted !== false ? 'checked' : ''}>${tr(' prefer decrypted dumps over encrypted ones')} ${info(`<p>${tr("Between copies of one release, a decrypted dump (3DS, DS, Wii U, …) comes before one whose folder or file name says Encrypted. A copy you put first by hand still comes first.")}</p>`)}</label>
    </div>`;
  const pending = () => { const n = Object.keys(folderEdits).length + Object.keys(formatEdits).length; document.getElementById('cc-pending').textContent = n ? trf('{n} unsaved change(s)', { n }) : ''; document.getElementById('cc-save').disabled = !n; };
  document.getElementById('cc-scheme').onchange = e => saveNaming({ scheme: e.target.value }, true);
  // Edits carried over from before a redraw go back into their boxes.
  for (const [id, v] of Object.entries(folderEdits)) { const i = view.querySelector(`[data-folder="${id}"]`); if (i) i.value = v; }
  for (const [id, v] of Object.entries(formatEdits)) { const sel = view.querySelector(`[data-format="${id}"]`); if (sel) sel.value = v; }
  pending();
  document.getElementById('cc-reset').onclick = async () => {
    if (!confirm(tr('Clear every custom folder name? Output formats are left alone.'))) return;
    try { await api('/api/v1/naming/folders/reset', { method: 'POST', body: {} }); toast(tr('custom names cleared')); showCopyConfig({ formatEdits }); } catch (e) { toast(e.message, true); }
  };
  for (const b of view.querySelectorAll('[data-combine]')) b.onchange = () => saveNaming({ combine: [[naming.combine[Number(b.dataset.combine)].key, b.checked]] }, true);
  document.getElementById('cc-filter').oninput = e => { const f = e.target.value.trim().toLowerCase(); for (const row of document.getElementById('cc-rows').children) row.style.display = !f || row.dataset.name.includes(f) ? '' : 'none'; };
  for (const i of view.querySelectorAll('[data-folder]')) i.oninput = () => { folderEdits[i.dataset.folder] = i.value; pending(); };
  let lossyWarning = defaults.lossy_warning !== false;
  for (const s of view.querySelectorAll('[data-format]')) {
    let was = s.value;
    s.onchange = () => {
      const take = () => { was = s.value; formatEdits[s.dataset.format] = s.value; pending(); };
      if (!LOSSY_FORMATS.includes(s.value) || !lossyWarning) return take();
      const wanted = s.value;
      s.value = was; // back to what it was until the answer is yes
      askLossy(wanted, dontAsk => {
        s.value = wanted; take();
        if (dontAsk) { lossyWarning = false; document.getElementById('cc-lossy').checked = false; putDefaults({ lossy_warning: false }); }
      });
    };
  }
  document.getElementById('cc-save').onclick = () => saveNaming({ folders: Object.entries(folderEdits).map(([id, v]) => [Number(id), v]), formats: Object.entries(formatEdits).map(([id, v]) => [Number(id), v]) });
  document.getElementById('cc-verify').onchange = e => putDefaults({ verify_default: e.target.checked });
  document.getElementById('cc-lossy').onchange = e => { lossyWarning = e.target.checked; putDefaults({ lossy_warning: e.target.checked }); };
  document.getElementById('cc-hash').onchange = e => putDefaults({ populate_hash: e.target.value });
  document.getElementById('cc-decide').onchange = e => putDefaults({ decide_on_copy: e.target.checked });
  document.getElementById('cc-header').onchange = e => putDefaults({ header_preference: e.target.value });
  document.getElementById('cc-wiiu').onchange = e => putDefaults({ wiiu_preference: e.target.value });
  const formatLines = order => order.map(f => f.join(', ')).join('\n');
  const saveFormats = async order => { try { const d = await api('/api/v1/copy/defaults', { method: 'PUT', body: { format_order: order } }); document.getElementById('cc-formats').value = formatLines(d.format_order); toast(tr('saved')); } catch (e) { toast(e.message, true); } };
  document.getElementById('cc-formats').onchange = e => saveFormats(e.target.value.split('\n').map(l => l.split(/[,\s>]+/).map(x => x.trim()).filter(Boolean)));
  document.getElementById('cc-formats-reset').onclick = () => saveFormats(DEFAULT_FORMAT_ORDER);
  document.getElementById('cc-decrypt').onchange = e => putDefaults({ prefer_decrypted: e.target.checked });
  copyOutputForm(document.getElementById('cc-output'), output, unavailable, null, tr('The defaults every copy starts from.'));
  document.getElementById('cc-save-output').onclick = async () => { if (await putDefaults({ output })) toast(tr('saved')); };
}

// ---------------------------------------------------------------------------
// audio: the library list, tagging, and the player on title / release / RA game pages
// ---------------------------------------------------------------------------
// A track on the main server (a client's `remote` one) is streamed through this machine.
// A ROM track (`rom`) is decoded out of the ROM on its first play.
function audioUrl(id, remote, rom) { return '/api/v1/audio/' + (remote ? 'remote/' : '') + (rom ? 'rom/' : '') + id + '/file' + (token ? '?token=' + encodeURIComponent(token) : ''); }

// The media strip of a title / release page: one horizontal, scrollable row of everything the
// media_show setting allows. Images are thumbnails that open full size; videos and audio carry
// their own controls and load nothing until played. A `remote` item is not stored on this
// machine and is streamed from the main server. The card stays hidden when there is nothing.
async function mediaStrip(host, query) {
  if (!host) return;
  let items; try { items = await api('/api/v1/media/strip' + qs(query)); } catch (e) { return; }
  if (!items.length || !host.isConnected) return;
  const withToken = path => path + (token ? '?token=' + encodeURIComponent(token) : '');
  host.innerHTML = '<div class="media-strip">' + items.map(m => {
    const full = withToken(m.file), label = m.media_type + (m.sub_category ? ' / ' + m.sub_category : '');
    // A thumbnail is made from a file held here; a streamed one is shown as it is.
    const body = m.kind === 'video' ? `<video controls preload="metadata" src="${esc(full)}"></video>`
      : m.kind === 'audio' ? `<audio controls preload="none" src="${esc(full)}"></audio>`
      : `<img src="${esc(m.remote ? full : thumbUrl(m.id))}" data-full="${esc(full)}" alt="${esc(label)}" loading="lazy">`;
    return `<figure>${body}<figcaption>${esc(label)}${m.source ? ' · ' + esc(m.source) : ''}${m.remote ? ' ' + badge(tr('streamed'), 'dim') : ''}</figcaption></figure>`;
  }).join('') + '</div>';
  host.hidden = false;
  for (const img of host.querySelectorAll('img[data-full]')) img.onclick = () => {
    const zoom = el(`<div class="media-zoom"><img src="${esc(img.dataset.full)}" alt=""></div>`);
    zoom.onclick = () => zoom.remove();
    document.body.appendChild(zoom);
  };
}
function fmtDuration(ms) { if (!ms) return ''; const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

// A tag picker: type to search the tags that exist (those on audio files first, then the
// catalogue's keywords; scope 'audio' = only tags on audio files), click one to take it, or
// press Enter to use what was typed -- a new tag is just a name nobody has used yet.
// Resolves to the name, or null when cancelled.
function tagPicker(question, scope, extra) {
  return new Promise(resolve => {
    const box = openModal(`<h3>${esc(question)}</h3>
      <form id="tp-form"><input id="tp-input" type="text" autocomplete="off" placeholder="${tr('type to search, or enter a new tag')}" style="width:100%">
      <div id="tp-list" style="max-height:280px;overflow-y:auto;margin:6px 0"></div>
      <button class="btn primary">${tr('use this tag')}</button> <button type="button" class="btn" id="tp-cancel">${tr('cancel')}</button></form>`);
    const input = box.querySelector('#tp-input'), list = box.querySelector('#tp-list');
    let settled = false;
    const finish = value => { if (settled) return; settled = true; watcher.disconnect(); closeModal(); resolve(value); };
    // Closed some other way (Escape, a click outside): that is a cancel.
    const watcher = new MutationObserver(() => { if (!box.isConnected) { settled = true; watcher.disconnect(); resolve(null); } });
    watcher.observe(modal, { childList: true });
    let asked = 0;
    const search = async () => {
      const mine = ++asked;
      let found = []; try { found = await api('/api/v1/audio/tags' + qs(Object.assign({ q: input.value.trim(), scope }, extra || {}))); } catch (e) { /* the box still works as a plain input */ }
      if (mine !== asked || settled) return;
      list.innerHTML = found.length ? found.map(s => `<div class="tp-row" data-name="${esc(s.name)}" style="padding:4px 6px;cursor:pointer;border-bottom:1px solid var(--line)">${badge(s.name, 'ok')} <span class="muted">${[s.files ? trf('{n} file(s)', { n: s.files }) : '', s.titles ? trf('{n} title(s)', { n: s.titles }) : ''].filter(Boolean).join(' · ')}</span></div>`).join('')
        : `<div class="muted">${input.value.trim() ? tr('no existing tag matches — Enter makes a new one') : tr('no tags yet')}</div>`;
    };
    let timer = null;
    input.oninput = () => { clearTimeout(timer); timer = setTimeout(search, 150); };
    list.onclick = e => { const row = e.target.closest('.tp-row'); if (row) finish(row.dataset.name); };
    box.querySelector('#tp-cancel').onclick = () => finish(null);
    box.querySelector('#tp-form').onsubmit = e => { e.preventDefault(); finish(input.value.trim() || null); };
    input.focus(); search();
  });
}

// The player for a page: every playable file sharing a keyword tag with the page's title,
// and the music in its ROMs. Shown (and started) only when there is something to play; a
// title page with nothing stops music kept playing from an earlier one.
async function pagePlayer(query) {
  if (!window.rxPlayer) return;
  let list; try { list = await api('/api/v1/audio/playlist' + qs(query)); } catch (e) { window.rxPlayer.stop(); return; }
  for (const old of view.querySelectorAll('.rx-videos')) old.remove();
  // A title page whose ROMs have video sound (a title movie): this title's own on / off,
  // over the audio_rom_videos setting.
  const tv = list.title_videos;
  if (tv && (tv.has_video || tv.choice !== 'default')) {
    const row = el(`<div class="toolbar rx-videos"><label>${tr('Video sound for this title')} <select>${[['default', tr('as in Settings')], ['on', tr('on')], ['off', tr('off')]].map(([v, l]) => `<option value="${v}"${v === tv.choice ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label></div>`);
    row.querySelector('select').onchange = async e => {
      try { await api(`/api/v1/audio/rom/title/${tv.title_id}`, { method: 'PUT', body: { videos: e.target.value } }); toast(tr('saved')); for (const h of view.querySelectorAll('.rx-player-host')) h.remove(); pagePlayer(query); } catch (err) { toast(err.message, true); }
    };
    view.insertBefore(row, view.firstChild);
  }
  if (!list.tracks.length && !(list.hidden || []).length) { window.rxPlayer.stop(); return; }
  const host = el('<div class="rx-player-host"></div>'); view.insertBefore(host, view.firstChild);
  const playable = t => Object.assign({}, t, { url: audioUrl(t.id, t.remote, t.rom), album: t.rom ? [t.album, t.rom_kind && tr(t.rom_kind)].filter(Boolean).join(' · ') : t.album });
  // "Don't play this track" and "restore", recorded for this page's title.
  const onHide = list.hide_title ? async (t, hidden) => {
    try { await api('/api/v1/audio/hidden', { method: 'PUT', body: { title_id: list.hide_title, id: t.id, rom: !!t.rom, hidden } }); toast(hidden ? tr('hidden from this page') : tr('restored')); } catch (e) { toast(e.message, true); }
  } : null;
  window.rxPlayer.start(host, list.tracks.map(playable),
    { previous: tr('previous'), next: tr('next'), 'hidden tracks': tr('hidden tracks'), 'click to listen': tr('click to listen'), restore: tr('restore'), undo: tr('undo'), "don't play this track on this page again": tr("don't play this track on this page again"), stop: tr('stop'), shuffle: tr('shuffle'), mute: tr('mute'), playlist: tr('playlist'), position: tr('position'), 'play / pause': tr('play / pause'), volume: tr('volume'), normalise: tr('normalise'), 'normalise: play every track at about the same loudness (loud tracks are turned down; quiet ROM tracks are turned up)': tr('normalise: play every track at about the same loudness (loud tracks are turned down; quiet ROM tracks are turned up)'), crossfade: tr('crossfade'), 'crossfade: the next track fades in while this one fades out, overlapping by this many ms (0 = off)': tr('crossfade: the next track fades in while this one fades out, overlapping by this many ms (0 = off)') },
    { keep: !!list.keep_playing, hidden: (list.hidden || []).map(t => Object.assign(playable(t), { album: t.album })), onHide });
}

// ---------------------------------------------------------------------------
// routing: #tab/sub/id
// ---------------------------------------------------------------------------
const TABS = [['status', 'Status'], ['collection', 'Collection'], ['ra', 'RetroAchievements'], ['edit', 'Edit'], ['scan', 'Scan'], ['jobs', 'Jobs'], ['schedules', 'Scheduled jobs'], ['config', 'Config'], ['data', 'Data'], ['about', 'About']];
// The UI's text in the chosen language (assets/i18n/<lang>.json via /api/v1/i18n); the
// English in the code is the fallback for any key the file lacks.
let i18n = {}, platformNameLanguage = 'en';
function t(key, fallback) { const v = i18n[key]; return typeof v === 'string' && v ? v : fallback; }
// User-facing text keyed by its own English: an English string with no entry is shown as it
// is. trf fills {name} placeholders after translating, so word order can differ per language.
function tr(text) { return t(text, text); }
// A selection kind ('titles', 'sets', ...) in the UI's language for a {kind} fill: the plural,
// or the singular for 'this {kind}'. The singular 'set' is trc'd: the bare word is the
// "has a value" badge. (The app's state::kind_word.)
function kindWord(kind, singular) { return !singular ? tr(kind) : kind === 'sets' ? trc('sets', 'set') : tr(kind.replace(/s$/, '')); }
// tr for a word with more than one sense: `context|text` is tried first (the app's trc).
function trc(context, text) { return t(context + '|' + text, '') || tr(text); }
function trf(text, fills) { let out = tr(text); for (const [k, v] of Object.entries(fills || {})) out = out.split('{' + k + '}').join(v); return out; }
// A platform's name as shown: the canonical English name, or its Japanese name when the
// platform_name_language setting asks for it. Values in rows are always the canonical name.
function platformLabel(name) { if (platformNameLanguage === 'en' || !vocab) return name; const p = vocab.platforms.find(x => x.name === name); return (p && p.name_ja) || name; }

// Best matches first (the exact name, then names starting with it), a page at a time. Given

function pickTitleDialog(heading, onPick, releaseIds = []) {
  const near = releaseIds.join(','), per = 25;
  const box = openModal(`<h2>${esc(heading)}</h2><input type="text" id="pt-q" placeholder="${tr('search titles…')}" style="width:100%">
    ${near ? `<label class="muted"><input type="checkbox" id="pt-near" checked> ${tr("only titles on these releases' platforms")}</label>` : ''}
    <table class="grid" id="pt-list"></table><div class="pager"><span id="pt-pages"></span> <button class="btn" id="pt-close">${tr('close')}</button></div>`);
  const input = box.querySelector('#pt-q'), list = box.querySelector('#pt-list'), pages = box.querySelector('#pt-pages'), nearBox = box.querySelector('#pt-near');
  let timer = null, offset = 0;
  const search = async () => {
    if (!input.value.trim()) { list.innerHTML = ''; pages.innerHTML = ''; return; }
    try {
      const params = { search: input.value.trim(), limit: per, offset, view: 'collection', kinds: 'commercial,homebrew,arcade,wiiware' };
      if (near) Object.assign(params, { near_releases: near, near_only: nearBox.checked });

      list.innerHTML = page.items.map(t => `<tr data-pick="${t.id}" style="cursor:pointer"><td>${esc(t.display_name || t.name)}</td><td>${platformBadges(t.platforms)}</td></tr>`).join('') || `<tr><td class="muted">${tr('no titles')}</td></tr>`;
      for (const row of list.querySelectorAll('[data-pick]')) row.onclick = () => { closeModal(); onPick(Number(row.dataset.pick)); };
      pages.innerHTML = page.total > per ? `<button class="btn" data-prev ${offset === 0 ? 'disabled' : ''}>‹</button> <span class="muted">${page.total ? offset + 1 : 0}–${Math.min(offset + per, page.total)} / ${page.total}</span> <button class="btn" data-next ${offset + per >= page.total ? 'disabled' : ''}>›</button>` : '';
      const prev = pages.querySelector('[data-prev]'), next = pages.querySelector('[data-next]');

    <div class="pager"><button class="btn" data-prev ${offset === 0 ? 'disabled' : ''}>${tr('‹ prev')}</button><span>${trf('{from}–{to} of {total}', { from: page.total ? offset + 1 : 0, to: Math.min(offset + 50, page.total), total: page.total })}</span><button class="btn" data-next ${offset + 50 >= page.total ? 'disabled' : ''}>${tr('next ›')}</button> <button class="btn" id="pl-close">${tr('close')}</button></div>`);
  const again = (st, off, q) => { closeModal(); patchLinks(st, off, q); };

  const refreshBulk = () => { for (const b of box.querySelectorAll('[data-bulk]')) b.disabled = !picks().length; };

// A filter of tick boxes (`type: 'checks'`): the value is the ticked ones, comma separated.
function checksBox(f, filters, onChange) {
  const known = f.options().concat(f.extra ? f.extra() : []).map(o => o[0]);
  let selected = f.ticked(filters[f.key]).filter(v => known.includes(v));
  const wrap = el(`<details class="checks"><summary title="${esc(f.label)}"></summary><div class="pop"></div></details>`);
  const summary = wrap.querySelector('summary'), pop = wrap.querySelector('.pop');
  const row = ([v, l]) => `<label><input type="checkbox" value="${esc(v)}" ${selected.includes(v) ? 'checked' : ''}> ${esc(l)}</label>`;
  const title = () => { const main = f.options().filter(o => selected.includes(o[0])); summary.textContent = f.label + ': ' + (main.length === f.options().length ? tr('all') : main.length || selected.length ? f.options().concat(f.extra ? f.extra() : []).filter(o => selected.includes(o[0])).map(o => o[1]).join(', ') : tr('all')); };
  pop.innerHTML = `<div class="muted" style="white-space:normal;max-width:240px;margin-bottom:4px">${esc(tr('Tick what to show; with nothing ticked, everything is shown.'))}</div>` + f.options().map(row).join('') + (f.extra ? '<div class="sep"></div>' + f.extra().map(row).join('') : '');
  pop.onchange = () => { selected = [...pop.querySelectorAll('input:checked')].map(i => i.value); filters[f.key] = selected.join(',') || f.none; title(); clearLink(); onChange(); };
  // As the pulldowns' "clear all": back to nothing ticked, which shows everything.
  const clear = el(`<div style="margin-bottom:4px"><span class="link">${tr('clear all')}</span></div>`);
  pop.insertBefore(clear, pop.children[1] || null);
  const clearLink = () => { clear.style.display = selected.length ? '' : 'none'; };
  clear.querySelector('.link').onclick = () => { for (const i of pop.querySelectorAll('input:checked')) i.checked = false; selected = []; filters[f.key] = f.none; title(); clearLink(); onChange(); };
  clearLink();
  document.addEventListener('mousedown', e => { if (wrap.open && !wrap.contains(e.target)) wrap.open = false; });
  // Opened near the window's right edge: moved left until it fits.
  wrap.addEventListener('toggle', () => { if (!wrap.open) return; pop.style.left = '0'; const over = pop.getBoundingClientRect().right - (document.documentElement.clientWidth - 8); if (over > 0) pop.style.left = -over + 'px'; });
  title();
  return wrap;
}
// Platform: a pulldown you can type into (60+ platforms) -- the combo box, single choice.
// One entry per system: the members of a platform group (Famicom / NES, ...) are offered as
// the group's first platform, labelled with every member's name; the server matches them all.
function platformFilterOptions() {
  const all = vocab ? vocab.platforms : [], groups = (vocab && vocab.platform_groups) || [];
  const hidden = new Set(groups.flatMap(g => g.slice(1)));
  return all.filter(p => !hidden.has(p.id)).map(p => {
    const group = groups.find(g => g[0] === p.id);
    const names = group ? [...new Set(group.map(id => (all.find(x => x.id === id) || {}).name).filter(Boolean))] : [p.name];
    return { value: String(p.id), label: names.join(' / ') };
  });
}

    }
  });
}

// --- review queues (merge review, aspect review) ---
// The Titles list's filters, with a set: what both review queues narrow by.
async function reviewFilters(extra) {
  let sets = [];
  try { const v = await api('/api/v1/sets'); sets = Array.isArray(v) ? v : (v.items || []); } catch (e) {}
  const setFilter = { key: 'set_id', label: trc('sets', 'set'), type: 'select', options: () => `<option value="">${tr('any set')}</option>` + sets.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('') };
  return [setFilter, platformFilter(), viewFilter(), kindsFilter(), materialFilter()].concat(extra || [], facetFilters());
}
// The filters' query pairs (no paging). The release kinds only when picked: the list's default
// kinds would narrow every review to the Titles list's rows for nothing.
function reviewParams(st) {
  return Object.assign({ search: st.search, platforms: st.filters.platform, kinds: st.filters.kinds, material: st.filters.material, view: st.filters.view, set_id: st.filters.set_id }, facetParams(st));
}
const REVIEW_KINDS = () => ({ international: tr('International'), directors_cut: tr("Director's Cut"), translated_name: tr('translated name'), bundle_vs_game: tr('bundle to split'), split_names: tr('another game inside'), igdb: tr('same IGDB game') });
function reviewOptionLabel(o, variant) {
  return { with_foreign: trf('{variant} with the foreign versions, the Japanese original apart', { variant }), alone: trf('{variant} apart, the Japanese original with the foreign versions', { variant }), merge: tr('merge into one title'), split: tr('give these releases a title of their own'), split_bundle: tr("split into the single games, each joining its game's title") }[o.label] || o.label;
}
// One queue page: a card for the item at `at`, and the list under it. `drawCard(host, item,
// next)` fills the card; a decision reloads both.
async function reviewQueue({ heading, explain, path, gridKey, columns, extraFilters, extraParams, drawCard }) {
  await loadFacets().catch(() => null);
  view.innerHTML = `<div class="card"><h2>${esc(heading)}</h2><p class="muted">${esc(explain)}</p></div><div class="card" id="rv-card"><span class="muted">${tr('loading…')}</span></div><div id="grid"></div>`;
  const cardHost = document.getElementById('rv-card');
  let params = {}, at = 0, grid = null;
  const drawAt = async () => {
    let page;
    try { page = await api(path + qs(Object.assign({}, params, { limit: 1, offset: at }))); } catch (e) { cardHost.innerHTML = `<span class="bad">${esc(e.message)}</span>`; return; }
    const it = page.items[0];
    if (!it) {
      cardHost.innerHTML = page.total && at ? `${tr('End of the queue.')} <button class="btn small" id="rv-start">${tr('back to the start')}</button>` : tr('Nothing to review here.');
      const start = cardHost.querySelector('#rv-start'); if (start) start.onclick = () => { at = 0; drawAt(); };
      return;
    }
    const nav = el(`<div class="toolbar" style="margin-top:8px"></div>`);
    const go = n => { at = Math.max(0, n); drawAt(); };
    await drawCard(cardHost, it, { position: at + 1, total: page.total, nav, skip: () => go(at + 1), back: () => go(at - 1), done: () => { drawAt(); if (grid) grid.reload(); } });
    const skip = el(`<button class="btn">${tr('Skip')} ›</button>`); skip.onclick = () => go(at + 1);
    const back = el(`<button class="btn" ${at === 0 ? 'disabled' : ''}>‹ ${tr('Back')}</button>`); back.onclick = () => go(at - 1);
    nav.append(' ', skip, ' ', back);
    cardHost.appendChild(nav);
    cardHost.tabIndex = 0;
    cardHost.onkeydown = e => { if (e.key === 'ArrowRight') go(at + 1); if (e.key === 'ArrowLeft') go(at - 1); };
  };
  const gridHost = document.getElementById('grid');
  gridHost.addEventListener('click', e => { const t = e.target.closest('[data-rv-pos]'); if (t) { at = Number(t.dataset.rvPos); drawAt(); cardHost.scrollIntoView({ behavior: 'smooth' }); } });
  grid = makeGrid(gridHost, {
    columns,
    filters: await reviewFilters(extraFilters),
    fetch: async st => {
      const p = Object.assign(reviewParams(st), extraParams ? extraParams(st) : {});
      const changed = JSON.stringify(p) !== JSON.stringify(params);
      params = p;
      if (changed) { at = 0; drawAt(); }
      const page = await api(path + qs(Object.assign({}, p, { limit: st.limit, offset: st.offset })));
      page.items.forEach((x, i) => { x.position = st.offset + i; });
      return page;
    },
  });
}
