  for (const b of view.querySelectorAll('[data-art]')) b.onclick = async () => { try { const r = await api('/api/v1/sources/' + b.dataset.art + '/media', { method: 'POST' }); watchJob(r.job_id, watch, () => showSources()); } catch (err) { toast(err.message, true); } };
  for (const b of view.querySelectorAll('[data-trust]')) b.onclick = async () => {
    if (!confirm(tr('Forget the certificate trusted for this source? The next connection trusts whatever it presents -- only do this if its certificate was replaced on purpose.'))) return;
    try { await api('/api/v1/sources/' + b.dataset.trust + '/trust', { method: 'POST', body: {} }); toast(tr('the next connection will trust its new certificate')); showSources(); } catch (err) { toast(err.message, true); }
  };
  for (const b of view.querySelectorAll('[data-forget]')) b.onclick = async () => { const s = byId(b.dataset.forget); if (!confirm(trf('Forget everything mirrored from {name}? The source stays; its mirrored rows are removed and come back on the next sync.', { name: s.name }))) return; try { const r = await api('/api/v1/sources/' + s.id + '/forget', { method: 'POST' }); toast(trf('removed {n} mirrored row(s)', { n: r.rows_removed })); showSources(); } catch (err) { toast(err.message, true); } };
  for (const b of view.querySelectorAll('[data-del]')) b.onclick = async () => { const s = byId(b.dataset.del); if (!confirm(trf('Delete the source {name}? Its mirrored rows stay until you forget them; adding the same address again revives it.', { name: s.name }))) return; try { await api('/api/v1/sources/' + s.id, { method: 'DELETE' }); toast(tr('deleted')); showSources(); } catch (err) { toast(err.message, true); } };
}

// Where a source's paths appear on this machine. A copy from another machine is a plain file
// copy of the resolved path, so a source with no mount can be browsed but not copied from.
// The prefix is a path on the *other* machine (D:\Roms, /srv/roms); the local path is where
// that share is mounted here.
async function sourceMounts(host, sourceId, sourceName) {
  let list = [];
  try { list = await api('/api/v1/sources/' + sourceId + '/mounts'); } catch (e) { host.innerHTML = `<span class="bad">${esc(e.message)}</span>`; return; }
  const open = host.querySelector('details') && host.querySelector('details').open;
  host.innerHTML = `<details style="margin-top:4px" ${open ? 'open' : ''}><summary class="muted">${trf('mounts ({n})', { n: list.length })}</summary>
    <table class="grid"><thead><tr><th>${tr('its path')}</th><th>${tr('here')}</th><th>${tr('checked')}</th><th></th></tr></thead><tbody>
    ${list.length ? list.map(m => `<tr><td class="mono">${esc(m.remote_prefix)}</td><td class="mono">${esc(m.local_path)}</td><td class="muted">${m.last_verified_at ? fmtDate(m.last_verified_at) : tr('never')}<div data-mcheck="${m.id}"></div></td>
      <td style="white-space:nowrap"><span class="link" data-mcheckbtn="${m.id}">${tr('check')}</span> <span class="link" data-mdel="${m.id}">${tr('remove')}</span></td></tr>`).join('') : `<tr><td colspan="4" class="muted">${tr('none — add one to copy files from this source')}</td></tr>`}
    </tbody></table><button class="btn small" type="button" data-madd>${tr('add a mount…')}</button></details>`;
  const reload = () => sourceMounts(host, sourceId, sourceName);
  for (const b of host.querySelectorAll('[data-mcheckbtn]')) b.onclick = async () => {
    const out = host.querySelector(`[data-mcheck="${b.dataset.mcheckbtn}"]`); out.textContent = tr('checking…');
    try { const c = await api('/api/v1/mounts/' + b.dataset.mcheckbtn + '/check', { method: 'POST', body: {} }); out.innerHTML = `${badge(c.ok ? tr('ok') : tr('wrong'), c.ok ? 'ok' : 'bad')} <span class="muted">${esc(c.detail)}</span>`; }
    catch (e) { out.innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  };
  for (const b of host.querySelectorAll('[data-mdel]')) b.onclick = async () => {
    if (!confirm(tr('Remove this mount? Only the mapping is removed — nothing on disk is touched.'))) return;
    try { await api('/api/v1/mounts/' + b.dataset.mdel, { method: 'DELETE' }); toast(tr('removed')); reload(); } catch (e) { toast(e.message, true); }
  };
  host.querySelector('[data-madd]').onclick = () => mountDialog(sourceId, sourceName, reload);
}

async function mountDialog(sourceId, sourceName, done) {
  let roots = [], rootsError = '';
  try { const r = await api('/api/v1/sources/' + sourceId + '/roots'); roots = Array.isArray(r) ? r : (r.items || []); } catch (e) { rootsError = e.message; }
  const box = openModal(`<h3>${esc(trf('Mount {name}', { name: sourceName }))}</h3>
    <p class="muted">${tr('Copying from another machine is a plain file copy, so its collection has to be reachable here — mounted over SMB, NFS, or whatever you use. Tell romexplorer where its paths turn up on this machine and it can work the rest out.')}</p>
    <div class="kv" style="grid-template-columns:max-content 1fr; gap:6px 10px">
      <div>${tr('its collection root')}</div><div><select data-root><option value="">${tr('— pick one, or type a parent below —')}</option>${roots.map(r => `<option value="${esc(r.path)}">${esc(r.path)}</option>`).join('')}</select>${rootsError ? `<div class="bad">${esc(rootsError)}</div>` : ''}</div>
      <div>${tr('its path')}</div><div><input type="text" data-prefix style="width:100%" placeholder="D:\\Roms · /srv/roms · \\\\nas\\share\\Roms"><div class="muted">${tr('Exactly as that machine writes it. A parent of several roots works too.')}</div></div>
      <div>${tr('here')}</div><div><input type="text" data-local data-browse style="width:100%" placeholder="${tr('where that share is mounted on this machine')}"></div>
    </div>
    <div class="card bad" data-err style="display:none"></div>
    <div class="fsfoot"><span class="grow"></span><button type="button" class="btn" data-cancel>${tr('cancel')}</button><button type="button" class="btn primary" data-add disabled>${tr('add')}</button></div>`);
  const prefix = box.querySelector('[data-prefix]'), add = box.querySelector('[data-add]');
  const local = () => box.querySelector('[data-local]');
  const ready = () => { add.disabled = !prefix.value.trim() || !local().value.trim(); };
  box.querySelector('[data-root]').onchange = e => { prefix.value = e.target.value; ready(); };
  prefix.oninput = ready;
  box.querySelector('[data-cancel]').onclick = closeModal;
  await attachBrowse(box);
  local().oninput = ready; local().onchange = ready;
  add.onclick = async () => {
    try { await api('/api/v1/sources/' + sourceId + '/mounts', { method: 'POST', body: { remote_prefix: prefix.value.trim(), local_path: local().value.trim(), enabled: true } }); toast(tr('mount added')); closeModal(); done(); }
    catch (e) { const err = box.querySelector('[data-err]'); err.textContent = e.message; err.style.display = ''; }
  };
}

function sourceDialog(s, done) {
  const box = openModal(`<h3>${s.id ? tr('Edit source') : tr('Add source')}</h3><form id="src-form" class="kv" style="grid-template-columns:110px 1fr">
    <div>${tr('name')}</div><div><input name="name" value="${esc(s.name)}" required style="width:100%"></div>
    <div>${tr('address')}</div><div><input name="base_url" value="${esc(s.base_url)}" required style="width:100%" placeholder="http://192.168.1.10:7337"><div class="muted">${tr("host and port only, no /api/v1 — a main server's main port, a peer's share port")}</div></div>
    <div>${tr('sign in as')}</div><div><input name="username" style="width:48%" autocomplete="off" placeholder="${tr('username on that machine')}"> <input name="password" type="password" style="width:48%" autocomplete="off" placeholder="${tr('password')}">
      <div class="muted">${tr('This machine signs in once and keeps only the token it is given for itself — the password is not stored. Its certificate is trusted on that first connection.')}</div></div>
    <div>${tr('or a token')}</div><div><input name="token" type="password" style="width:100%" autocomplete="off" placeholder="${s.id ? (s.has_token ? tr('stored — leave blank to keep it') : tr('none stored')) : tr("the other machine's bearer token")}"></div>
    <div>${tr('role')}</div><div><label><input type="radio" name="role" value="peer" ${s.role !== 'main' ? 'checked' : ''}> ${tr('peer — a share; its collection shows as "on a peer"')}</label><br><label><input type="radio" name="role" value="main" ${s.role === 'main' ? 'checked' : ''}> ${tr("main server — this machine's catalogue comes from it")}</label></div>
    <div>${tr('enabled')}</div><div><label><input type="checkbox" name="enabled" ${s.enabled !== false ? 'checked' : ''}> ${tr('enabled')}</label></div>
    <div></div><div><button class="btn primary">${tr('save')}</button> <button class="btn" type="button" id="src-cancel">${tr('cancel')}</button></div></form>`);
  box.querySelector('#src-cancel').onclick = closeModal;
  const f = box.querySelector('#src-form');
  const send = body => api(s.id ? '/api/v1/sources/' + s.id : '/api/v1/sources', { method: s.id ? 'PUT' : 'POST', body });
  f.onsubmit = async ev => {
    ev.preventDefault();
    const body = { name: f.name.value.trim(), base_url: f.base_url.value.trim(), role: f.role.value, enabled: f.enabled.checked };
    if (f.token.value) body.token = f.token.value;
    if (f.username.value.trim()) { body.username = f.username.value.trim(); body.password = f.password.value; }
    try { await send(body); toast(tr('saved')); closeModal(); done(); }
    catch (err) {
      if (!err.message.startsWith('conflict')) return toast(err.message, true);
      // Designating a main server on a machine that built its own catalogue: the server
      // refuses without consent and says what would be lost. Ask, then resend with it.
      closeModal();
      consentDialog(tr("Replace this machine's catalogue?"), err.message.replace(/^conflict: /, ''), async media => {
        try { await send(Object.assign({}, body, { replace_catalog: true, media })); toast(tr('saved — the catalogue was cleared; run a sync now')); done(); } catch (e2) { toast(e2.message, true); }
      });
    }
  };
}

// Config > Users: who may use this server over the network. The desktop app has had this
// screen; the console told a setup-token session to "create the admin account in the app"
// and then offered nowhere to do it, which left a server with no desktop app beside it stuck.
async function showUsers() {
  const me = await api('/api/v1/auth/me');
  const setup = me.kind === 'setup';
  let html = '';
  if (setup) {
    html += `<div class="card warn"><h2>${tr('Signed in with the setup token')}</h2><p>${esc(tr('Create an admin account below. The moment one exists, the setup token stops working and its file is deleted — this app then signs in with the new account.'))}</p></div>`;
  } else if (me.kind === 'user' && me.user) {
    const u = me.user;
    html += `<div class="card"><h2>${tr('Your account')}</h2>
      <p><b>${esc(u.username)}</b> ${badge(u.role, u.role === 'admin' ? 'ok' : 'dim')}${u.can_upload && u.role !== 'admin' ? ' ' + badge(tr('upload'), 'ok') : ''}</p>
      <details><summary>${tr('change password')}</summary>
        <form id="pw-form" class="kv" style="grid-template-columns:140px 1fr">
          <div>${tr('current')}</div><div><input name="current" type="password" autocomplete="current-password"></div>
          <div>${tr('new')}</div><div><input name="new" type="password" autocomplete="new-password"></div>
          <div>${tr('again')}</div><div><input name="again" type="password" autocomplete="new-password"></div>
          <div></div><div><button class="btn primary">${tr('change')}</button></div>
        </form></details>
      <div id="my-devices"></div></div>`;
  }
  let list = [];
  if (me.admin) {
    list = await api('/api/v1/users');
    const yn = v => v ? badge(tr('yes'), 'ok') : badge(tr('no'), 'dim');
    html += `<div class="card"><h2>${tr('Accounts')}</h2>
    <div class="toolbar"><button class="btn primary" id="user-add">${setup && !list.length ? tr('create the admin account') : tr('add account')}</button></div>
    <table class="grid"><thead><tr><th>${tr('username')}</th><th>${tr('role')}</th><th>${tr('upload')}</th><th>${tr('enabled')}</th><th>${tr('password')}</th><th>${tr('devices')}</th><th>${tr('last sign-in')}</th><th></th></tr></thead>
    <tbody>${list.length ? list.map(u => `<tr><td>${esc(u.username)}</td><td>${badge(u.role, u.role === 'admin' ? 'ok' : 'dim')}</td><td>${yn(u.can_upload || u.role === 'admin')}</td><td>${yn(u.enabled)}</td>
      <td>${u.has_password ? badge(tr('set'), 'ok') : badge(tr('needs one'), 'bad')}</td><td class="num">${u.devices}</td><td>${fmtDate(u.last_login_at)}</td>
      <td style="white-space:nowrap"><span class="link" data-edit="${u.id}">${tr('edit')}</span> <span class="link" data-devices="${u.id}">${tr('devices')}</span> <span class="link" data-del="${u.id}">${tr('delete')}</span></td></tr>`).join('') : `<tr><td colspan="8" class="muted">${tr('no accounts yet')}</td></tr>`}</tbody></table></div>`;
  }
  view.innerHTML = html;
  const pw = document.getElementById('pw-form');
  if (pw) pw.onsubmit = async ev => {
    ev.preventDefault();
    if (pw.new.value !== pw.again.value) return toast(tr('the new passwords differ'), true);
    try {
      await api('/api/v1/auth/password', { method: 'PUT', body: { current: pw.current.value, new: pw.new.value } });
      toast(tr('password changed — your other devices are signed out')); pw.reset();
    } catch (e) { toast(e.message, true); }
  };
  const mine = document.getElementById('my-devices');
  if (mine) deviceList(mine, '/api/v1/auth/devices');
  if (!me.admin) return;
  document.getElementById('user-add').onclick = () => userDialog(null, setup);
  view.querySelectorAll('[data-edit]').forEach(a => a.onclick = () => userDialog(list.find(u => String(u.id) === a.dataset.edit), false));
  view.querySelectorAll('[data-devices]').forEach(a => a.onclick = () => {
    const box = openModal(`<h3>${tr('Devices')}</h3><div id="user-devices"></div><div class="fsfoot"><span class="grow"></span><button class="btn" id="devices-close">${tr('close')}</button></div>`);
    box.querySelector('#devices-close').onclick = () => { closeModal(); showUsers(); };
    deviceList(box.querySelector('#user-devices'), '/api/v1/users/' + a.dataset.devices + '/devices');
  });
  view.querySelectorAll('[data-del]').forEach(a => a.onclick = async () => {
    const u = list.find(x => String(x.id) === a.dataset.del);
    if (!confirm(trf('Delete the account {name}? Its devices are signed out.', { name: u.username }))) return;
    try { await api('/api/v1/users/' + u.id, { method: 'DELETE' }); showUsers(); } catch (e) { toast(e.message, true); }
  });
}
// Signed-in devices under `path` (one's own, or an account's for an admin), each revocable.
async function deviceList(host, path) {
  let list;
  try { list = await api(path); } catch (e) { host.innerHTML = `<div class="bad">${esc(e.message)}</div>`; return; }
  host.innerHTML = `<h3>${tr('Signed-in devices')}</h3><table class="grid"><thead><tr><th>${tr('device')}</th><th>${tr('signed in')}</th><th>${tr('last used')}</th><th></th></tr></thead>
    <tbody>${list.length ? list.map(d => `<tr><td>${esc(d.device)}${d.current ? ' ' + badge(tr('this one'), 'ok') : ''}</td><td>${fmtDate(d.created_at)}</td><td>${fmtDate(d.last_used_at)}</td>
      <td><span class="link" data-revoke="${d.id}">${tr('sign out')}</span></td></tr>`).join('') : `<tr><td colspan="4" class="muted">${tr('none')}</td></tr>`}</tbody></table>`;
  host.querySelectorAll('[data-revoke]').forEach(a => a.onclick = async () => {
    if (!confirm(tr('Sign this device out? It will have to sign in again.'))) return;
    try { await api(path + '/' + a.dataset.revoke, { method: 'DELETE' }); toast(tr('signed out')); deviceList(host, path); } catch (e) { toast(e.message, true); }
  });
}
// Add (null) or edit an account. On the setup token, creating an admin signs this browser in
// as that admin: the token is dead the moment one exists.
function userDialog(existing, setup) {
  const MIN = 8; // romexplorer_types::auth::MIN_PASSWORD_LEN
  const role = existing ? existing.role : (setup ? 'admin' : 'user');
  const box = openModal(`<h3>${existing ? esc(existing.username) : tr('add account')}</h3>
    <form id="user-form" class="kv" style="grid-template-columns:120px 1fr">
      <div>${tr('username')}</div><div><input name="username" autocomplete="off" value="${esc(existing ? existing.username : '')}" style="width:100%"></div>
      <div>${tr('password')}</div><div><input name="password" type="password" autocomplete="new-password" style="width:100%"></div>
      <div>${tr('role')}</div><div><select name="role"><option value="admin" ${role === 'admin' ? 'selected' : ''}>${tr('admin')}</option><option value="user" ${role === 'user' ? 'selected' : ''}>${tr('user')}</option></select></div>
      <div>${tr('upload')}</div><div><input name="can_upload" type="checkbox" ${existing && existing.can_upload ? 'checked' : ''}></div>
      <div>${tr('enabled')}</div><div><input name="enabled" type="checkbox" ${!existing || existing.enabled ? 'checked' : ''}></div>
      <div></div><div><button class="btn primary">${tr('save')}</button> <button type="button" class="btn" id="user-cancel">${tr('cancel')}</button></div>
    </form><div id="user-error" class="bad"></div>`);
  box.querySelector('#user-cancel').onclick = closeModal;
  box.querySelector('#user-form').onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, password = f.password.value, err = box.querySelector('#user-error');
    if (!existing && [...password].length < MIN) { err.textContent = trf('a password needs at least {n} characters', { n: MIN }); return; }
    const spec = { username: f.username.value.trim(), password: password || null, role: f.role.value, can_upload: f.can_upload.checked, enabled: f.enabled.checked };
    try {
      if (existing) await api('/api/v1/users/' + existing.id, { method: 'PUT', body: spec });
      else await api('/api/v1/users', { method: 'POST', body: spec });
    } catch (e) { err.textContent = e.message; return; }
    closeModal();
    if (setup && !existing && spec.role === 'admin') {
      try {
        await api('/api/v1/auth/login', { method: 'POST', body: { username: spec.username, password, device: 'console', cookie: true, console: true } });
        token = ''; localStorage.removeItem(TOKEN_KEY); location.reload();
      } catch (e) { toast(trf('account created, but signing in failed: {error}', { error: e.message }), true); }
      return;
    }
    toast(tr('saved')); showUsers();
  };
}

// Config > Mode, read-only here: a server is always standalone, and whether a *desktop*
// machine builds its own catalogue or takes this one is chosen in the desktop app there.
async function showMode() {
  const m = await api('/api/v1/mode');
  view.innerHTML = `<div class="card"><h2>${tr('Instance mode')}</h2>
    <div class="kv"><div>${tr('current')}</div><div>${badge(m.mode, 'ok')}</div>
      <div>${tr('catalogue')}</div><div>${trf('{n} releases', { n: m.releases })}${m.releases ? ', ' + tr('built here') : ''}</div></div>
    <p class="muted">${tr('A server is always standalone: it builds the catalogue that client machines take from it. Whether a desktop machine is standalone or a client is chosen in the desktop app on that machine, under Config › Mode.')}</p></div>`;
}
</script>
