[package]
name = "playmatch_deredis"
version = "0.1.0"
edition = "2024"
publish = false
description = "Vendored, de-redis'd subset of playmatch (MIT) -- raw metadata provider clients only, no Postgres/Redis dependency. See README.md."

[lib]
name = "playmatch_deredis"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
anyhow = "1"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rand = "0.10"
lazy_static = "1"
num_cpus = "1.16"
tower = { version = "0.5", features = ["util", "limit", "retry"] }
oauth2 = { version = "5", features = ["reqwest"] }
utoipa = "4"
sha2 = "0.11"
hex = "0.4"
bigdecimal = { version = "0.4", features = ["serde-json"] }
uuid = { version = "1", features = ["serde", "v4"] }
